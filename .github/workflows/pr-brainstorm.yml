# Second unattended session for slidekit: PR triage + idea brainstorming.
# MANUAL ONLY since 2026-06-19 (its nightly cron was disabled by operator request — see the
# `on:` block). Trigger it on demand from the Actions tab; run it after a nightly build has
# finished if you want it to evaluate the latest state.
# This session READS open PRs (gh CLI, pull-requests: read), evaluates each for
# utility against PLAN.md, and appends brainstormed ideas to IDEAS.md for the
# operator to review and approve. It is BRAINSTORM-ONLY: it never merges, comments
# on, or modifies any PR, and never changes product code — its sole write is IDEAS.md.
# Requires the CLAUDE_CODE_OAUTH_TOKEN repository secret (subscription auth).
# NOTE: scheduled workflows only fire from the repository's default branch (main).
name: pr-brainstorm-slidekit

on:
  # Nightly schedule DISABLED 2026-06-19 (operator request — "turn off the second job at
  # night"). This session now runs MANUALLY ONLY via workflow_dispatch (Actions tab →
  # pr-brainstorm-slidekit → Run workflow). To re-enable the nightly cron, uncomment the
  # schedule block below (it ran at 13:30 UTC = 06:30 Pacific PDT, 4.5h after the build).
  # schedule:
  #   - cron: "30 13 * * *"
  workflow_dispatch: {}

# Independent of the nightly build's concurrency group; they are 6h apart and never overlap.
concurrency:
  group: pr-brainstorm-slidekit
  cancel-in-progress: false

permissions:
  contents: write # commit IDEAS.md
  pull-requests: read # read open PRs/diffs via gh
  id-token: write # claude-code-action exchanges an OIDC token for its GitHub credentials
  actions: read

jobs:
  brainstorm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Load brainstorm prompt
        id: prompt
        run: |
          {
            echo 'PROMPT<<BRAINSTORM_PROMPT_EOF'
            cat BRAINSTORM_PROMPT.md
            echo ''
            echo 'CI NOTE: You are running inside GitHub Actions on an ephemeral runner.'
            echo 'The gh CLI is pre-installed and authenticated via $GH_TOKEN (pull-requests:'
            echo 'read) — use it to read PRs: `gh pr list`, `gh pr view <n>`, `gh pr diff <n>`.'
            echo 'Your ONLY file write is IDEAS.md. Work is preserved only if pushed — after'
            echo 'writing IDEAS.md run: git add IDEAS.md && git commit -m "..." && git push origin HEAD'
            echo 'BRAINSTORM_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GH_TOKEN: ${{ github.token }} # authenticates the agent's `gh` calls (read-only PR scope)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.PROMPT }}
          # Read/Write/Edit + Bash (for gh) to read PRs and write IDEAS.md; Web* to research
          # the value/novelty of ideas. --model opus: run on the latest Opus.
          claude_args: --allowedTools "Read,Edit,Write,Bash,WebSearch,WebFetch" --model opus
          show_full_output: "true"

      # The action reports success even when the Claude session errors out; surface that.
      - name: Fail if Claude session errored
        run: |
          f="${{ steps.claude.outputs.execution_file }}"
          if [ -z "$f" ] || [ ! -f "$f" ]; then
            echo "No execution log produced — Claude session never ran"; exit 1
          fi
          jq -e 'if type=="array" then last else . end | .is_error != true' "$f" \
            || { echo "Claude session ended in error — see execution log above"; exit 1; }

      # The action revokes its own GitHub token when it finishes; re-auth for the safety-net push.
      - name: Push any unpushed commits
        if: always()
        run: |
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin HEAD || true
