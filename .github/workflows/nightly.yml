# Nightly unattended build session for slidekit (see PLAN.md "Overnight routine").
# Runs Claude Code headless with the verbatim contents of NIGHTLY_PROMPT.md.
# Requires the CLAUDE_CODE_OAUTH_TOKEN repository secret (subscription auth;
# generate with `claude setup-token` on your machine).
# NOTE: scheduled workflows only fire from the repository's default branch.
name: nightly-slidekit

on:
  schedule:
    # 00:00 America/Los_Angeles during PDT. GitHub cron is UTC and ignores DST,
    # so during PST this fires at 23:00 local — adjust to "0 8 * * *" if exact
    # midnight matters more than consistency.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

# Never let two nightly sessions overlap.
concurrency:
  group: nightly-slidekit
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # claude-code-action exchanges an OIDC token for its GitHub credentials
  actions: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Load nightly prompt
        id: prompt
        run: |
          {
            echo 'PROMPT<<NIGHTLY_PROMPT_EOF'
            cat NIGHTLY_PROMPT.md
            echo ''
            echo 'CI NOTE: You are running inside GitHub Actions on an ephemeral runner.'
            echo 'Work is preserved only if pushed — after each commit, and again at'
            echo 'session wrap-up, run: git push origin HEAD'
            echo 'NIGHTLY_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.PROMPT }}
          # Tool scope per PLAN.md setup step 4 (scoped allowlist, no permission bypass).
          # --model opus: run on the latest Opus (alias resolves per installed CLI).
          claude_args: --allowedTools "Read,Edit,Write,Bash" --model opus
          # Keep full output: the run's modelUsage/cost block is logged here, which
          # is how nightly spend is tracked (matters more now that runs use Opus).
          show_full_output: "true"

      # The action reports success even when the Claude session errors out
      # (e.g. missing/invalid CLAUDE_CODE_OAUTH_TOKEN); surface that as a red run.
      - name: Fail if Claude session errored
        run: |
          f="${{ steps.claude.outputs.execution_file }}"
          if [ -z "$f" ] || [ ! -f "$f" ]; then
            echo "No execution log produced — Claude session never ran"; exit 1
          fi
          jq -e 'if type=="array" then last else . end | .is_error != true' "$f" \
            || { echo "Claude session ended in error — see execution log above"; exit 1; }

      # The action revokes its own GitHub token when it finishes, so re-auth with
      # the workflow token before the safety-net push.
      - name: Push any unpushed commits
        if: always()
        run: |
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin HEAD || true
