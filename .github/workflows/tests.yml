# Full test-suite gate — runs pytest on every push to main and every pull request.
#
# This is the project's green-suite gate made visible in CI (complements
# verify.yml, which only runs the render-drift harness on layout/metrics/emit
# changes). `pip install -e ".[dev]"` puts the `slidekit` CLI on PATH, which some
# tests shell out to.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install slidekit (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run the full test suite
        run: python -m pytest -q
