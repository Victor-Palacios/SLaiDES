# Turn a "Layout feedback" issue (filed via .github/ISSUE_TEMPLATE/layout-feedback.yml)
# into a FEEDBACK.yaml entry, then let the nightly act on it.
#
# Security: the job runs ONLY for issues labelled `feedback` AND authored by the repo
# owner (issue bodies are untrusted external input — see the repo's external-content
# note). The body is passed to the parser as an ENV var, never interpolated into a shell
# command, and the parser validates the layout against the catalog before anything is
# written. A non-owner or malformed issue produces no commit.
name: Feedback intake

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: feedback-intake
  cancel-in-progress: false

jobs:
  intake:
    # Trigger on the `feedback` label OR the form's `[feedback]` title prefix — the label
    # only applies if it already exists in the repo, so the title prefix keeps intake working
    # even before the label is created. Always gated to issues the repo owner authored.
    if: >-
      (contains(github.event.issue.labels.*.name, 'feedback') ||
       startsWith(github.event.issue.title, '[feedback]')) &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install slidekit
        run: pip install -e . -q

      - name: Parse issue + merge into FEEDBACK.yaml
        id: intake
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/feedback_intake.py

      - name: Commit FEEDBACK.yaml + FEEDBACK.md
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FEEDBACK.yaml FEEDBACK.md
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "feedback: record ${{ steps.intake.outputs.feedback_id }} (${{ steps.intake.outputs.component }}) from issue #${{ github.event.issue.number }}"
            git push origin HEAD:main
          fi

      - name: Confirm on the issue and close it
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "Recorded as **${{ steps.intake.outputs.feedback_id }}** for layout \`${{ steps.intake.outputs.component }}\` in \`FEEDBACK.yaml\`. The nightly routine will pick it up. Thanks!"
          gh issue close "${{ github.event.issue.number }}"

      - name: Report a parse failure back on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "I couldn't record this as layout feedback. Please file it with the **Layout feedback** form (pick a layout from the dropdown and add a comment). The issue stays open for you to edit." || true
