# Generated by scripts/build_feedback_form.py from src/slidekit/catalog/registry.py.
# Do not hand-edit: the Layout dropdown must mirror the catalog (a test enforces sync).
name: Layout feedback
description: Comment on a specific slide layout
title: "[feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Leave a comment on one slide **layout**. To see the layouts, open the latest
        combined preview PDF in `examples/pdf/combined/` (it renders in the GitHub mobile
        app), then pick the layout's name below. The nightly routine reads `open` feedback,
        queues it on the board, and marks it `done`.
  - type: dropdown
    id: component
    attributes:
      label: Layout
      description: The component this feedback is about.
      options:
        - agenda
        - before-after
        - big-number
        - bullet-list
        - card-grid
        - chart-slide
        - chart-with-insight
        - code
        - comparison-columns
        - comparison-matrix
        - definition
        - feature-list
        - funnel
        - icon-text-rows
        - image-full-bleed
        - image-grid
        - image-half-bleed
        - kpi-grid
        - logo-wall
        - matrix-2x2
        - metric-comparison
        - numbered-steps
        - process-steps
        - pros-cons
        - pull-quote
        - pyramid
        - question
        - quote-opener
        - roadmap
        - section-divider
        - stat-callout
        - statement
        - swot
        - table-slide
        - team-grid
        - testimonial
        - this-vs-that
        - timeline
        - title-slide
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Your comment
      description: What works, what doesn't, and what you'd change.
      placeholder: e.g. the hero value sits too low on the canvas; lift it to the optical centre.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How strongly you feel about it (optional).
      options:
        - low
        - med
        - high
      default: 1
    validations:
      required: false
