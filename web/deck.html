<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>slidekit · deck review</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div>
      <h1>Deck review</h1>
      <p class="sub">Comment on any slide. Choose whether a note fixes <b>this slide</b>
        or the reusable <b>layout &amp; theme</b> (every future deck).
        <a href="/">Review queue →</a> · <a href="/gallery.html">All layouts →</a></p>
    </div>
    <div class="counts" id="counts" aria-live="polite"></div>
  </div>
</header>

<div class="gridbar">
  <label class="deckpick-label">Deck
    <select id="deckpick" class="deckpick"></select>
  </label>
</div>

<main id="deck" class="gallery" aria-busy="true">
  <p class="loading">Loading decks…</p>
</main>

<footer class="submitbar">
  <div class="submitbar-inner">
    <span id="pending" class="pending">No marks yet.</span>
    <button id="submit" class="submit" disabled>Submit feedback</button>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/deck.js"></script>
</body>
</html>
