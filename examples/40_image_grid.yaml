version: 1
theme:
  palette:
    primary: "#1B4F8A"
    surface: "#FFFFFF"
    accent: "#2A9D8F"
    text: "#1A1A2E"
    muted: "#8A8A9A"
  font: arial
page_numbers:
  enabled: true
slides:
  - component: image-grid
    title: "Experience Gallery"
    images:
      - {type: image, path: "examples/assets/discover.jpg", fit: cover, alt: "Discovery"}
      - {type: image, path: "examples/assets/configure.jpg", fit: cover, alt: "Configuration"}
      - {type: image, path: "examples/assets/launch.jpg", fit: cover, alt: "Launch"}
      - {type: image, path: "examples/assets/measure.jpg", fit: cover, alt: "Measurement"}
    captions: ["Discover", "Configure", "Launch", "Measure"]
