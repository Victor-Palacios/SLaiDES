# Immersion Week SF · Day 3 · Session 3.2
# "Peer Red-Team Round" (10:00–10:55, 55 min)
# Source: https://github.com/UChiCareersinAI/ImmersionWeekSF
#
# Objectives (verbatim from the syllabus):
#   1. Break another team's prototype — run their test script by hand, then turn
#      your testing agent loose on it
#   2. Use Nvidia's free LLM API to generate adversarial inputs in bulk, so
#      volume costs you nothing
#   3. Log every failure with reproduction steps and a severity — and receive
#      your own log without defending it
#
# No palette block: this deck rides the slidekit default colour scheme.
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  # ── Open ───────────────────────────────────────────────────────────────────
  - component: title-slide
    title: "Peer Red-Team Round"
    subtitle: "Immersion Week SF · Day 3 · Session 3.2"
    notes: >-
      This is session 3.2, the Peer Red-Team Round — the session everyone
      remembers. Two teams swap prototypes and spend an hour trying to break
      each other's work.

  - component: big-number
    value: "55"
    label: "Minutes"
    context: "You leave holding your own log"
    notes: >-
      Fifty-five minutes, and you leave holding a written list of your own
      failures, produced by people with no reason to be gentle.

  - component: agenda
    title: "What This Session Covers"
    items:
      - "Swap builds with another team"
      - "Break it by hand, then by agent"
      - "Generate inputs in bulk, free"
      - "Trade logs without defending"
    notes: >-
      Four things this session. We swap builds with another team, break it by
      hand and then by agent, generate inputs in bulk for free, and trade logs
      without defending them.

  - component: question
    question: "Whose build will you break?"
    notes: >-
      First: whose build will you break? We pair now, and every minute after
      that is testing time.

  - component: this-vs-that
    title: "From 3.1 to Now"
    left:
      value: "A plan"
      label: "An inventory, a probe"
    right:
      value: "A round"
      label: "Pointed at real software"
    notes: >-
      Last session designed the attack in the abstract. This one runs it against
      real software, which is both easier and considerably more revealing.

  - component: process-steps
    title: "How We Get There"
    steps:
      - label: "Swap"
        body: "URLs, caveats, edge cases"
      - label: "Hand"
        body: "Ten minutes, yourself"
      - label: "Probe"
        body: "Turn the agent loose"
      - label: "Trade"
        body: "Logs back, no arguing"
    notes: >-
      Four moves: swap URLs, caveats and edge cases; ten minutes of your own
      hands; turn the agent loose; then trade logs back with no arguing. Hands
      before agent — that order matters.

  - component: timeline
    title: "The Next 55 Minutes"
    events:
      - date: "10:00"
        title: "Swap"
        description: "Links and lists change hands"
      - date: "10:10"
        title: "By hand"
        description: "Their edge cases, run by you"
      - date: "10:25"
        title: "At volume"
        description: "Agent and generated inputs"
      - date: "10:45"
        title: "Trade logs"
        description: "Hand it over, then receive"
    notes: >-
      The hour runs in four blocks, and 10:45 is the one that matters — logs
      change hands then, whatever state your testing is in. An unshared finding
      helps nobody, and the next session needs its full ten minutes.

  - component: pull-quote
    quote: "A friend who breaks it is a gift."
    attribution: "The red-team rule"
    notes: >-
      A friend who breaks it is a gift. Everything found in the next hour is
      found by someone with no stake in being kind and no ability to hurt you.

  # ── 01 · Break It by Hand ──────────────────────────────────────────────────
  - component: section-divider
    number: "01"
    title: "Break It by Hand"
    notes: >-
      First objective, first half: before any automation, one person clicking
      with intent.

  - component: definition
    term: "Red team"
    definition: "People trying to break it, on purpose, for you"
    notes: >-
      A red team is people trying to break it, on purpose, for you. Those last
      two words carry the definition — it is a service, not an opposition.

  - component: bullet-list
    title: "The Rules of the Round"
    items:
      - "Attack the build, never the team"
      - "Everything you find gets written"
      - "No fixing, only finding"
      - "No defending when it is your turn"
    notes: >-
      Four rules for the round. Attack the build, never the team. Everything you
      find gets written down. No fixing, only finding. And no defending when it
      is your turn.

  - component: numbered-steps
    title: "The Swap"
    steps:
      - title: "Trade three things"
        body: "The URL, the caveats, the edge cases"
      - title: "Say nothing else"
        body: "No walkthrough, no context, no warnings"
      - title: "Start the clock"
        body: "Ten minutes of hands before anything else"
    notes: >-
      Three steps. Trade three things: the URL, the caveats, and the edge cases.
      Say nothing else — no walkthrough, no context, no warnings. Then start the
      clock with ten minutes of hands.

  - component: bullet-list
    title: "What You Hand Over"
    items:
      - "The public URL from 2.3"
      - "CAVEATS.md, unedited"
      - "tests/edge-cases.md from 3.1"
      - "Nothing spoken out loud"
    notes: >-
      You hand over the public URL from yesterday, CAVEATS.md unedited, your
      edge-case file from last session, and nothing spoken out loud. Handing
      over the caveats feels like giving away answers and does the opposite.

  - component: numbered-steps
    title: "Your First Ten Minutes"
    steps:
      - title: "Use it normally, once"
        body: "The happy path, as a real person would"
      - title: "Run their own list"
        body: "Every case in their edge-case file"
      - title: "Then go off-script"
        body: "Whatever occurred to you while doing that"
    notes: >-
      Three steps for your first ten minutes. Use it normally once, the happy
      path, as a real person would. Run their own list, every case in their
      file. Then go off-script, with whatever occurred to you while doing that.

  - component: bullet-list
    title: "Why Hands Before Agents"
    items:
      - "You notice what looks wrong"
      - "You try things nobody wrote down"
      - "You feel the slow parts"
      - "You find the confusing screen"
    notes: >-
      Four things no probe will report back to you: what looks wrong, what
      nobody wrote down, what feels slow, and which screen is confusing.

  - component: comparison-matrix
    title: "What Each Method Finds"
    options: ["By hand", "By agent"]
    criteria: ["Confusing UI", "Rare inputs", "Speed"]
    cells:
      - ["Finds it", "Blind to it"]
      - ["Misses most", "Finds them"]
      - ["Ten minutes", "Hundreds fast"]
    highlights: [[0, 0], [1, 1]]
    notes: >-
      Neither method wins outright. Hands find the confusing interface and are
      blind to almost nothing about sense; agents miss the interface entirely
      but find rare inputs, and they do hundreds in the time you do ten.

  - component: bullet-list
    title: "How to Break What You Did Not Build"
    items:
      - "Do the obvious wrong thing first"
      - "Give it the opposite of the example"
      - "Click before it finishes"
      - "Try the same thing twice"
    notes: >-
      Four openers that work on almost anything. Do the obvious wrong thing
      first. Give it the opposite of the example. Click before it finishes. And
      try the same thing twice.

  - component: icon-text-rows
    title: "Three Postures That Work"
    rows:
      - icon: "user"
        heading: "The confused user"
        body: "Does the wrong thing sincerely, not cleverly"
      - icon: "clock"
        heading: "The impatient user"
        body: "Clicks twice, refreshes, will not wait"
      - icon: "mask"
        heading: "The bad actor"
        body: "Reads the page to work out what to abuse"
    notes: >-
      Three postures, and pick one to stay in. The confused user, who does the
      wrong thing sincerely rather than cleverly. The impatient user, who clicks
      twice, refreshes, and will not wait. And the bad actor, who reads the page
      to work out what to abuse.

  - component: two-panel-list
    title: "Two Kinds of Finding"
    left:
      title: "Not useful"
      items:
        - "\"It felt slow\""
        - "\"The design is rough\""
        - "\"It broke somehow\""
    right:
      title: "Useful"
      items:
        - "The exact input used"
        - "What came back instead"
        - "How to make it happen"
    accent_side: "right"
    notes: >-
      Not useful: “it felt slow”, “the design is rough”, “it broke somehow”.
      Useful: the exact input used, what came back instead, and how to make it
      happen again.

  - component: code
    title: "Write it down as it happens"
    code: |
      ## empty upload
      sent: no file, clicked Run
      got: spinner, forever, no message
      severity: high
      repro: open URL, click Run
    notes: >-
      Log it while the failure is on screen, not at the end. Five lines — what
      you sent, what you got, the severity, and how to reproduce it.

  - component: bullet-list
    title: "Do Not Do These"
    items:
      - "Do not fix anything you find"
      - "Do not tell them mid-round"
      - "Do not test their teammates"
      - "Do not stop at the first break"
    notes: >-
      Four things not to do. Do not fix anything you find. Do not tell them mid-
      round. Do not test their teammates. And do not stop at the first break —
      that is the most common one.

  # ── 02 · Volume for Free ───────────────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "Volume for Free"
    notes: >-
      Second objective: a human finds the interesting failures, and volume finds
      the ones nobody would think of. Volume no longer costs anything.

  - component: question
    question: "How many have you tried?"
    notes: >-
      About twenty minutes in: how many inputs have you actually tried? Most of
      you will be at ten or fifteen. The next twenty minutes should add a
      hundred.

  - component: bullet-list
    title: "Why Volume Finds More"
    items:
      - "Rare inputs need many tries"
      - "You repeat yourself, models vary"
      - "Combinations you would not pair"
      - "It never gets bored or polite"
    notes: >-
      Four reasons volume finds more. Rare inputs need many tries. You repeat
      yourself, and models vary. It pairs combinations you would not. And it
      never gets bored or polite.

  - component: definition
    term: "Nvidia's free API"
    definition: "Hosted models you can call in bulk at no cost"
    notes: >-
      Nvidia's free API is hosted models you can call in bulk at no cost. The
      point is not the provider — it is that a hundred adversarial inputs is now
      free rather than a budget decision.

  - component: numbered-steps
    title: "Standing It Up"
    steps:
      - title: "Get a key"
        body: "Sign in, create one, keep it out of git"
      - title: "Call it like any chat model"
        body: "The interface is the familiar one"
      - title: "Ask for inputs, not answers"
        body: "You want test material, not opinions"
    notes: >-
      Three steps, five minutes. Get a key, and keep it out of git. Call it like
      any chat model, since the interface is the familiar one. And ask for
      inputs rather than answers — you want ammunition, not commentary.

  - component: code
    title: "One call, a hundred inputs"
    code: |
      client = OpenAI(
        base_url="https://integrate.api.nvidia.com/v1",
        api_key=os.environ["NVIDIA_API_KEY"],
      )
      # then loop: ask for 20 at a time,
      # five times, one axis per batch.
    notes: >-
      An OpenAI-compatible interface, so existing code mostly works unchanged.
      Note the key comes from the environment, because a key pasted into a file
      that gets committed is a real risk on a public repo.

  - component: code
    title: "The generation prompt that works"
    code: |
      Here is what the tool accepts:
      <paste their README or caveats>

      Give me 20 inputs that are MALFORMED.
      Vary the way each one is broken.
      Output only the inputs, one per line.
    notes: >-
      Three moves in six lines: give it the target, name one axis, and demand
      variety. That last line — output only the inputs, one per line — saves you
      stripping commentary afterwards.

  - component: bullet-list
    title: "Ask for One Axis at a Time"
    items:
      - "Twenty empty-ish inputs"
      - "Twenty malformed ones"
      - "Twenty adversarial ones"
      - "Twenty out of scope"
    notes: >-
      Batch by axis: twenty empty-ish inputs, twenty malformed, twenty
      adversarial, twenty out of scope. Asking for a hundred mixed returns
      eighty of whichever axis it finds most obvious.

  - component: bullet-list
    title: "The Trap of Generated Inputs"
    items:
      - "They rhyme with each other"
      - "All broken the same way"
      - "Too polite to be adversarial"
      - "Plausible, but never weird"
    notes: >-
      Four ways a batch looks big and tests one thing. They rhyme with each
      other. They are all broken the same way. They are too polite to be
      adversarial. Or they are plausible but never weird.

  - component: table-slide
    title: "A Hundred Inputs, Spread"
    headers: ["Axis", "How to ask for it"]
    rows:
      - ["Empty", "Nothing, blank, whitespace"]
      - ["Malformed", "Wrong type, truncated"]
      - ["Adversarial", "Hidden instructions"]
      - ["Out of scope", "Real, but not your job"]
      - ["At scale", "Huge, repeated, parallel"]
    notes: >-
      The five axes again, now as generation prompts. Empty: nothing, blank,
      whitespace. Malformed: wrong type, truncated. Adversarial: hidden
      instructions. Out of scope: real, but not your job. At scale: huge,
      repeated, parallel.

  - component: numbered-steps
    title: "Turning the Probe Loose"
    steps:
      - title: "Point it at their URL"
        body: "The brief from 3.1, one line changed"
      - title: "Feed it the generated inputs"
        body: "Its starting list, not its only one"
      - title: "Let it run, and watch it"
        body: "Stopping rule armed, someone looking"
    notes: >-
      Three steps. Point it at their URL — your brief from last session with one
      line changed. Feed it the generated inputs as a starting list rather than
      the only one. And let it run while somebody watches, with the stopping
      rule armed.

  - component: bullet-list
    title: "Before You Point It at Them"
    items:
      - "Tell them the probe is starting"
      - "Agree a rate you both accept"
      - "Never test during their demo"
      - "Do not leave junk they must clear"
    notes: >-
      Four courtesies, and they are not merely polite. Tell them the probe is
      starting. Agree a rate you both accept. Never test during their demo. And
      do not leave junk they have to clear.

  - component: icon-text-rows
    title: "Three Rules at Volume"
    rows:
      - icon: "gauge"
        heading: "Do not flood them"
        body: "Space the requests; you share one URL"
      - icon: "filter"
        heading: "Cluster before logging"
        body: "Forty crashes of one cause is one finding"
      - icon: "eye"
        heading: "Read a sample yourself"
        body: "A pass rate you never looked at is a guess"
    notes: >-
      Three rules at volume. Do not flood them — space the requests, since you
      share one URL. Cluster before logging, because forty crashes of one cause
      is one finding. And read a sample yourself, because a pass rate you never
      looked at is a guess.

  - component: bullet-list
    title: "Triaging the Flood"
    items:
      - "Group by what actually broke"
      - "Keep the smallest example of each"
      - "Drop what their caveats admit"
      - "Rank what is left by severity"
    notes: >-
      Four steps to turn raw output into a usable log. Group by what actually
      broke. Keep the smallest example of each. Drop what their caveats already
      admit. Then rank what is left by severity.

  - component: pull-quote
    quote: "Volume is free. Attention is not."
    attribution: "Objective two, with the catch"
    notes: >-
      Volume is free, attention is not. Generating a thousand inputs costs
      nothing; reading a thousand results costs the session.

  # ── 03 · The Log, and Receiving It ─────────────────────────────────────────
  - component: section-divider
    number: "03"
    title: "The Log"
    notes: >-
      Third objective: everything you found has to become something another team
      can act on in fifty minutes, without you sitting next to them.

  - component: definition
    term: "Reproduction steps"
    definition: "Enough for a stranger to see it themselves"
    notes: >-
      Reproduction steps means enough for a stranger to see it themselves — not
      enough for you to find it again.

  - component: table-slide
    title: "Every Entry Has Five Fields"
    headers: ["Field", "Example"]
    rows:
      - ["What you sent", "empty.pdf"]
      - ["What came back", "Spinner, no end"]
      - ["What should happen", "Say it is empty"]
      - ["Severity", "High"]
      - ["Repro", "Open URL, click Run"]
    notes: >-
      Five fields per entry, no more. What you sent. What came back. What should
      have happened. The severity. And how to reproduce it.

  - component: code
    title: "FINDINGS.md, handed over as a file"
    code: |
      ## F-03  severity: critical
      sent:   report-2019.pdf (valid, old)
      got:    a confident summary of 2024
      expect: refuse, or say which year
      repro:  upload it, click Run
    notes: >-
      One entry, five lines, in a file rather than a chat message. A file
      survives the session and is what they triage against next hour.

  - component: bullet-list
    title: "Severity, in Four Levels"
    items:
      - "Critical: wrong output, looks right"
      - "High: crashes or hangs on real input"
      - "Medium: fails, but says so"
      - "Low: ugly, confusing, slow"
    notes: >-
      Four levels. Critical: wrong output that looks right. High: crashes or
      hangs on real input. Medium: it fails, but says so. Low: ugly, confusing,
      slow. Notice critical is the quietest failure, not the loudest.

  - component: bullet-list
    title: "Assigning It Honestly"
    items:
      - "Severity is about the user"
      - "Not how clever the input was"
      - "Not how hard it looks to fix"
      - "Documented limits drop a level"
    notes: >-
      Four calibrations. Severity is about the user. Not how clever your input
      was. Not how hard it looks to fix. And documented limits drop a level.

  - component: bullet-list
    title: "What Makes a Log Useless"
    items:
      - "Findings with no input attached"
      - "Forty entries, one real cause"
      - "Severity on everything the same"
      - "Opinions mixed in with failures"
    notes: >-
      Four ways to hand over an hour of work that cannot be used: findings with
      no input attached, forty entries with one real cause, the same severity on
      everything, and opinions mixed in with failures.

  - component: numbered-steps
    title: "Handing It Back"
    steps:
      - title: "Give them the file"
        body: "Written, not spoken, not a conversation"
      - title: "Say one sentence"
        body: "The single thing you would fix first"
      - title: "Then stop talking"
        body: "Let them read it without you narrating"
    notes: >-
      Three steps. Give them the file — written, not spoken, not a conversation.
      Say one sentence: the single thing you would fix first. Then stop talking
      and let them read it.

  - component: definition
    term: "Receiving it"
    definition: "Reading the whole log before saying anything"
    notes: >-
      Receiving it means reading the whole log before you say anything. Not
      accepting every finding, not agreeing — reading all of it first.

  - component: two-panel-list
    title: "Two Ways to Take It"
    left:
      title: "Defending"
      items:
        - "\"That is not a real input\""
        - "\"You used it wrong\""
        - "\"We know, it is in caveats\""
    right:
      title: "Receiving"
      items:
        - "Read all of it first"
        - "Ask only how to reproduce"
        - "Write it down and move on"
    accent_side: "right"
    notes: >-
      Defending sounds like “that is not a real input”, “you used it wrong”, “we
      know, it is in the caveats”. Receiving is reading all of it first, asking
      only how to reproduce, writing it down, and moving on.

  - component: bullet-list
    title: "The Only Question to Ask"
    items:
      - "\"How do I reproduce that?\""
      - "Not why they tried it"
      - "Not whether it counts"
      - "Not what they misunderstood"
    notes: >-
      There is exactly one legitimate question during the handover: how do I
      reproduce that? Not why they tried it, not whether it counts, not what
      they misunderstood.

  - component: bullet-list
    title: "Why This Is Worth the Discomfort"
    items:
      - "They had no reason to be kind"
      - "They are not going to fix it"
      - "The next tester is a judge"
      - "This is the last free round"
    notes: >-
      Four reasons it is worth the discomfort. They had no reason to be kind.
      They are not going to fix it. The next tester is a judge. And this is the
      last free round.

  - component: numbered-steps
    title: "If You Are Behind"
    steps:
      - title: "Trade at 10:45 regardless"
        body: "A short log on time beats a full one late"
      - title: "Drop the volume run"
        body: "Hand findings are the ones worth having"
      - title: "Never skip severity"
        body: "An unranked log cannot be triaged"
    notes: >-
      If you are behind: trade at 10:45 regardless, because a short log on time
      beats a full one late. Drop the volume run — the hand findings are the
      ones worth having. But never skip severity, because an unranked log cannot
      be triaged.

  - component: bullet-list
    title: "Leaving This Session"
    items:
      - "You broke someone else's build"
      - "You ran hands, then volume"
      - "You handed over a written log"
      - "You read yours without arguing"
    notes: >-
      You are leaving having broken someone else's build, run hands then volume,
      handed over a written log, and read your own without arguing.

  - component: table-slide
    title: "Write This Down Now"
    headers: ["Question", "Your answer"]
    rows:
      - ["Worst thing they found", "…"]
      - ["Did you predict it", "…"]
      - ["Critical findings", "…"]
      - ["Fix first after lunch", "…"]
    notes: >-
      Four answers before the break: the worst thing they found, whether you
      predicted it, how many criticals you have, and what you fix first after
      lunch.

  - component: question
    question: "What did you not expect?"
    notes: >-
      Last question: what did you not expect? The surprises are the real product
      of this session.

  - component: bullet-list
    title: "Next: Hardening and Handoff"
    items:
      - "Triage by severity against cost"
      - "Commit to a cut line, out loud"
      - "Fix, re-run the exact test, push"
      - "Schedule checks that outlive you"
    notes: >-
      Next session we triage by severity against cost, commit to a cut line out
      loud, fix and re-run the exact test that caught each one, and schedule
      checks that outlive you.
