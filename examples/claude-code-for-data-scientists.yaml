version: 1
theme:
  palette:
    primary: "#19323C"
    surface: "#FFFFFF"
    accent: "#CC785C"
    text: "#1A1A2E"
    muted: "#8A8A9A"
  type_scale:
    title: 66
    header: 42
    body: 34
    caption: 25
  font: arial
  motif: minimal
  # FB-091: slide titles/headlines use the deck beige (accent) instead of the dark teal.
  headline: accent
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true
slides:
  # FB-091: big beige title, no subheader.
  - component: title-slide
    title: "Claude Code"

  - component: definition
    term: "Claude Code"
    definition: "A terminal-based AI agent that reads your project, writes and runs code, inspects the results, and iterates until the job is done."

  - component: this-vs-that
    title: "Chat vs Agent"
    left:
      value: "Chat"
      label: "You ferry code around"
    right:
      value: "Agent"
      label: "It works in your repo"

  - component: icon-text-rows
    title: "What It Can Do in Your Project"
    rows:
      - icon: eye
        heading: "Explore"
        body: "Read files, schemas, and notebooks."
      - icon: bolt
        heading: "Execute"
        body: "Run scripts, queries, and tests."
      - icon: loop
        heading: "Iterate"
        body: "Check outputs and fix its own errors."

  # FB-094: retitled "a first session" -> "Terminal Use".
  - component: code
    title: "Terminal Use"
    chrome: true
    code: |
      $ cd sales-analysis && claude

      > Profile sales.csv: nulls, dtypes,
        outliers. Save it to profile.md.

      Reading sales.csv (1.2M rows)...
      Running profiling script...
      Wrote profile.md: 3 findings.

  - component: card-grid
    title: "Everyday Workflows"
    cards:
      - icon: chart-up
        title: "EDA"
        body: "Profile new data in minutes."
      - icon: wrench
        title: "Cleaning"
        body: "Fix types, nulls, duplicates."
      - icon: target
        title: "Modeling"
        body: "Fast first baselines."
      - icon: star
        title: "Reporting"
        body: "Plots and write-ups."

  - component: process-steps
    title: "How It Works on a Task"
    steps:
      - label: "Explore"
        body: "Scans the data and code."
      - label: "Plan"
        body: "Proposes an approach."
      - label: "Execute"
        body: "Writes and runs the code."
      - label: "Verify"
        body: "Checks results, then iterates."

  # FB-096: the "With Claude Code" panel carries the beige accent, not grey.
  - component: two-panel-list
    title: "A Typical Day, Reworked"
    accent_side: right
    left:
      title: "Before"
      items:
        - "Boilerplate pandas by hand"
        - "Stack Overflow detours"
        - "Stale notebooks"
    right:
      title: "With Claude Code"
      items:
        - "Describe the outcome"
        - "Errors debugged in place"
        - "Committed with notes"

  - component: table-slide
    title: "Commands Worth Knowing"
    headers: ["Command", "What it does"]
    rows:
      - ["claude", "Start a session"]
      - ["/init", "Write CLAUDE.md"]
      - ["/compact", "Trim the context"]
      - ["claude -p", "One-shot mode"]

  # FB-097: explain the two commands that most need it.
  - component: icon-text-rows
    title: "Two Commands, Up Close"
    rows:
      - icon: doc
        heading: "/init"
        body: "Scans your project, writes a starter CLAUDE.md."
      - icon: bolt
        heading: "claude -p"
        body: "One-shot: run a prompt, print the answer, exit."
    source: "https://code.claude.com/docs/en/cli-reference"

  - component: bullet-list
    title: "Habits That Make It Shine"
    items:
      - "Keep a CLAUDE.md with data caveats."
      - "Ask for a plan before a big analysis."
      - "Have it verify outputs, not just run."
      - "Commit small, reviewable steps."

  # ── Section 1: surfaces ──────────────────────────────────────────────────
  - component: section-divider
    number: "01"
    title: "One Claude, Many Surfaces"

  - component: bullet-list
    title: "Same Engine, Everywhere"
    items:
      - "One engine: terminal, IDE, desktop, web."
      - "Your CLAUDE.md and MCP servers come too."
      - "Start on the laptop, finish on your phone."
    source: "https://code.claude.com/docs/en/overview"

  # FB-099: dropped the "Best for" row.
  - component: comparison-matrix
    title: "Three Ways to Run It"
    options: ["Terminal", "Web", "Desktop"]
    criteria: ["Runs on", "Setup"]
    cells:
      - ["Your machine", "The cloud", "Your machine"]
      - ["Install CLI", "None", "Install app"]
    highlights:
      - [1, 1]
    source: "https://code.claude.com/docs/en/overview"

  - component: icon-text-rows
    title: "On the Internet"
    rows:
      - icon: cloud
        heading: "Cloud-run"
        body: "Runs at claude.ai/code on Anthropic's cloud."
      - icon: lock
        heading: "Isolated"
        body: "Each task gets its own sandbox VM."
      - icon: loop
        heading: "Persistent"
        body: "Keeps running after you close the tab."
    source: "https://code.claude.com/docs/en/claude-code-on-the-web"

  - component: bullet-list
    title: "Claude Desktop"
    items:
      - "A standalone app, no terminal needed."
      - "Review diffs, run sessions side by side."
      - "Schedule repeats and start cloud runs."
    source: "https://code.claude.com/docs/en/desktop"

  # ── Section 2: phone + GitHub ────────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "Drive It From Your Phone"

  - component: numbered-steps
    title: "Connect GitHub"
    steps:
      - title: "Sign in"
        body: "Open claude.ai/code and log in."
      - title: "Link GitHub"
        body: "Grant access to the repos you choose."
      - title: "Pick a repo"
        body: "Claude clones it into a cloud sandbox."
    source: "https://code.claude.com/docs/en/web-quickstart"

  - component: numbered-steps
    title: "Start a Task Anywhere"
    steps:
      - title: "Describe it"
        body: "Type the task in the Claude mobile app."
      - title: "Let it run"
        body: "Work continues in the background."
      - title: "Review"
        body: "Approve the branch Claude pushes."
    source: "https://code.claude.com/docs/en/mobile"

  # FB-101: removed the trailing "claude --teleport" line.
  - component: bullet-list
    title: "Remote Control"
    items:
      - "Step away and work from your phone."
      - "Continue a live session from any browser."
    source: "https://code.claude.com/docs/en/remote-control"

  # FB-102: code title is title-cased.
  - component: code
    title: "Move Between Surfaces"
    chrome: true
    code: |
      $ claude --cloud
        Runs this task in the cloud.

      > Pick it up later, anywhere:
      $ claude --teleport

        One session follows you across
        laptop, phone, and browser.

  # ── Section 3: MCP ───────────────────────────────────────────────────────
  - component: section-divider
    number: "03"
    title: "MCP: Plug In Your Tools"

  - component: definition
    term: "MCP"
    definition: "An open standard that connects AI tools to your data sources and other systems."
    source: "https://www.anthropic.com/news/model-context-protocol"

  - component: bullet-list
    title: "What MCP Unlocks"
    items:
      - "Read design docs from Google Drive."
      - "Update Jira, pull data from Slack."
      - "Query your own database and APIs."
    source: "https://code.claude.com/docs/en/mcp"

  # FB-103: concrete examples + why MCP beats no MCP.
  - component: two-panel-list
    title: "Without MCP vs With MCP"
    accent_side: right
    left:
      title: "Without MCP"
      items:
        - "Paste data in by hand"
        - "Screenshot dashboards"
        - "Describe your schema"
    right:
      title: "With MCP"
      items:
        - "Claude queries the DB"
        - "Reads the ticket itself"
        - "Always current data"
    source: "https://code.claude.com/docs/en/mcp"

  # FB-104: retitled.
  - component: table-slide
    title: "Servers You Can (normally) Connect to"
    headers: ["Server", "What Claude can do"]
    rows:
      - ["Drive", "Read design docs"]
      - ["Jira", "Update tickets"]
      - ["Slack", "Pull conversations"]
      - ["Postgres", "Query your data"]
    source: "https://code.claude.com/docs/en/mcp"

  # ── Section 4: customize ─────────────────────────────────────────────────
  # FB-105: "Make Claude Yours" -> "Customize Claude".
  - component: section-divider
    number: "04"
    title: "Customize Claude"

  - component: definition
    term: "CLAUDE.md"
    definition: "A file in your project root that Claude reads at the start of every session."
    source: "https://code.claude.com/docs/en/memory"

  - component: bullet-list
    title: "What Goes in CLAUDE.md"
    items:
      - "Coding standards and libraries."
      - "Architecture and key commands."
      - "Review checklists and data caveats."
    source: "https://code.claude.com/docs/en/memory"

  # FB-106: an example of what to put in the file...
  - component: code
    title: "Example CLAUDE.md"
    chrome: false
    code: |
      # sales-analysis project
      - Use pandas, not polars.
      - Raw data lives in data/.
      - Never commit the CSVs.
      - Tests: pytest -q
      - Plots: matplotlib only.

  # FB-106: ...then the common problems to beware.
  - component: bullet-list
    title: "CLAUDE.md Pitfalls"
    items:
      - "Too long crowds the context."
      - "Stale rules Claude still obeys."
      - "Vague advice it cannot act on."
      - "Secrets do not belong here."
    source: "https://code.claude.com/docs/en/memory"

  - component: definition
    term: "Skills"
    definition: "Reusable folders of instructions, each a SKILL.md, that Claude loads on demand."
    source: "https://code.claude.com/docs/en/skills"

  # FB-107: "Skills" -> "Skills.md" in the title and the right column.
  - component: two-panel-list
    title: "CLAUDE.md vs Skills.md"
    left:
      title: "CLAUDE.md"
      items:
        - "Always in context"
        - "Project-wide rules"
        - "One file at the root"
    right:
      title: "Skills.md"
      items:
        - "Loaded on demand"
        - "A packaged workflow"
        - "Shared across projects"
    source: "https://code.claude.com/docs/en/skills"

  # ── Section 5: more from Claude (FB-109) ─────────────────────────────────
  - component: section-divider
    number: "05"
    title: "More From Claude"

  - component: definition
    term: "Cowork"
    definition: "Claude Code's agent inside Claude Desktop — for non-coding work: research, analysis, and documents."
    source: "https://www.anthropic.com/product/claude-cowork"

  - component: bullet-list
    title: "What Cowork Does"
    items:
      - "Reads and edits files you choose."
      - "Works across Slack and Google Drive."
      - "Finishes multi-step tasks, with citations."
    source: "https://www.anthropic.com/product/claude-cowork"

  - component: definition
    term: "Artifacts"
    definition: "Standalone content Claude builds beside the chat — code, docs, and apps you can edit and share by link."
    source: "https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them"

  - component: two-panel-list
    title: "Memory > Chat Search"
    accent_side: left
    left:
      title: "Memory"
      items:
        - "Learns your context"
        - "Persists across chats"
        - "Separate per project"
    right:
      title: "Chat search"
      items:
        - "Looks up old chats"
        - "Only when you ask"
        - "One lookup at a time"
    source: "https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context"

  # ── Close (FB-108: new call to action; FB-109: old title slide removed) ──
  - component: question
    question: "Let's build our visualization library with Claude + GitHub, from our phones."
