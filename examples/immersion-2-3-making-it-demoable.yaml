# Immersion Week SF · Day 2 · Session 2.3
# "Making It Demoable" (11:00–11:50, 50 min)
# Source: https://github.com/UChiCareersinAI/ImmersionWeekSF
#
# Objectives (verbatim from the syllabus):
#   1. Wrap the prototype in a front end a stranger can drive — a Claude
#      Artifact, or a page you write and host
#   2. Ship it to a public URL with GitHub Pages or Cloudflare, so your demo does
#      not depend on your laptop staying open
#   3. Write a three-minute demo script, and document what is stubbed, faked, or
#      known-broken — this is Day 3's attack surface
#
# No palette block: this deck rides the slidekit default colour scheme.
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  # ── Open ───────────────────────────────────────────────────────────────────
  - component: title-slide
    title: "Making It Demoable"
    subtitle: "Immersion Week SF · Day 2 · Session 2.3"
    notes: >-
      This is session 2.3, Making It Demoable. You have a pipeline that runs;
      right now nobody outside your team can use it.

  - component: big-number
    value: "50"
    label: "Minutes"
    context: "You leave with a public URL"
    notes: >-
      Fifty minutes, and you leave with a link you can send to somebody who is
      not in this room.

  - component: agenda
    title: "What This Session Covers"
    items:
      - "Wrap it so a stranger can drive"
      - "Ship it to a public URL"
      - "Write a three-minute script"
      - "Document what is faked"
    notes: >-
      Four things this session. We wrap it so a stranger can drive it, ship it
      to a public URL, write a three-minute script, and document what is faked.

  - component: question
    question: "Could a stranger drive it?"
    notes: >-
      Could a stranger drive it? Picture a specific one — a friend, a recruiter
      — opening a link with no explanation from you at all.

  - component: this-vs-that
    title: "From 2.2 to Now"
    left:
      value: "A path"
      label: "It runs when you run it"
    right:
      value: "A demo"
      label: "It runs when they do"
    notes: >-
      This morning's work runs in your hands. A demo is the same thing running
      in somebody else's, which is a different and smaller problem than it
      feels.

  - component: process-steps
    title: "How We Get There"
    steps:
      - label: "Wrap"
        body: "A front end, however plain"
      - label: "Ship"
        body: "A URL off your machine"
      - label: "Script"
        body: "Three minutes, rehearsed"
      - label: "Admit"
        body: "Write down what is fake"
    notes: >-
      Four moves: wrap it in a front end however plain, ship it to a URL off
      your machine, script three minutes and rehearse them, and write down what
      is fake.

  - component: timeline
    title: "The Next 50 Minutes"
    events:
      - date: "11:00"
        title: "Wrap it"
        description: "A front end anyone can drive"
      - date: "11:20"
        title: "Ship it"
        description: "Public URL, tested cold"
      - date: "11:35"
        title: "Script it"
        description: "Three minutes, out loud"
      - date: "11:45"
        title: "Confess"
        description: "The caveat list, in the repo"
    notes: >-
      The hour runs in four blocks. Wrap it by 11:20, ship it, script it at
      11:35, and write the caveats at 11:45. If you have no URL by 11:20, ship
      whatever exists — the rest of the hour assumes a link.

  - component: pull-quote
    quote: "A demo nobody can open is a story."
    attribution: "The Day 2 close"
    notes: >-
      A demo nobody can open is a story. Until there is a URL, everything you
      have is something you can describe.

  # ── 01 · A Front End a Stranger Can Drive ──────────────────────────────────
  - component: section-divider
    number: "01"
    title: "A Front End"
    notes: >-
      First objective, and the bar is deliberately low: not beautiful, not
      responsive — drivable.

  - component: definition
    term: "Front end"
    definition: "The part that works without you in the room"
    notes: >-
      A front end is the part that works without you in the room. If somebody
      needs you on a call to get a result, you do not have one yet.

  - component: bullet-list
    title: "What a Stranger Needs"
    items:
      - "To know what this thing does"
      - "Something obvious to click"
      - "A result they can read"
      - "No instructions from you"
    notes: >-
      A stranger needs four things, in this order: to know what this thing does,
      something obvious to click, a result they can read, and no instructions
      from you.

  - component: two-panel-list
    title: "Two Honest Options"
    left:
      title: "A Claude Artifact"
      items:
        - "Minutes to build"
        - "Shareable link included"
        - "Good enough to judge"
    right:
      title: "A page you host"
      items:
        - "More control"
        - "More time to build"
        - "Yours after the week"
    accent_side: "left"
    notes: >-
      Two honest options. A Claude Artifact takes minutes, comes with a
      shareable link, and is good enough to be judged. A page you host gives
      more control, takes more time, and is yours after the week.

  - component: comparison-matrix
    title: "Choosing Between Them"
    options: ["Artifact", "Hosted page"]
    criteria: ["Time to live", "Control", "Demo risk"]
    cells:
      - ["Minutes", "An hour or more"]
      - ["Limited", "Total"]
      - ["Low", "Yours to manage"]
    highlights: [[0, 0], [2, 0]]
    notes: >-
      Artifact versus hosted page, in three rows. Minutes to live against an
      hour or more. Limited control against total control. Low demo risk against
      risk you manage yourself.

  - component: definition
    term: "Claude Artifact"
    definition: "A working page Claude builds and hosts for you"
    notes: >-
      A Claude Artifact is a working page Claude builds and hosts for you — no
      repo, no build step, no hosting decision.

  - component: numbered-steps
    title: "Wrapping It, Either Way"
    steps:
      - title: "Describe the one screen"
        body: "Input, button, result — nothing else"
      - title: "Paste in a real result"
        body: "So the layout fits actual output"
      - title: "Drive it yourself, cold"
        body: "New tab, no context, no excuses"
    notes: >-
      Three steps either way. Describe the one screen: input, button, result,
      nothing else. Paste in a real result so the layout fits actual output.
      Then drive it yourself cold, in a new tab, with no context.

  - component: code
    title: "A wrapper worth asking for"
    code: |
      One page. A box to paste a report in,
      a Run button, and the result below it.
      Show this exact output as an example:
      <paste out/answer.md here>
      Plain and readable. No styling flourish.
    notes: >-
      Here is the ask. One page, a box to paste into, a Run button, the result
      below — and this exact output as the example. Plain and readable, no
      styling flourish.

  - component: bullet-list
    title: "Put These on the Page"
    items:
      - "One sentence: what this does"
      - "An example input, pre-filled"
      - "The result, readable as text"
      - "A line saying what is faked"
    notes: >-
      Four things on the page: one sentence saying what it does, an example
      input already filled in, the result readable as text, and a line saying
      what is faked.

  - component: bullet-list
    title: "Leave These Out"
    items:
      - "Accounts and sign-in"
      - "Settings and options"
      - "A second page of any kind"
      - "Anything you would style twice"
    notes: >-
      Leave out accounts and sign-in, settings and options, a second page of any
      kind, and anything you would end up styling twice.

  - component: icon-text-rows
    title: "Three Tests of Drivable"
    rows:
      - icon: "click"
        heading: "One click to a result"
        body: "From landing on the page, with nothing typed"
      - icon: "eye"
        heading: "Obvious what happened"
        body: "The output reads without you explaining it"
      - icon: "shield"
        heading: "Survives a bad input"
        body: "Says something, rather than showing nothing"
    notes: >-
      Three tests of drivable. One click to a result, from landing on the page
      with nothing typed. Obvious what happened, so the output reads without you
      explaining it. And it survives a bad input by saying something rather than
      showing nothing.

  - component: bullet-list
    title: "Watch For These"
    items:
      - "An empty box with no hint"
      - "A result that needs your voice"
      - "A spinner that never finishes"
      - "Output only you can read"
    notes: >-
      Four things to watch for: an empty box with no hint, a result that needs
      your voice to make sense, a spinner that never finishes, and output only
      you can read.

  # ── 02 · Off Your Laptop ───────────────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "Off Your Laptop"
    notes: >-
      Second objective: getting it off your laptop, which the syllabus is
      explicit about.

  - component: question
    question: "What if the wifi drops?"
    notes: >-
      What if the wifi drops? Every failed demo any of us has seen was a local
      thing that stopped being reachable.

  - component: bullet-list
    title: "Why Localhost Is Not a Demo"
    items:
      - "It dies when your laptop sleeps"
      - "Nobody can open it later"
      - "You cannot send it to anyone"
      - "Tomorrow's team cannot test it"
    notes: >-
      Localhost is not a demo. It dies when your laptop sleeps, nobody can open
      it later, you cannot send it to anyone, and tomorrow's red team cannot
      test it.

  - component: comparison-columns
    title: "Two Ways to Ship It"
    left_title: "GitHub Pages"
    right_title: "Cloudflare"
    left_items:
      - text: "Already where your code is"
      - text: "A commit is a deploy"
      - text: "Static pages only"
    right_items:
      - text: "Handles more than static"
      - text: "Fast to set up"
      - text: "A second account to make"
    notes: >-
      Two ways to ship. GitHub Pages is already where your code is, a commit is
      a deploy, and it serves static pages only. Cloudflare handles more than
      static and is fast to set up, but it is another account to make.

  - component: numbered-steps
    title: "Shipping with Pages"
    steps:
      - title: "Put the page in the repo"
        body: "index.html at the root, or in docs/"
      - title: "Turn Pages on"
        body: "Settings, Pages, pick the branch"
      - title: "Wait, then open the URL"
        body: "First build takes a minute or two"
    notes: >-
      Three steps with Pages. Put the page in the repo, as index dot html at the
      root or in docs. Turn Pages on in settings and pick the branch. Then wait
      — the first build takes a minute or two — and open the URL.

  - component: code
    title: "From repo to public URL"
    code: |
      $ cp out/index.html docs/index.html
      $ git add docs/index.html
      $ git commit -m "publish demo page"
      $ git push
      # Settings > Pages > branch: main, /docs
    notes: >-
      Five lines from repo to public URL: copy the page into docs, add it,
      commit, push, then turn Pages on in settings. That last one is a click
      rather than a command, and it happens once per repo.

  - component: bullet-list
    title: "What Breaks When You Go Public"
    items:
      - "Paths that only exist locally"
      - "A key that was in your shell"
      - "A file you never committed"
      - "Anything reading your disk"
    notes: >-
      Four things that work on a laptop and not on the internet: paths that only
      exist locally, a key that was in your shell, a file you never committed,
      and anything reading your disk.

  - component: bullet-list
    title: "Check Before You Share It"
    items:
      - "No API keys in the page"
      - "No keys in the repo history"
      - "Nothing private in the fixture"
      - "Nothing you cannot show"
    notes: >-
      Thirty seconds before you share it. No API keys in the page, no keys
      anywhere in the repo history, nothing private in the fixture, and nothing
      you cannot show. A public repo is public forever, history included.

  - component: numbered-steps
    title: "Test It Like a Stranger"
    steps:
      - title: "Open a private window"
        body: "No logins, no cache, no extensions"
      - title: "Do nothing but click"
        body: "Type nothing you have not pre-filled"
      - title: "Then try it on a phone"
        body: "Half the people you send it to will"
    notes: >-
      Three steps, and this is the most valuable ten minutes of the session.
      Open a private window — no logins, no cache, no extensions. Do nothing but
      click, typing nothing you have not pre-filled. Then try it on a phone,
      because half the people you send it to will.

  - component: numbered-steps
    title: "If You Are Behind"
    steps:
      - title: "Ship what exists"
        body: "An ugly live page beats a good local one"
      - title: "Drop the front end"
        body: "A page showing one saved result still counts"
      - title: "Never drop the caveats"
        body: "Five honest lines take two minutes"
    notes: >-
      If you are behind: ship what exists, because an ugly live page beats a
      good local one. Drop the front end if you must — a page showing one saved
      result still counts. But never drop the caveats; five honest lines take
      two minutes.

  - component: table-slide
    title: "The Ship Checklist"
    headers: ["Check", "Pass means"]
    rows:
      - ["Private window", "It loads and runs"]
      - ["Phone", "You can read the output"]
      - ["Laptop closed", "A teammate can open it"]
      - ["No secrets", "Nothing in page or repo"]
    notes: >-
      Four checks, all binary. Private window: it loads and runs. Phone: you can
      read the output. Laptop closed: a teammate can still open it. No secrets:
      nothing in the page or the repo.

  - component: pull-quote
    quote: "Needs your laptop? Not shipped."
    attribution: "Objective two, restated"
    notes: >-
      Needs your laptop? Not shipped. A local version is not basically the same
      thing.

  # ── 03 · The Script and the Caveats ────────────────────────────────────────
  - component: section-divider
    number: "03"
    title: "Script and Caveats"
    notes: >-
      Third objective, and this is what separates teams tomorrow: the script and
      the caveats.

  - component: definition
    term: "Demo script"
    definition: "The three minutes, written down word for word"
    notes: >-
      A demo script is the three minutes, written down word for word. Written,
      because improvising turns into ninety seconds of architecture nobody asked
      for.

  - component: table-slide
    title: "The Three Minutes"
    headers: ["Time", "What you say"]
    rows:
      - ["0:00–0:30", "The problem, concretely"]
      - ["0:30–2:00", "Drive it, live, in silence"]
      - ["2:00–2:30", "What is real, what is not"]
      - ["2:30–3:00", "What you would build next"]
    notes: >-
      Here is a structure that works. Thirty seconds on the problem, concretely.
      Ninety seconds driving it live, in silence. Thirty seconds on what is real
      and what is not. Thirty seconds on what you would build next.

  - component: bullet-list
    title: "The First Thirty Seconds"
    items:
      - "Name who has the problem"
      - "Say what it costs them today"
      - "One sentence, no background"
      - "Then stop and show it"
    notes: >-
      The first thirty seconds: name who has the problem, say what it costs them
      today, one sentence with no background — then stop and show it.

  - component: bullet-list
    title: "Do Not Say These"
    items:
      - "Let me explain the architecture"
      - "Normally this works"
      - "We ran out of time to"
      - "It is basically just a wrapper"
    notes: >-
      Four phrases that lose the room. “Let me explain the architecture.”
      “Normally this works.” “We ran out of time to.” And “it is basically just
      a wrapper.”

  - component: numbered-steps
    title: "Rehearse It Properly"
    steps:
      - title: "Time it, out loud"
        body: "Silently in your head is always shorter"
      - title: "Have someone else drive"
        body: "The builder's hands hide the rough edges"
      - title: "Cut until it fits"
        body: "Three minutes means three minutes"
    notes: >-
      Three steps. Time it out loud, because silently in your head is always
      shorter. Have someone else drive, since the builder's hands hide the rough
      edges. Then cut until it fits — three minutes means three minutes.

  - component: definition
    term: "Caveat list"
    definition: "Everything stubbed, faked, or known to break"
    notes: >-
      A caveat list is everything stubbed, faked, or known to break. It is an
      asset rather than a confession.

  - component: bullet-list
    title: "What Goes on the List"
    items:
      - "Every step you stubbed"
      - "Every hardcoded value"
      - "Inputs you know it fails on"
      - "Anything only tested once"
    notes: >-
      Four categories go on it: every step you stubbed, every hardcoded value,
      inputs you know it fails on, and anything only tested once.

  - component: table-slide
    title: "How to Write It Down"
    headers: ["What", "Status"]
    rows:
      - ["Login", "Stubbed, one user"]
      - ["PDF parsing", "One file only"]
      - ["Retrieval", "Faked, four docs"]
      - ["Long inputs", "Known to break"]
    notes: >-
      Two columns is enough. Login: stubbed, one user. PDF parsing: one file
      only. Retrieval: faked, four docs. Long inputs: known to break.

  - component: code
    title: "CAVEATS.md, in the repo root"
    code: |
      # What is real and what is not
      - Login: stubbed, always user "ana"
      - Input: only fixtures/report.pdf
      - Retrieval: 4 docs, pasted not fetched
      - Fails on: inputs over ~20 pages
    notes: >-
      Five lines, committed next to the code as CAVEATS dot md — in the repo
      rather than a document, because that is where tomorrow's red team will
      look.

  - component: file-tree
    title: "The repo at the end of Day 2"
    root: "happy-path/"
    entries:
      - name: "docs/"
        depth: 0
      - name: "index.html"
        depth: 1
      - name: "fixtures/"
        depth: 0
      - name: "steps/"
        depth: 0
      - name: "run.py"
        depth: 0
      - name: "CAVEATS.md"
        depth: 0
      - name: "README.md"
        depth: 0
    notes: >-
      Two days of work, seven entries. Notice CAVEATS.md sitting beside the code
      as an equal.

  - component: two-panel-list
    title: "Hiding and Naming"
    left:
      title: "Hiding a limit"
      items:
        - "They find it anyway"
        - "It looks like a mistake"
        - "You lose the room"
    right:
      title: "Naming a limit"
      items:
        - "You look in control"
        - "It reads as a decision"
        - "The question moves on"
    accent_side: "right"
    notes: >-
      Hiding a limit means they find it anyway, it looks like a mistake, and you
      lose the room. Naming it means you look in control, it reads as a
      decision, and the question moves on. Same fact, opposite outcome.

  - component: icon-text-rows
    title: "What Day 3 Will Attack"
    rows:
      - icon: "search"
        heading: "The undocumented fake"
        body: "Anything real-looking that is not on your list"
      - icon: "alert"
        heading: "The single input"
        body: "The second thing they try will not be yours"
      - icon: "link"
        heading: "The dead link"
        body: "A URL that only worked on your machine"
    notes: >-
      Three things Day 3 will attack. The undocumented fake — anything real-
      looking that is not on your list. The single input, because the second
      thing they try will not be yours. And the dead link, a URL that only ever
      worked on your machine.

  - component: bullet-list
    title: "Leaving This Session"
    items:
      - "A URL a stranger can open"
      - "It works with your laptop shut"
      - "A three-minute script, rehearsed"
      - "CAVEATS.md, committed"
    notes: >-
      You are leaving with a URL a stranger can open, that works with your
      laptop shut, a three-minute script you have rehearsed, and CAVEATS dot md
      committed.

  - component: table-slide
    title: "Write This Down Now"
    headers: ["Question", "Your answer"]
    rows:
      - ["The public URL", "…"]
      - ["Who drives the demo", "…"]
      - ["Biggest caveat", "…"]
      - ["Most likely to break", "…"]
    notes: >-
      Four answers into the repo before Day 2 ends: the public URL, who drives
      the demo, your biggest caveat, and what is most likely to break.

  - component: bullet-list
    title: "Tonight, If You Have Energy"
    items:
      - "Send the link to one stranger"
      - "Watch where they get stuck"
      - "Fix only what stopped them"
      - "Add what broke to the caveats"
    notes: >-
      Optional tonight, and worth more than any code: send the link to one
      stranger, watch where they get stuck, fix only what stopped them, and add
      what broke to the caveats.

  - component: question
    question: "What would you attack?"
    notes: >-
      Last question of the day: what would you attack? You already know where
      your own system is weakest.

  - component: bullet-list
    title: "Next: The Battle Test"
    items:
      - "You design an attack, not a feature"
      - "Another team red-teams yours"
      - "Agents probe it, not just people"
      - "Bring the caveat list with you"
    notes: >-
      Tomorrow the mindset flips. You design an attack rather than a feature,
      another team red-teams yours, agents probe it rather than just people —
      and you bring the caveat list with you.
