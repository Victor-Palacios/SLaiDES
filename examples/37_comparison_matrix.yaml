version: 1
# Two-colour palette (FB-045: "too many colors just stick with the red and black"):
# primary matches the text tone so the whole slide reads red + black.
theme:
  palette:
    primary: "#1A1A2E"
    surface: "#FFFFFF"
    accent: "#E84545"
    text: "#1A1A2E"
    muted: "#8A8A9A"
  font: arial
page_numbers:
  enabled: true
slides:
  - component: comparison-matrix
    title: "Evaluation Matrix"
    options: ["Platform A", "Platform B", "Platform C"]
    criteria: ["Security", "Workflow", "Support"]
    cells:
      - ["Strong", "Medium", "Strong"]
      - ["Medium", "Strong", "Medium"]
      - ["Strong", "Strong", "Medium"]
    highlights:
      - [0, 0]
      - [2, 0]
