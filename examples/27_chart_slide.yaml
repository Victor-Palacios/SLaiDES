version: 1
theme:
  palette:
    primary: "#243A5E"
    surface: "#FFFFFF"
    accent: "#E07A3F"
    text: "#1A1A2E"
    muted: "#8A8A9A"
  font: arial
page_numbers:
  enabled: true
slides:
  - component: chart-slide
    title: "Quarterly Bookings"
    chart:
      type: chart
      chart_type: bar
      labels: ["Q1", "Q2", "Q3", "Q4"]
      series:
        - name: "Bookings ($M)"
          values: [3.2, 4.1, 5.6, 7.0]
    caption: "Figures in $M, net of refunds."
