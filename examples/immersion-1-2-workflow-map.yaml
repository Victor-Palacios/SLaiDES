# Immersion Week SF · Day 1 · Session 1.2
# "Mapping the Workflow to the Solution" (10:00–10:55, 55 min)
# Source: https://github.com/UChiCareersinAI/ImmersionWeekSF
#
# Objectives (verbatim from the syllabus):
#   1. Decompose the problem into a stepwise workflow, from raw input to
#      delivered output
#   2. Turn that workflow into a Claude Artifact — a diagram the whole team can
#      see, revise, and share by link
#   3. Name what each step needs — data, a tool, a Claude Routine on a schedule,
#      or a human decision — then have Claude generate the three ways the
#      riskiest step most likely fails
#
# No palette block: this deck rides the slidekit default colour scheme.
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  # ── Open ───────────────────────────────────────────────────────────────────
  - component: title-slide
    title: "Mapping the Workflow"
    subtitle: "Immersion Week SF · Day 1 · Session 1.2"
    notes: >-
      This is session 1.2, Mapping the Workflow. We take the problem you
      sharpened last hour and turn it into a picture of how the solution
      actually runs.

  - component: big-number
    value: "55"
    label: "Minutes"
    context: "You leave with a diagram the team shares"
    notes: >-
      We have fifty-five minutes, and you leave with one thing: a diagram of
      your workflow that your whole team can see and share.

  - component: agenda
    title: "What This Session Covers"
    items:
      - "Decomposing the problem into steps"
      - "Turning the map into an Artifact"
      - "Naming what each step needs"
      - "Finding how the riskiest step fails"
    notes: >-
      Four things this hour. We decompose the problem into steps, turn that map
      into an Artifact, name what each step needs, and finish by finding how the
      riskiest step fails.

  - component: question
    question: "From input to output: how?"
    notes: >-
      Here is the question for your own problem. You can name your input and you
      can name your output. How do you actually get from one to the other?

  - component: this-vs-that
    title: "From 1.1 to Now"
    left:
      value: "Problem"
      label: "One precise sentence"
    right:
      value: "Workflow"
      label: "The path to solve it"
    notes: >-
      Last hour you produced one precise sentence about what is wrong. This hour
      you draw the path that gets it solved.

  - component: process-steps
    title: "How We Get There"
    steps:
      - label: "Break"
        body: "Split it into steps"
      - label: "Draw"
        body: "Make it an Artifact"
      - label: "Annotate"
        body: "Name what each needs"
      - label: "Stress"
        body: "Find how it breaks"
    notes: >-
      Four moves to get there: break the problem into steps, draw them as an
      Artifact, annotate what each one needs, then stress the map to find where
      it breaks.

  # ── 01 · Decompose the problem ─────────────────────────────────────────────
  - component: section-divider
    number: "01"
    title: "Decompose Into Steps"
    notes: >-
      First objective: a stepwise path from raw input to delivered output, with
      no gaps in the middle.

  - component: definition
    term: "Workflow"
    definition: "Ordered steps from raw input to delivered output."
    notes: >-
      A workflow is the ordered set of steps that carries you from raw input all
      the way to a delivered output. Both ends of that sentence matter as much
      as the middle.

  - component: definition
    term: "Step"
    definition: "One change, with a named input and output."
    notes: >-
      A step is one change, with a named input and a named output. If you cannot
      name both, it is not a step yet.

  - component: icon-text-rows
    title: "Every Step Has Three Parts"
    rows:
      - icon: "file"
        heading: "Input"
        body: "What arrives, and its shape"
      - icon: "zap"
        heading: "Transform"
        body: "The one thing this step does"
      - icon: "check"
        heading: "Output"
        body: "What leaves, ready for next"
    notes: >-
      Every step has three parts: an input, which is what arrives and the shape
      it arrives in; a transform, the one thing this step does; and an output,
      what leaves ready for the next step.

  - component: numbered-steps
    title: "How to Decompose"
    steps:
      - title: "Name the output"
        body: "What the user finally gets"
      - title: "Work backwards"
        body: "What must exist before it"
      - title: "Stop at raw input"
        body: "What you actually receive"
    notes: >-
      Decomposing is three moves. Name the output — what the user finally gets.
      Work backwards, asking what must exist before it. And stop at raw input,
      meaning whatever you actually receive.

  - component: bullet-list
    title: "Start From the Output"
    items:
      - "Forward drifts toward what is easy"
      - "Backwards keeps every step earning"
      - "You spot the missing middle sooner"
    notes: >-
      Start from the output, because working forwards drifts toward whatever is
      easy. Backwards makes every step earn its place, and you spot the missing
      middle sooner.

  - component: table-slide
    title: "Vague Step, Concrete Step"
    headers: ["Vague", "Concrete"]
    rows:
      - ["Process the data", "Parse CSV to records"]
      - ["Analyze it", "Score each row 0 to 1"]
      - ["Use AI", "Claude drafts a summary"]
      - ["Show results", "Render a ranked table"]
    notes: >-
      Vague on the left, concrete on the right. “Process the data” becomes
      “parse CSV to records”; “use AI” becomes “Claude drafts a summary”.

  - component: bullet-list
    title: "The Granularity Test"
    items:
      - "One person could own it"
      - "You could test it alone"
      - "It fits in a morning"
    notes: >-
      A step is the right size when one person could own it, you could test it
      on its own, and it fits in a morning.

  - component: comparison-columns
    title: "Too Coarse, Too Fine"
    left_title: "Too coarse"
    right_title: "Too fine"
    left_items:
      - text: "Build the pipeline"
      - text: "Hides the hard part"
      - text: "Cannot be assigned"
    right_items:
      - text: "Open the file"
      - text: "Twenty trivial boxes"
      - text: "Noise, not a map"
    notes: >-
      Too coarse is “build the pipeline” — it hides the hard part and cannot be
      assigned. Too fine is “open the file” — twenty trivial boxes, which is
      noise rather than a map.

  - component: code
    title: "Prompt to Decompose"
    chrome: true
    code: |
      Our problem:
      "<paste the 1.1 statement>"

      Work BACKWARDS from the output.
      List the steps, each with its
      input and output.
      Stop at the raw input we have.
      5-9 steps. No tools yet.
    notes: >-
      Here is the prompt. Paste your 1.1 statement, ask it to work backwards
      from the output, list each step with its input and output, stop at the raw
      input you have, five to nine steps, no tools yet.

  - component: process-steps
    title: "A Worked Example"
    steps:
      - label: "Intake"
        body: "Resume files arrive"
      - label: "Parse"
        body: "Text out of each file"
      - label: "Score"
        body: "Match against the role"
      - label: "Report"
        body: "Ranked list with gaps"
    notes: >-
      A worked example: resume files arrive at intake, parse pulls text out of
      each file, score matches them against the role, and report produces a
      ranked list with gaps.

  - component: bullet-list
    title: "Common Decomposition Mistakes"
    items:
      - "Starting after the messy part"
      - "One step doing three things"
      - "No step for getting the data"
      - "The output nobody defined"
    notes: >-
      Four mistakes to watch for: starting after the messy part, one step
      quietly doing three things, no step for getting the data at all, and an
      output nobody ever defined.

  - component: two-panel-list
    title: "Linear or Branching"
    accent_side: left
    left:
      title: "Linear"
      items:
        - "One path start to end"
        - "Easy to demo"
        - "Pick this for Day 2"
    right:
      title: "Branching"
      items:
        - "Cases split the path"
        - "Harder to finish"
        - "Note it, defer it"
    notes: >-
      Linear means one path start to end, easy to demo — that is what you pick
      for Day 2. Branching means cases split the path; it is harder to finish,
      so note it and defer it.

  - component: definition
    term: "The happy path"
    definition: "The one route where nothing fails."
    notes: >-
      The happy path is the one route through your map where nothing fails.

  - component: bullet-list
    title: "Mark the Happy Path"
    items:
      - "One line through the map"
      - "Every branch labelled later"
      - "Edge cases listed, not built"
    notes: >-
      Mark it as one line through the map. Label every branch as later, and list
      your edge cases without building them.

  - component: pull-quote
    quote: "A gap in the map is a gap in Day 2."
    attribution: "Why the middle matters"
    notes: >-
      A gap in the map is a gap in Day 2. That is why the middle matters.

  # ── 02 · Turn it into an Artifact ──────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "Make It an Artifact"
    notes: >-
      Second objective: turning that list of steps into a picture the whole team
      can hold.

  - component: definition
    term: "Claude Artifact"
    definition: "Standalone content Claude builds, shared by link."
    notes: >-
      A Claude Artifact is standalone content Claude builds for you, which you
      share by link.

  - component: two-panel-list
    title: "Described or Drawn"
    accent_side: right
    left:
      title: "Described"
      items:
        - "Lives in a transcript"
        - "Each person pictures it"
        - "Re-explained each time"
    right:
      title: "Drawn"
      items:
        - "One picture, one meaning"
        - "Disagreement shows fast"
        - "Sent as a link"
    notes: >-
      A described workflow lives in a transcript, each person pictures it
      differently, and it gets re-explained every time. A drawn one is one
      picture with one meaning, disagreement shows up fast, and you send it as a
      link.

  - component: icon-text-rows
    title: "What an Artifact Gives You"
    rows:
      - icon: "eye"
        heading: "See"
        body: "The whole path at once"
      - icon: "loop"
        heading: "Revise"
        body: "Change it in seconds"
      - icon: "users"
        heading: "Share"
        body: "One link, whole team"
    notes: >-
      An Artifact gives you three things: you see the whole path at once, you
      revise it in seconds, and you share it with the whole team through one
      link.

  - component: numbered-steps
    title: "Build the Diagram"
    steps:
      - title: "Paste the steps"
        body: "Your list from section one"
      - title: "Ask for a diagram"
        body: "Boxes and arrows, top down"
      - title: "Fix it out loud"
        body: "Revise until it matches"
    notes: >-
      Three steps. Paste in your list from section one. Ask for a diagram —
      boxes and arrows, top down. Then fix it out loud until it matches what you
      meant.

  - component: code
    title: "Prompt for the Diagram"
    chrome: true
    code: |
      Here are our workflow steps:
      <paste the list>

      Build an Artifact: a flow
      diagram, top to bottom.
      One box per step.
      Label every arrow with what
      passes between the steps.
    notes: >-
      Here is that prompt. Paste the steps, ask for a flow diagram top to
      bottom, one box per step, and label every arrow with what passes between
      the steps.

  - component: bullet-list
    title: "What the Diagram Must Show"
    items:
      - "Raw input, where it enters"
      - "One box per step"
      - "What passes on each arrow"
      - "The delivered output"
    notes: >-
      Four things must appear: raw input and where it enters, one box per step,
      what passes on each arrow, and the delivered output.

  - component: bullet-list
    title: "Diagram Conventions"
    items:
      - "Top to bottom reads fastest"
      - "One verb per box"
      - "Keep labels under five words"
    notes: >-
      Three conventions: top to bottom reads fastest, one verb per box, and keep
      labels under five words.

  - component: bullet-list
    title: "Revise It in Front of Everyone"
    items:
      - "Ask for the change out loud"
      - "Re-read the new version together"
      - "Stop when nobody objects"
    notes: >-
      Revise it together. Ask for the change out loud, re-read the new version
      as a group, and stop when nobody objects.

  - component: bullet-list
    title: "Artifact Pitfalls"
    items:
      - "A pretty diagram nobody rechecks"
      - "Boxes with no arrow labels"
      - "The link never actually shared"
    notes: >-
      Three pitfalls: a pretty diagram nobody rechecks, boxes with no arrow
      labels, and a link that never actually got shared.

  - component: this-vs-that
    title: "Where the Map Lives"
    left:
      value: "Chat"
      label: "Scrolls away by noon"
    right:
      value: "Project"
      label: "Beside the problem"
    notes: >-
      A map that lives in a chat scrolls away by noon. One that lives in your
      Project sits beside the problem statement, where you will find it again.

  # ── 03 · Name what each step needs ─────────────────────────────────────────
  - component: section-divider
    number: "03"
    title: "Name What Each Step Needs"
    notes: >-
      Third objective: every box on that diagram gets annotated with what it
      actually needs to run.

  - component: card-grid
    title: "Four Kinds of Need"
    cards:
      - icon: "file"
        title: "Data"
        body: "Something must be supplied"
      - icon: "wrench"
        title: "Tool"
        body: "Code, API, or model call"
      - icon: "loop"
        title: "Routine"
        body: "It runs on a schedule"
      - icon: "users"
        title: "Human"
        body: "A person decides"
    notes: >-
      There are four kinds of need. Data, meaning something must be supplied. A
      tool — code, an API, or a model call. A routine, meaning it runs on a
      schedule. Or a human, where a person decides.

  - component: bullet-list
    title: "Annotate Every Box"
    items:
      - "One need per step, minimum"
      - "Say which of the four it is"
      - "Unknowns get marked, not skipped"
    notes: >-
      Annotate every box: at least one need per step, say which of the four it
      is, and mark the unknowns rather than skipping them.

  - component: definition
    term: "Claude Routine"
    definition: "A prompt Claude runs on a schedule, unprompted."
    notes: >-
      A Claude Routine is a prompt that Claude runs on a schedule, without
      anyone asking.

  - component: bullet-list
    title: "When a Step Is a Routine"
    items:
      - "It repeats on a clock"
      - "Nobody should have to remember"
      - "Late is worse than imperfect"
    notes: >-
      A step is a routine when it repeats on a clock, when nobody should have to
      remember it, and when being late is worse than being imperfect.

  - component: code
    title: "A Step as a Routine"
    chrome: false
    code: |
      Every weekday at 8:00

      1. Read new files in /intake
      2. Score each against the role
      3. Append to the ranked sheet
      4. Flag anything scoring low
    notes: >-
      Here is one written out. Every weekday at eight: read new files in intake,
      score each against the role, append to the ranked sheet, and flag anything
      scoring low.

  - component: definition
    term: "Human decision"
    definition: "A step where a person judges and the system waits."
    notes: >-
      A human decision is a step where a person judges and the system waits for
      them.

  - component: bullet-list
    title: "Keep a Human When"
    items:
      - "Being wrong is expensive"
      - "The call needs context you lack"
      - "Someone must be accountable"
    notes: >-
      Keep a human in the loop when being wrong is expensive, when the call
      needs context the system does not have, and when someone has to be
      accountable.

  - component: table-slide
    title: "Step to Need"
    headers: ["Step", "What it needs"]
    rows:
      - ["Intake files", "Data plus a routine"]
      - ["Parse text", "A tool"]
      - ["Score match", "A model call"]
      - ["Approve list", "A human decision"]
    notes: >-
      The worked example, annotated. Intake needs data plus a routine. Parse
      needs a tool. Score needs a model call. And approving the list needs a
      human decision.

  # ── The risk pass ──────────────────────────────────────────────────────────
  - component: definition
    term: "The riskiest step"
    definition: "The one whose failure wastes the most time."
    notes: >-
      The riskiest step is the one whose failure would waste the most of your
      time.

  - component: numbered-steps
    title: "Find It"
    steps:
      - title: "Mark unknowns"
        body: "Boxes you cannot describe"
      - title: "Ask who blocks"
        body: "Which stalls everything after"
      - title: "Pick one"
        body: "Only one gets this attention"
    notes: >-
      Find it in three moves. Mark the boxes you cannot describe. Ask which one
      stalls everything after it. Then pick one — only one gets this attention.

  - component: code
    title: "Prompt for Failure Modes"
    chrome: true
    code: |
      Our riskiest step:
      "<describe the step>"

      Give the THREE most likely ways
      this fails in practice.
      Most likely first.
      For each: the early warning sign.
      No fixes yet.
    notes: >-
      Here is the prompt for that. Describe the step, ask for the three most
      likely ways it fails in practice, most likely first, each with its early
      warning sign, and no fixes yet.

  - component: icon-text-rows
    title: "Where Steps Usually Fail"
    rows:
      - icon: "file"
        heading: "Input"
        body: "Arrives wrong or not at all"
      - icon: "zap"
        heading: "Transform"
        body: "Works, but not on real data"
      - icon: "lock"
        heading: "Access"
        body: "The key, quota, or approval"
    notes: >-
      Steps usually fail in three places. The input arrives wrong or not at all.
      The transform works, but not on real data. Or access fails — the key, the
      quota, or the approval.

  - component: bullet-list
    title: "What to Do With Three Failures"
    items:
      - "Build the warning sign in first"
      - "Stub the step if it may not land"
      - "Give the risky box its best owner"
    notes: >-
      Do three things with those failures: build the warning sign in first, stub
      the step if it might not land, and give the risky box your best owner.

  - component: comparison-matrix
    title: "Which Step Gets the Attention"
    options: ["Intake", "Parse", "Score"]
    criteria: ["Unknown", "Blocks rest", "Hard to fix"]
    cells:
      - ["Yes", "Yes", "Yes"]
      - ["No", "Yes", "No"]
      - ["Yes", "No", "No"]
    highlights:
      - [0, 0]
    notes: >-
      Three steps against three criteria. Intake is unknown, blocks the rest,
      and is hard to fix — it takes all three. Parse blocks the rest but is
      known. Score is unknown but blocks nothing.

  - component: bullet-list
    title: "Write the Risk Down"
    items:
      - "Put it on the diagram"
      - "Name the warning sign"
      - "Say who is watching for it"
    notes: >-
      Write the risk down: put it on the diagram, name the warning sign, and say
      who is watching for it.

  # ── Close ──────────────────────────────────────────────────────────────────
  - component: bullet-list
    title: "Done With This Session When"
    items:
      - "The map runs input to output"
      - "It is an Artifact with a link"
      - "Every box names what it needs"
      - "The riskiest step has three failures"
    notes: >-
      You are done when the map runs input to output, it is an Artifact with a
      link, every box names what it needs, and the riskiest step has three named
      failures.

  - component: stat-callout
    title: "What You Leave With"
    stats:
      - value: "1"
        label: "Shared diagram"
      - value: "4"
        label: "Kinds of need"
      - value: "3"
        label: "Named failures"
    notes: >-
      You leave with one shared diagram, four kinds of need annotated, and three
      named failures.

  - component: bullet-list
    title: "Next: Dividing the Work"
    items:
      - "Give every step one owner"
      - "Run workstreams in parallel"
      - "Put the board in GitHub"
    notes: >-
      Next session we give every step one owner, run the workstreams in
      parallel, and put the board in GitHub.

  - component: question
    question: "Which box comes last?"
    notes: >-
      One question to take with you: which box comes last? If two people answer
      differently, your map is not finished.
