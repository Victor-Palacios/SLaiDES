# Immersion Week SF · Day 1 · Session 1.1
# "From Vague Idea to Precise Problem Statement" (9:20–9:55, 35 min)
# Source: https://github.com/UChiCareersinAI/ImmersionWeekSF
#
# Objectives (verbatim from the syllabus):
#   1. Tell a problem statement apart from a solution statement, and use prompt
#      engineering to make Claude interrogate a vague ask until it is precise
#   2. Apply a scoping test — measurable outcome, data actually available,
#      achievable in three days — and make Claude argue the opposite case
#   3. Stand up a Claude Project as the team's shared brain
#
# No palette block: this deck rides the slidekit default colour scheme.
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  # ── Open ───────────────────────────────────────────────────────────────────
  - component: title-slide
    title: "From Vague to Precise"
    subtitle: "Immersion Week SF · Day 1 · Session 1.1"
    notes: >-
      This is session 1.1, From Vague to Precise. Over the next thirty-five
      minutes we turn whatever you arrived with into a problem statement sharp
      enough to build against.

  - component: big-number
    value: "35"
    label: "Minutes"
    context: "You leave with one precise problem statement"
    notes: >-
      Thirty-five minutes, and you leave with exactly one thing: a single
      precise problem statement.

  - component: agenda
    title: "What This Session Covers"
    items:
      - "Problem statements versus solution statements"
      - "Making Claude interrogate a vague ask"
      - "The three-gate scoping test"
      - "Standing up your Claude Project"
    notes: >-
      Four things this session. We separate problem statements from solution
      statements, get Claude to interrogate a vague ask, run the three-gate
      scoping test, and stand up your Claude Project.

  - component: question
    question: "What are you building?"
    notes: >-
      So: what are you building? Answer it in one sentence, out loud, before we
      go any further.

  - component: this-vs-that
    title: "Two Ways to Answer That"
    left:
      value: "Vague"
      label: "An AI thing for resumes"
    right:
      value: "Precise"
      label: "Flags gaps in 200 files"
    notes: >-
      There are two ways to answer that. “An AI thing for resumes” is the vague
      one. “Flags gaps in two hundred files” is the precise one.

  - component: process-steps
    title: "How We Get There"
    steps:
      - label: "Separate"
        body: "Problem apart from solution"
      - label: "Interrogate"
        body: "Let Claude attack the ask"
      - label: "Scope"
        body: "Run the three-gate test"
      - label: "Commit"
        body: "Write it into the Project"
    notes: >-
      Four moves to get from one to the other: separate the problem from the
      solution, let Claude interrogate the ask, run it through the scoping test,
      then commit it to your Project.

  # ── 01 · Problem, not solution ─────────────────────────────────────────────
  - component: section-divider
    number: "01"
    title: "Problem, Not Solution"
    notes: >-
      First, the distinction everything else rests on: a problem is not a
      solution.

  - component: definition
    term: "Problem statement"
    definition: "A gap between what happens and what should."
    notes: >-
      A problem statement is the mismatch between reality and expectation — a
      gap between what happens today and what should happen instead.

  - component: definition
    term: "Solution statement"
    definition: "A thing you plan to build, assuming the diagnosis."
    notes: >-
      A solution statement is something you plan to build, and it quietly
      assumes the diagnosis is already settled.

  - component: two-panel-list
    title: "How to Tell Them Apart"
    accent_side: left
    left:
      title: "Problem"
      items:
        - "Describes a gap"
        - "Admits several fixes"
        - "Names who suffers"
    right:
      title: "Solution"
      items:
        - "Describes a build"
        - "Assumes one fix"
        - "Names a tool"
    notes: >-
      Here is how to tell them apart. A problem describes a gap, admits several
      fixes, and names who suffers. A solution describes a build, assumes one
      fix, and names a tool.

  - component: table-slide
    title: "What They Said, What They Meant"
    headers: ["Said (solution)", "Meant (problem)"]
    rows:
      - ["Build a RAG chatbot", "Staff cannot find answers"]
      - ["Fine-tune a model", "Output misses our tone"]
      - ["Make a dashboard", "Nobody sees the numbers"]
      - ["Use an agent", "Review takes four hours"]
    notes: >-
      These are real asks on the left and the problem underneath each one on the
      right. “Build a RAG chatbot” means staff cannot find answers; “use an
      agent” means review takes four hours.

  - component: bullet-list
    title: "Why Solution-First Hurts"
    items:
      - "You cannot tell if it worked"
      - "The tool choice is already locked"
      - "Scope creeps with no boundary"
      - "Feedback arrives too late to use"
    notes: >-
      Starting from the solution costs you four things: you cannot tell if it
      worked, the tool choice is locked before you understand the problem, scope
      creeps with no boundary, and feedback arrives too late to use.

  - component: icon-text-rows
    title: "Three Tells You Wrote a Solution"
    rows:
      - icon: "zap"
        heading: "A tool is named"
        body: "RAG, agent, fine-tune, dashboard"
      - icon: "grid"
        heading: "Only one fix fits"
        body: "No alternative is even thinkable"
      - icon: "check"
        heading: "No one is in it"
        body: "Nobody is described as stuck"
    notes: >-
      Three tells that what you wrote is a solution. A tool is named. Only one
      fix fits. And nobody appears in it as a person who is stuck.

  - component: pull-quote
    quote: "Names a tool? Not a problem yet."
    attribution: "The fastest test in the room"
    notes: >-
      The fastest test in the room: if it names a tool, it is not a problem
      statement yet.

  # ── Interrogation ──────────────────────────────────────────────────────────
  - component: definition
    term: "Interrogation"
    definition: "Making Claude attack a vague ask until it is precise."
    notes: >-
      Interrogation means handing Claude your vague ask and having it attack
      that ask until what is left is precise.

  - component: bullet-list
    title: "What Makes Claude Interrogate"
    items:
      - "Give it the adversarial role"
      - "Forbid it from proposing solutions"
      - "Demand one question at a time"
      - "Make it refuse to move on early"
    notes: >-
      Four things make it actually interrogate rather than agree: give it the
      adversarial role, forbid it from proposing solutions, demand one question
      at a time, and make it refuse to move on early.

  - component: code
    title: "The Interrogation Prompt"
    chrome: true
    code: |
      You are a skeptical product lead.
      My idea: "an AI thing for resumes"

      Rules:
        - Ask ONE question at a time.
        - Never propose a solution.
        - Reject vague answers.
        - Stop when it is precise.
    notes: >-
      Here is the prompt. A skeptical product lead, your idea in quotes, and
      four rules: one question at a time, never propose a solution, reject vague
      answers, stop when it is precise.

  - component: numbered-steps
    title: "The Interrogation Loop"
    steps:
      - title: "Answer plainly"
        body: "No hedging, no tool names"
      - title: "Let it push"
        body: "Expect the follow-up to hurt"
      - title: "Restate"
        body: "Ask Claude to write it back"
    notes: >-
      The loop is three steps. Answer plainly, with no hedging and no tool
      names. Let it push, and expect the follow-up to hurt. Then ask Claude to
      restate your problem back to you.

  - component: comparison-columns
    title: "Before and After the Interrogation"
    left_title: "Before"
    right_title: "After"
    left_items:
      - text: "An AI thing for resumes"
      - text: "Who for? Unclear"
      - text: "Done when? Unclear"
    right_items:
      - text: "Recruiters miss skill gaps"
      - text: "For 200 intern applicants"
      - text: "Flagged in one pass"
    notes: >-
      This is what one interrogation does. “An AI thing for resumes”, with no
      idea who it is for or when it is done, becomes: recruiters miss skill
      gaps, for two hundred intern applicants, flagged in one pass.

  - component: bullet-list
    title: "Signs It Is Now Precise"
    items:
      - "A stranger can restate it"
      - "You know who is stuck"
      - "You can name a wrong answer"
      - "Two people would agree it is solved"
    notes: >-
      You know it is precise when a stranger can restate it, you know who is
      stuck, you can name a wrong answer, and two people would agree on whether
      it is solved.

  # ── 02 · The scoping test ──────────────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "The Scoping Test"
    notes: >-
      Second: a precise problem still has to be the right size. That is what the
      scoping test is for.

  - component: definition
    term: "Scoping test"
    definition: "Three gates a problem passes before you commit."
    notes: >-
      The scoping test is three gates your problem passes through before you
      commit to it.

  - component: icon-text-rows
    title: "The Three Gates"
    rows:
      - icon: "target"
        heading: "Measurable outcome"
        body: "You can say whether it worked"
      - icon: "file"
        heading: "Data available"
        body: "You have it, today, in hand"
      - icon: "check"
        heading: "Three days"
        body: "Finishable by Friday noon"
    notes: >-
      The three gates are a measurable outcome, so you can say whether it
      worked; data available today, in hand; and three days, meaning finishable
      by Friday noon.

  - component: definition
    term: "Gate 1 · Measurable"
    definition: "State up front what would prove it worked."
    notes: >-
      Gate one is measurable. Before you build anything, state what would prove
      it worked.

  - component: table-slide
    title: "Vague Metric, Measurable Metric"
    headers: ["Vague", "Measurable"]
    rows:
      - ["Better resumes", "Flags 8 of 10 known gaps"]
      - ["Faster reviews", "Under 30 seconds per file"]
      - ["Higher quality", "Two reviewers agree it passes"]
      - ["More useful", "Used unprompted twice"]
    notes: >-
      Vague on the left, measurable on the right. “Better resumes” becomes
      “flags eight of ten known gaps”; “faster reviews” becomes “under thirty
      seconds per file”.

  - component: definition
    term: "Gate 2 · Data"
    definition: "It exists, you may use it, you have it today."
    notes: >-
      Gate two is data, and it has three parts: it exists, you are allowed to
      use it, and you have it today.

  - component: icon-text-rows
    title: "Where Data Plans Die"
    rows:
      - icon: "lock"
        heading: "Access pending"
        body: "Someone still has to approve it"
      - icon: "file"
        heading: "Wrong shape"
        body: "Exists, but not in usable form"
      - icon: "eye"
        heading: "Too sensitive"
        body: "Real records you cannot touch"
    notes: >-
      Data plans die in three places. Access is still pending approval. The data
      exists but is in the wrong shape. Or it is real records too sensitive to
      touch.

  - component: definition
    term: "Gate 3 · Three days"
    definition: "The whole path working, not one part polished."
    notes: >-
      Gate three is three days, and what it means is the whole path working
      rather than one part polished.

  - component: this-vs-that
    title: "What Three Days Buys"
    left:
      value: "One path"
      label: "End to end and rough"
    right:
      value: "One part"
      label: "Polished but alone"
    notes: >-
      Three days buys you one of two things: one path, end to end and rough, or
      one part, polished and alone. Take the rough path.

  - component: comparison-matrix
    title: "Three Candidate Ideas, Three Gates"
    options: ["Resumes", "Policy", "Grader"]
    criteria: ["Measurable", "Data now", "3 days"]
    cells:
      - ["Yes", "Yes", "Yes"]
      - ["Yes", "No", "Yes"]
      - ["No", "Yes", "No"]
    highlights:
      - [0, 0]
    notes: >-
      Three candidate ideas against the three gates. Resumes passes all three.
      Policy fails on data today. Grader fails on measurable and on time.

  - component: definition
    term: "The opposite case"
    definition: "Making Claude argue your problem is the wrong one."
    notes: >-
      The opposite case means having Claude argue that your problem is the wrong
      one to pick.

  - component: code
    title: "Make Claude Argue Against You"
    chrome: true
    code: |
      Our problem statement:
      "<paste it>"

      Argue this is the WRONG problem
      for a three-day build.

      Three strongest objections,
      hardest first. No alternatives.
    notes: >-
      Here is that prompt. Paste your statement, then ask for the three
      strongest objections to it as a three-day build, hardest first, with no
      alternatives offered.

  - component: numbered-steps
    title: "Running the Opposition"
    steps:
      - title: "Read all three"
        body: "Do not answer while reading"
      - title: "Rank them"
        body: "Which would actually sink you"
      - title: "Fix or accept"
        body: "Narrow it, or note the risk"
    notes: >-
      Three steps. Read all three objections without answering. Rank them by
      which would actually sink you. Then either fix the problem or accept the
      risk knowingly.

  - component: bullet-list
    title: "When the Objection Wins"
    items:
      - "Narrow the users, not the ambition"
      - "Shrink the data, keep the path"
      - "Stub the hard step for now"
      - "Change problems only if a gate fails"
    notes: >-
      When an objection lands, narrow the users rather than the ambition, shrink
      the data but keep the path, and stub the hard step for now. Change
      problems only if a gate actually fails.

  - component: bullet-list
    title: "Cut Scope, Not Ambition"
    items:
      - "One user type, not four"
      - "One input format, not any"
      - "One clean path, no edge cases"
    notes: >-
      Cutting scope means one user type instead of four, one input format
      instead of any, and one clean path with no edge cases.

  # ── 03 · The Claude Project ────────────────────────────────────────────────
  - component: section-divider
    number: "03"
    title: "The Team's Shared Brain"
    notes: >-
      Third and last: getting all of this out of your head and into something
      the team shares.

  - component: definition
    term: "Claude Project"
    definition: "A shared workspace holding instructions and context."
    notes: >-
      A Claude Project is a shared workspace that holds your instructions and
      your context in one place.

  - component: two-panel-list
    title: "Chat Versus Project"
    accent_side: right
    left:
      title: "A chat"
      items:
        - "Context dies at the tab"
        - "One person holds it"
        - "Re-explained every time"
    right:
      title: "A Project"
      items:
        - "Context persists"
        - "The whole team shares it"
        - "Explained once"
    notes: >-
      The difference from a chat is this. In a chat, context dies with the tab,
      one person holds it, and you re-explain it every time. In a Project,
      context persists, the whole team shares it, and you explain it once.

  - component: icon-text-rows
    title: "What a Project Holds"
    rows:
      - icon: "doc"
        heading: "Instructions"
        body: "Standing rules for every chat"
      - icon: "file"
        heading: "Context"
        body: "Uploaded docs and data"
      - icon: "users"
        heading: "One place"
        body: "Everyone works from it"
    notes: >-
      A Project holds three things: instructions, which are standing rules for
      every chat; context, meaning your uploaded documents and data; and one
      place everybody works from.

  - component: numbered-steps
    title: "Stand One Up Now"
    steps:
      - title: "Create"
        body: "Name it for the problem"
      - title: "Instruct"
        body: "Paste the problem statement"
      - title: "Share"
        body: "Add every teammate today"
    notes: >-
      Three steps, right now. Create it and name it for the problem. Paste your
      problem statement into the instructions. Then add every teammate today.

  - component: code
    title: "Project Instructions Template"
    chrome: false
    code: |
      # Problem
      <the precise statement>

      # Success looks like
      <the measurable outcome>

      # Out of scope
      <what we cut, and why>
    notes: >-
      Here is the template for those instructions: the problem, what success
      looks like, and what is out of scope along with why you cut it.

  - component: bullet-list
    title: "What to Upload"
    items:
      - "Sample data, even if faked"
      - "The interrogation transcript"
      - "The objections you accepted"
    notes: >-
      Upload three things: sample data even if it is faked, the interrogation
      transcript, and the objections you accepted.

  - component: bullet-list
    title: "What Not to Upload"
    items:
      - "Real personal records"
      - "Anything under an NDA"
      - "Credentials or API keys"
    notes: >-
      Do not upload real personal records, anything under an NDA, or credentials
      and API keys.

  - component: card-grid
    title: "Team Conventions Worth Setting"
    cards:
      - icon: "doc"
        title: "One source"
        body: "Project over chat"
      - icon: "check"
        title: "Log it"
        body: "Decisions land in writing"
      - icon: "users"
        title: "Shared"
        body: "Everyone reads it first"
      - icon: "zap"
        title: "Update"
        body: "Change it when scope does"
    notes: >-
      Four conventions worth agreeing now: the Project is the single source,
      decisions get logged in writing, everyone reads it first, and it gets
      updated whenever scope changes.

  - component: bullet-list
    title: "Project Pitfalls"
    items:
      - "Instructions written once, never updated"
      - "Uploads nobody has actually read"
      - "One member still working in chat"
    notes: >-
      Three ways Projects go stale: instructions written once and never updated,
      uploads nobody has actually read, and one team member still working in a
      private chat.

  - component: bullet-list
    title: "Done With This Session When"
    items:
      - "The statement passes three gates"
      - "The strongest objection is answered"
      - "The Project exists and is shared"
    notes: >-
      You are done with this session when your statement passes all three gates,
      the strongest objection has an answer, and the Project exists and is
      shared.

  # ── Close ──────────────────────────────────────────────────────────────────
  - component: stat-callout
    title: "What You Leave With"
    stats:
      - value: "1"
        label: "Precise problem"
      - value: "3"
        label: "Gates passed"
      - value: "1"
        label: "Shared Project"
    notes: >-
      You leave with one precise problem, three gates passed, and one shared
      Project.

  - component: bullet-list
    title: "Next: Mapping the Workflow"
    items:
      - "Break the problem into steps"
      - "Draw it as a Claude Artifact"
      - "Name what each step needs"
    notes: >-
      Next session we break that problem into steps, draw it as a Claude
      Artifact, and name what each step needs.

  - component: question
    question: "Can a stranger restate it?"
    notes: >-
      One last question to take with you: can a stranger restate your problem
      back to you? If not, it is not precise yet.
