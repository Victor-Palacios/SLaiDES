# Immersion Week SF · Day 3 · Session 3.3
# "Hardening & Handoff" (11:00–11:50, 50 min)
# Source: https://github.com/UChiCareersinAI/ImmersionWeekSF
#
# Objectives (verbatim from the syllabus):
#   1. Triage the failure log by severity against cost to fix, and commit to a
#      cut line
#   2. Fix what is above the line, re-run the exact tests that caught each one,
#      and push to GitHub
#   3. Set up unlimited Claude Routines — schedule as many recurring checks as
#      the prototype needs, so it keeps being tested after you stop looking
#
# Final session of the week; the close doubles as the close of Immersion Week.
# No palette block: this deck rides the slidekit default colour scheme.
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  # ── Open ───────────────────────────────────────────────────────────────────
  - component: title-slide
    title: "Hardening and Handoff"
    subtitle: "Immersion Week SF · Day 3 · Session 3.3"
    notes: >-
      This is session 3.3, Hardening and Handoff — the last session of the week.
      You are holding a log of your own failures, written by people with no
      reason to be gentle.

  - component: big-number
    value: "50"
    label: "Minutes"
    context: "You leave with it hardened"
    notes: >-
      Fifty minutes, and you leave with the failures above the cut line fixed
      and proven, everything pushed, and a schedule of checks running after you
      go home.

  - component: agenda
    title: "What This Session Covers"
    items:
      - "Triage severity against cost"
      - "Commit to a cut line"
      - "Fix, re-run, and push"
      - "Schedule checks that outlive you"
    notes: >-
      Four things this session. We triage severity against cost, commit to a cut
      line, fix and re-run and push, and schedule checks that outlive you.

  - component: question
    question: "What will you not fix?"
    notes: >-
      Start here: what will you not fix? In fifty minutes you cannot fix
      everything, and the teams that end strongest decided that on purpose
      rather than by running out of time.

  - component: this-vs-that
    title: "From 3.2 to Now"
    left:
      value: "A log"
      label: "Everything that broke"
    right:
      value: "A line"
      label: "What you will fix"
    notes: >-
      A log is a pile of facts, and it produces anxiety. A cut line turns the
      same pile into a plan.

  - component: process-steps
    title: "How We Get There"
    steps:
      - label: "Triage"
        body: "Severity against cost to fix"
      - label: "Cut"
        body: "Draw the line, out loud"
      - label: "Fix"
        body: "Re-run the exact test"
      - label: "Watch"
        body: "Schedule it to keep testing"
    notes: >-
      Four moves: triage on severity against cost to fix, draw the cut line out
      loud, fix and re-run the exact test, then schedule it to keep testing
      itself.

  - component: timeline
    title: "The Next 50 Minutes"
    events:
      - date: "11:00"
        title: "Triage"
        description: "Every finding placed on two axes"
      - date: "11:12"
        title: "The line"
        description: "Agreed, written, committed to"
      - date: "11:18"
        title: "Fix"
        description: "One at a time, re-run each"
      - date: "11:40"
        title: "Schedule"
        description: "Checks that run without you"
    notes: >-
      The hour runs in four blocks, and 11:40 is the gate — stop fixing then,
      whatever is left. The scheduled checks are the only part of this hour that
      keeps working after the week ends.

  - component: pull-quote
    quote: "Deciding what to ignore is the work."
    attribution: "The triage rule"
    notes: >-
      Deciding what to ignore is the work. Anyone can rank a list; committing to
      leave the bottom of it alone is what makes the ranking mean anything.

  # ── 01 · The Cut Line ──────────────────────────────────────────────────────
  - component: section-divider
    number: "01"
    title: "The Cut Line"
    notes: >-
      First objective: two axes, one line, twelve minutes — done as a whole team
      with the log on a shared screen.

  - component: definition
    term: "Triage"
    definition: "Sorting by what to do, not by what is worst"
    notes: >-
      Triage means sorting by what to do, not by what is worst. It is ranking by
      where your limited effort does the most good, which is a different order.

  - component: bullet-list
    title: "Before You Sort Anything"
    items:
      - "Read the whole log, all of it"
      - "Merge findings with one cause"
      - "Reproduce anything unclear"
      - "Then start ranking"
    notes: >-
      Four steps before ranking anything. Read the whole log. Merge findings
      that share one cause. Reproduce anything unclear. Then start ranking.

  - component: table-slide
    title: "Two Axes, Nothing Else"
    headers: ["Axis", "The question"]
    rows:
      - ["Severity", "How bad if a judge hits it?"]
      - ["Cost", "How long to fix it, honestly?"]
    notes: >-
      Two questions per finding, thirty seconds each. Severity: how bad is it if
      a judge hits it? Cost: how long to fix, honestly? Resist adding a third
      axis.

  - component: comparison-matrix
    title: "Where Each Finding Lands"
    options: ["Cheap fix", "Costly fix"]
    criteria: ["Critical", "High", "Low"]
    cells:
      - ["Fix now", "Fix now"]
      - ["Fix now", "Decide"]
      - ["Maybe", "Never"]
    highlights: [[0, 1], [1, 1]]
    notes: >-
      Here is the grid. A critical finding is fixed now whether it is cheap or
      costly — severity beats cost at the top. A high one is fixed if cheap and
      debated if costly. A low one is maybe if cheap and never if costly.

  - component: definition
    term: "Cut line"
    definition: "The point below which you fix nothing today"
    notes: >-
      The cut line is the point below which you fix nothing today. Not tonight,
      and not quietly during the demo.

  - component: numbered-steps
    title: "Drawing It"
    steps:
      - title: "Rank by the grid"
        body: "Fix now, decide, maybe, never"
      - title: "Add up the hours"
        body: "Against the time you actually have"
      - title: "Draw where the time runs out"
        body: "Then stop, and say the number"
    notes: >-
      Three steps. Rank by the grid — fix now, decide, maybe, never. Add up the
      hours against the time you actually have. Then draw the line where the
      time runs out, and say the number out loud.

  - component: bullet-list
    title: "Always Above the Line"
    items:
      - "Confidently wrong output"
      - "Anything that hangs forever"
      - "A crash on a normal input"
      - "Anything that leaks a secret"
    notes: >-
      Four things stay above the line regardless of cost: confidently wrong
      output, anything that hangs forever, a crash on a normal input, and
      anything that leaks a secret.

  - component: bullet-list
    title: "Usually Below the Line"
    items:
      - "It looks rough"
      - "It is slow but finishes"
      - "It fails on an absurd input"
      - "Something already in caveats"
    notes: >-
      Four things you can leave alone with a clear conscience: it looks rough,
      it is slow but finishes, it fails on an absurd input, or it is already in
      your caveats.

  - component: bullet-list
    title: "Estimating Cost Fast"
    items:
      - "Under 10 minutes: just do it"
      - "Under an hour: needs the line"
      - "Over an hour: today, no"
      - "Unknown: treat it as over"
    notes: >-
      Four buckets, no finer. Under ten minutes: just do it. Under an hour: it
      needs the line. Over an hour: not today. Unknown: treat it as over an
      hour.

  - component: two-panel-list
    title: "Two Ways to Spend the Hour"
    left:
      title: "Without a line"
      items:
        - "Fix what is nearest"
        - "Run out of time surprised"
        - "The critical one survives"
    right:
      title: "With a line"
      items:
        - "Fix what matters most"
        - "Run out of time on purpose"
        - "Know exactly what is left"
    accent_side: "right"
    notes: >-
      Without a line you fix what is nearest, run out of time surprised, and the
      critical one survives. With a line you fix what matters most, run out of
      time on purpose, and know exactly what is left.

  - component: bullet-list
    title: "Traps in Triage"
    items:
      - "Fixing the interesting one first"
      - "Softening severity to feel better"
      - "Arguing whether it counts"
      - "Re-litigating their findings"
    notes: >-
      Four ways the twelve minutes disappear: fixing the interesting one first,
      softening severity to feel better, arguing whether something counts, and
      re-litigating their findings.

  - component: icon-text-rows
    title: "Three Rules for the Line"
    rows:
      - icon: "clock"
        heading: "Drawn against real time"
        body: "Sum the estimates; do not aspire"
      - icon: "users"
        heading: "Agreed out loud"
        body: "Everyone hears where it landed"
      - icon: "lock"
        heading: "Held once drawn"
        body: "Moving it later is how the hour is lost"
    notes: >-
      Three rules. Drawn against real time — sum the estimates rather than
      aspiring. Agreed out loud, so everyone hears where it landed. And held
      once drawn, because moving it later is how the hour is lost.

  - component: code
    title: "The line, written into the repo"
    code: |
      # TRIAGE.md
      ABOVE (fixing now):
        F-03 wrong year, F-07 empty hangs
      BELOW (not today, on purpose):
        F-01 slow, F-05 ugly errors,
        F-09 fails on 400-page input
    notes: >-
      Write it into the repo as TRIAGE.md — what is above the line, and what is
      below it on purpose. The lower list is the more valuable one, because it
      goes straight into your demo caveats.

  # ── 02 · Fix and Prove It ──────────────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "Fix and Prove It"
    notes: >-
      Second objective: twenty-two minutes of fixing, and every fix proven by
      re-running the exact test that caught it.

  - component: definition
    term: "Fixed"
    definition: "The test that caught it now passes"
    notes: >-
      Fixed means the test that caught it now passes. Not “I changed the code”,
      not “it should be better”.

  - component: numbered-steps
    title: "The Fix Loop"
    steps:
      - title: "Reproduce it first"
        body: "See the failure before you change anything"
      - title: "Change one thing"
        body: "The smallest edit that could work"
      - title: "Re-run that exact input"
        body: "The one from the log, not a similar one"
    notes: >-
      Three steps. Reproduce it first, and see the failure before you change
      anything. Change one thing, the smallest edit that could work. Then re-run
      that exact input — the one from the log, not a similar one.

  - component: bullet-list
    title: "One at a Time"
    items:
      - "One finding, one change"
      - "Re-run before starting the next"
      - "Commit each fix separately"
      - "Never batch three and hope"
    notes: >-
      Four rules that feel slow and are faster: one finding one change, re-run
      before starting the next, commit each fix separately, and never batch
      three and hope.

  - component: code
    title: "Prove it, one line"
    code: |
      $ python run.py fixtures/report-2019.pdf
      Refused: this covers 2019, not 2024.

      # F-03 was: a confident 2024 summary.
      # Now it refuses. Re-ran, watched it.
    notes: >-
      This is what proof looks like — the exact input from the log, the new
      behaviour on screen, and a note tying it back to the finding number.

  - component: this-vs-that
    title: "Two Kinds of Done"
    left:
      value: "Believe"
      label: "It should work now"
    right:
      value: "Re-ran"
      label: "You watched it work"
    notes: >-
      Two kinds of done. You believe it should work now. Or you re-ran it and
      watched it work. Every unproven fix is a finding you have moved out of
      sight.

  - component: bullet-list
    title: "Not Now"
    items:
      - "Do not refactor while fixing"
      - "Do not add a feature nobody asked"
      - "Do not restyle anything"
      - "Do not start a second input"
    notes: >-
      Not now: do not refactor while fixing, do not add a feature nobody asked
      for, do not restyle anything, and do not start on a second input.

  - component: numbered-steps
    title: "Pushing It"
    steps:
      - title: "Commit per finding"
        body: "Message names the finding it closes"
      - title: "Push after each one"
        body: "Not once at the end, when it is rushed"
      - title: "Update the caveats"
        body: "Fixed comes off, below-the-line goes on"
    notes: >-
      Three steps. Commit per finding, with the message naming the finding it
      closes. Push after each one rather than once at the end when it is rushed.
      And update the caveats — fixed comes off, below-the-line goes on.

  - component: code
    title: "A commit that closes a finding"
    code: |
      $ git add steps/extract.py
      $ git commit -m "F-03: refuse mismatched year"
      $ git push
      # then: strike F-03 from CAVEATS.md
    notes: >-
      Explicit paths, the finding number in the message, and the caveat update
      as part of the same move. Anyone reading the history later can trace a fix
      back to the log entry that caused it.

  - component: table-slide
    title: "What the Record Shows"
    headers: ["Finding", "State"]
    rows:
      - ["F-03 wrong year", "Fixed, re-ran"]
      - ["F-07 empty hangs", "Fixed, re-ran"]
      - ["F-01 slow", "Below the line"]
      - ["F-09 huge input", "Below the line"]
    notes: >-
      Four rows a stranger can read in ten seconds. Two fixed and re-ran, two
      below the line. Note that the below-the-line entries stay on the record
      rather than disappearing.

  - component: bullet-list
    title: "The Ones You Did Not Fix"
    items:
      - "They go into the caveats"
      - "They go into the demo script"
      - "They become the next sprint"
      - "They are not failures"
    notes: >-
      The ones you did not fix go into the caveats, into the demo script, and
      into the next sprint. They are not failures — every shipped system has a
      list like this.

  - component: pull-quote
    quote: "An unproven fix is still a bug."
    attribution: "Objective two, restated"
    notes: >-
      An unproven fix is still a bug. If there is time for one but not both, fix
      fewer things and prove them.

  # ── 03 · After You Stop Looking ────────────────────────────────────────────
  - component: section-divider
    number: "03"
    title: "After You Stop Looking"
    notes: >-
      Third objective, and the one that outlives the week. Everything so far was
      tested because people were watching.

  - component: question
    question: "Who tests it next week?"
    notes: >-
      So: who tests it next week? For most prototypes the honest answer is
      nobody, which is why they quietly stop working.

  - component: definition
    term: "Routine"
    definition: "A prompt that runs on a schedule, without you"
    notes: >-
      A Routine is a prompt that runs on a schedule, without you. It is a
      scheduled agent run — the same instructions you would type, fired on a
      timer.

  - component: bullet-list
    title: "Why Schedule Checks at All"
    items:
      - "Things break with nobody touching them"
      - "A key expires, a service moves"
      - "You will not think to look"
      - "A dead demo is found by a judge"
    notes: >-
      Four reasons to schedule checks. Things break with nobody touching them. A
      key expires, a service moves. You will not think to look. And a dead demo
      gets found by a judge.

  - component: numbered-steps
    title: "Setting One Up"
    steps:
      - title: "Write the check as a prompt"
        body: "Exactly what you would do by hand"
      - title: "Pick a schedule"
        body: "Daily is right for almost everything"
      - title: "Say where it reports"
        body: "Somewhere you will actually see it"
    notes: >-
      Three steps. Write the check as a prompt — exactly what you would do by
      hand. Pick a schedule, and daily is right for almost everything. Then say
      where it reports, somewhere you will actually see it.

  - component: code
    title: "A check worth scheduling"
    code: |
      Every morning at 8:
      Open <our public URL>.
      Upload fixtures/report.pdf, click Run.
      If the output is missing or wrong,
      say so in one line. Otherwise say OK.
    notes: >-
      Five lines, and it is just your happy path run by somebody else. Open the
      URL, upload the fixture, click Run, and say so in one line if the output
      is missing or wrong — otherwise say OK.

  - component: bullet-list
    title: "What to Schedule"
    items:
      - "The happy path, end to end"
      - "The findings you fixed today"
      - "The URL still loads at all"
      - "Anything with a key or a quota"
    notes: >-
      Four things to schedule: the happy path end to end, the findings you fixed
      today, whether the URL still loads at all, and anything with a key or a
      quota.

  - component: two-panel-list
    title: "Two Kinds of Check"
    left:
      title: "Weak"
      items:
        - "\"Check if it works\""
        - "Reports only on failure"
        - "Goes where nobody looks"
    right:
      title: "Strong"
      items:
        - "One input, one expectation"
        - "Reports either way"
        - "Lands where you look daily"
    accent_side: "right"
    notes: >-
      A weak check says “check if it works”, reports only on failure, and goes
      where nobody looks. A strong one has one input and one expectation,
      reports either way, and lands where you look daily.

  - component: bullet-list
    title: "Schedule as Many as It Needs"
    items:
      - "One per fix you made today"
      - "One for the happy path"
      - "One for each external thing"
      - "Cheap enough to be generous"
    notes: >-
      The constraint is not the count — the syllabus says unlimited. One per fix
      you made today, one for the happy path, one for each external dependency.
      Be generous with checks and strict about them reporting something you can
      act on.

  - component: icon-text-rows
    title: "Three Every Prototype Needs"
    rows:
      - icon: "heart"
        heading: "Is it alive"
        body: "The URL loads and returns a page"
      - icon: "path"
        heading: "Does it still work"
        body: "The happy path, start to finish, daily"
      - icon: "shield"
        heading: "Did the fixes hold"
        body: "Today's findings, re-run on a timer"
    notes: >-
      If you only set up three, make it these. Is it alive — the URL loads and
      returns a page. Does it still work — the happy path daily, start to
      finish. And did the fixes hold — today's findings, re-run on a timer.

  - component: bullet-list
    title: "The Handoff"
    items:
      - "README says what it does"
      - "CAVEATS says what it does not"
      - "TRIAGE says what you chose"
      - "The checks say it still runs"
    notes: >-
      Four files, and together they are the handoff. README says what it does.
      CAVEATS says what it does not. TRIAGE says what you chose. And the checks
      say it still runs.

  - component: file-tree
    title: "The repo at the end of the week"
    root: "happy-path/"
    entries:
      - name: "docs/"
        depth: 0
      - name: "index.html"
        depth: 1
      - name: "fixtures/"
        depth: 0
      - name: "steps/"
        depth: 0
      - name: "tests/"
        depth: 0
      - name: "edge-cases.md"
        depth: 1
      - name: "run.py"
        depth: 0
      - name: "CAVEATS.md"
        depth: 0
      - name: "FINDINGS.md"
        depth: 0
      - name: "TRIAGE.md"
        depth: 0
      - name: "README.md"
        depth: 0
    notes: >-
      Three days of work in one screen. Four of these files are prose rather
      than code — the record of what you chose and what you know is as much of
      the deliverable as the pipeline.

  - component: table-slide
    title: "The Handoff Checklist"
    headers: ["Item", "Done means"]
    rows:
      - ["Everything pushed", "Nothing only local"]
      - ["Fixes proven", "Each test re-run"]
      - ["Caveats current", "Matches reality today"]
      - ["Checks running", "One fired already"]
    notes: >-
      Four binary checks before 11:50. Everything pushed, nothing only local.
      Fixes proven, each test re-run. Caveats current, matching reality today.
      And checks running, with at least one already fired.

  - component: numbered-steps
    title: "If You Are Behind"
    steps:
      - title: "Stop fixing at 11:40"
        body: "Whatever is left goes into caveats"
      - title: "Push what is proven"
        body: "An unproven change stays uncommitted"
      - title: "Never skip the schedule"
        body: "It is the only part that outlives today"
    notes: >-
      If you are behind: stop fixing at 11:40 and whatever is left goes into the
      caveats. Push what is proven, and leave an unproven change uncommitted.
      But never skip the schedule — it is the only part that outlives today.

  - component: bullet-list
    title: "Leaving This Session"
    items:
      - "A cut line, written and held"
      - "Fixes above it, each re-run"
      - "Everything pushed to GitHub"
      - "Checks running without you"
    notes: >-
      You are leaving with a cut line written and held, the fixes above it each
      re-run, everything pushed to GitHub, and checks running without you.

  - component: table-slide
    title: "Write This Down Now"
    headers: ["Question", "Your answer"]
    rows:
      - ["Where the line landed", "…"]
      - ["Fixed and proven", "…"]
      - ["Biggest thing left", "…"]
      - ["What the checks watch", "…"]
    notes: >-
      The last four answers of the week: where the line landed, what you fixed
      and proved, the biggest thing left, and what the checks are watching.

  - component: bullet-list
    title: "What You Built This Week"
    items:
      - "A problem stated precisely"
      - "A workflow mapped and owned"
      - "A prototype at a public URL"
      - "Proof that you tested it"
    notes: >-
      What you built this week: a problem stated precisely, a workflow mapped
      and owned, a prototype at a public URL, and proof that you tested it.
      Plenty of people can show a demo; far fewer can show what they did to
      break it.

  - component: question
    question: "What would you build next?"
    notes: >-
      One last question: what would you build next? Everything below your cut
      line, everything in your caveats and everything the red team found is
      already the answer — you leave with a backlog rather than a blank page.
