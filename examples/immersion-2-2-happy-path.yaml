# Immersion Week SF · Day 2 · Session 2.2
# "Building the Happy Path" (10:00–10:55, 55 min)
# Source: https://github.com/UChiCareersinAI/ImmersionWeekSF
#
# Objectives (verbatim from the syllabus):
#   1. Drive Claude Code to implement each step against one known-good input —
#      no edge cases, no error handling, not yet
#   2. Connect the steps so a single input reaches a finished output with no
#      manual intervention
#   3. Commit to GitHub the moment it works, before adding anything else to it
#
# No palette block: this deck rides the slidekit default colour scheme.
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  # ── Open ───────────────────────────────────────────────────────────────────
  - component: title-slide
    title: "The Happy Path"
    subtitle: "Immersion Week SF · Day 2 · Session 2.2"
    notes: >-
      This is session 2.2, the Happy Path. It is the first session of the week
      where we write code.

  - component: big-number
    value: "55"
    label: "Minutes"
    context: "One input reaches one output"
    notes: >-
      Fifty-five minutes, and by the end one known-good input travels your whole
      map and comes out the far end without anyone touching it.

  - component: agenda
    title: "What This Session Covers"
    items:
      - "Pick one known-good input"
      - "Build each step against it"
      - "Connect the steps end to end"
      - "Commit the moment it works"
    notes: >-
      Four things this session. We pick one known-good input, build each step
      against it, connect the steps end to end, and commit the moment it works.

  - component: question
    question: "What is your one input?"
    notes: >-
      So: what is your one input? Not a category of inputs — one specific file,
      message or URL.

  - component: this-vs-that
    title: "From 2.1 to Now"
    left:
      value: "A stack"
      label: "What each step runs on"
    right:
      value: "A path"
      label: "One input, all the way"
    notes: >-
      Last session gave every step a tool. Tools sitting side by side are not a
      prototype; the prototype appears when one input crosses all of them
      without help.

  - component: process-steps
    title: "How We Get There"
    steps:
      - label: "Input"
        body: "Choose one, freeze it"
      - label: "Build"
        body: "One step at a time"
      - label: "Chain"
        body: "Remove every hand"
      - label: "Commit"
        body: "The second it works"
    notes: >-
      Four moves: choose one input and freeze it, build one step at a time,
      chain them so no hands are left in the middle, and commit the second it
      works.

  - component: timeline
    title: "The Next 55 Minutes"
    events:
      - date: "10:00"
        title: "Freeze it"
        description: "One file, committed, shared"
      - date: "10:10"
        title: "Build steps"
        description: "One box at a time, verified"
      - date: "10:35"
        title: "Connect"
        description: "Run it from a cold start"
      - date: "10:50"
        title: "Commit"
        description: "Tag the version that works"
    notes: >-
      The hour runs in four blocks. Freeze the input by ten past, build steps
      until 10:35, connect from a cold start, and commit and tag by 10:50. If
      you are still building steps at 10:35, cut a box.

  - component: pull-quote
    quote: "Make it work. Only then, anything else."
    attribution: "The Day 2 rule"
    notes: >-
      Make it work. Only then, anything else. Working comes before right, and
      right comes before fast — today ends at the first word.

  # ── 01 · One Known-Good Input ──────────────────────────────────────────────
  - component: section-divider
    number: "01"
    title: "One Known-Good Input"
    notes: >-
      First objective: one known-good input, chosen and frozen.

  - component: definition
    term: "Happy path"
    definition: "The one route where nothing goes wrong"
    notes: >-
      The happy path is the one route through your system where nothing goes
      wrong.

  - component: bullet-list
    title: "What It Is Not"
    items:
      - "Not the average case"
      - "Not most of your inputs"
      - "Not robust to anything"
      - "Not what you ship later"
    notes: >-
      It is not the average case, not most of your inputs, not robust to
      anything, and not what you ship later. It is allowed to be embarrassingly
      narrow.

  - component: numbered-steps
    title: "Choosing the Input"
    steps:
      - title: "Take a real one"
        body: "From the actual problem, not invented"
      - title: "Check it is boring"
        body: "Nothing weird, nothing missing"
      - title: "Freeze it in the repo"
        body: "Same bytes for everyone, all day"
    notes: >-
      Three steps to choose it. Take a real one, from the actual problem rather
      than invented. Check it is boring — nothing weird, nothing missing. Then
      freeze it in the repo, so it is the same bytes for everyone all day.

  - component: bullet-list
    title: "What Makes One Good"
    items:
      - "Small enough to read fully"
      - "Real enough to be convincing"
      - "Boring enough to always work"
      - "Fixed, so results compare"
    notes: >-
      A good input is small enough to read fully, real enough to be convincing,
      boring enough to always work, and fixed so results can be compared.

  - component: code
    title: "Freeze it where everyone can see"
    code: |
      $ mkdir -p fixtures
      $ cp ~/Downloads/report.pdf fixtures/
      $ git add fixtures/report.pdf
      $ git commit -m "freeze demo input"
    notes: >-
      Four commands and thirty seconds: make a fixtures folder, copy the file
      in, add it, and commit it. After that nobody argues about inputs for the
      rest of the week.

  - component: two-panel-list
    title: "Today and Not Today"
    left:
      title: "Today"
      items:
        - "One input, all the way"
        - "The steps from your map"
        - "Whatever is ugliest"
    right:
      title: "Not today"
      items:
        - "Edge cases"
        - "Error handling"
        - "A second input"
    accent_side: "left"
    notes: >-
      Today is one input all the way, the steps from your map, and whatever is
      ugliest. Not today: edge cases, error handling, and a second input.

  - component: bullet-list
    title: "The Ban List for This Hour"
    items:
      - "No try or catch anywhere"
      - "No configuration files"
      - "No second input to test"
      - "No renaming or refactoring"
    notes: >-
      The ban list for this hour. No try or catch anywhere. No configuration
      files. No second input to test. And no renaming or refactoring.

  - component: definition
    term: "Claude Code"
    definition: "An agent that edits and runs your repo"
    notes: >-
      Claude Code is an agent that edits and runs your repo. It is not
      autocomplete — it reads files, writes them, and runs commands.

  - component: numbered-steps
    title: "Driving It, Per Step"
    steps:
      - title: "Name the one step"
        body: "From your map, by its box"
      - title: "Give it the contract"
        body: "What comes in, what goes out"
      - title: "Point at the input"
        body: "The frozen file, by path"
    notes: >-
      Three things in every request. Name the one step, by its box on your map.
      Give it the contract — what comes in and what goes out. And point at the
      input, the frozen file, by path.

  - component: bullet-list
    title: "Give It What It Needs"
    items:
      - "The map, as a file in the repo"
      - "The contracts between steps"
      - "The frozen input, by path"
      - "The command that proves it ran"
    notes: >-
      It can read anything you put in the repo, so give it four things: the map
      as a file, the contracts between steps, the frozen input by path, and the
      command that proves it ran.

  - component: comparison-columns
    title: "Two Ways to Ask"
    left_title: "Vague"
    right_title: "Specific"
    left_items:
      - text: "\"Parse the document\""
      - text: "\"Make it handle PDFs\""
      - text: "\"Clean up the output\""
    right_items:
      - text: "\"Read fixtures/report.pdf\""
      - text: "\"Return title and date\""
      - text: "\"Write it to out.json\""
    notes: >-
      Two ways to ask. Vague: “parse the document”, “make it handle PDFs”.
      Specific: “read fixtures slash report dot pdf”, “return title and date”,
      “write it to out dot json”.

  - component: code
    title: "A request worth making"
    code: |
      Read fixtures/report.pdf.
      Pull out title, author, date.
      Write them to out/step1.json.
      Run it and show me the file.
    notes: >-
      Here is a request worth making. Read the file, pull out title, author and
      date, write them to a named output — and run it and show me the file.

  - component: icon-text-rows
    title: "Three Rules for Driving"
    rows:
      - icon: "target"
        heading: "One step per ask"
        body: "Never two boxes of the map at once"
      - icon: "eye"
        heading: "Make it run"
        body: "Ask for the output, not a description"
      - icon: "undo"
        heading: "Reset, do not nudge"
        body: "If two tries fail, restate the whole ask"
    notes: >-
      Three rules for driving it. One step per ask, never two boxes at once.
      Make it run, and ask for the output rather than a description. And reset
      rather than nudge — if two tries fail, restate the whole ask.

  - component: bullet-list
    title: "When It Goes Sideways"
    items:
      - "It invented a file — name paths"
      - "It over-built — say what to skip"
      - "It cannot run — give it the command"
      - "It loops — restate from scratch"
    notes: >-
      Four common failures and their fixes. It invented a file, so name paths.
      It over-built, so say what to skip. It cannot run, so give it the command.
      It is looping, so restate from scratch.

  - component: bullet-list
    title: "Check Each Step Before Moving On"
    items:
      - "You ran it yourself, just now"
      - "The output file exists"
      - "You read the output"
      - "It matches the contract"
    notes: >-
      Before you move to the next box: you ran it yourself just now, the output
      file exists, you read the output, and it matches the contract.

  # ── 02 · Connect the Steps ─────────────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "Connect the Steps"
    notes: >-
      Second objective: connecting the steps so one input reaches the output
      with nobody in the middle.

  - component: question
    question: "Where do hands still touch?"
    notes: >-
      Your steps work individually. So where do hands still touch it?

  - component: definition
    term: "Manual step"
    definition: "Anything a person does between two steps"
    notes: >-
      A manual step is anything a person does between two steps. Renaming a file
      counts. Opening a tab counts.

  - component: bullet-list
    title: "Manual Steps That Hide"
    items:
      - "Copying output into the next box"
      - "Renaming a file by hand"
      - "Pasting into a chat window"
      - "Knowing to run them in order"
    notes: >-
      Four that hide in plain sight: copying output into the next box, renaming
      a file by hand, pasting into a chat window, and simply knowing to run them
      in the right order.

  - component: this-vs-that
    title: "Two Kinds of Demo"
    left:
      value: "Narrated"
      label: "And now I open this"
    right:
      value: "Run once"
      label: "One command, done"
    notes: >-
      Two kinds of demo. The narrated one, where you say “and now I open this”.
      And the one that runs once — one command, done.

  - component: numbered-steps
    title: "Connecting, in Order"
    steps:
      - title: "Write the contracts down"
        body: "What each step leaves behind"
      - title: "Chain two, then three"
        body: "Add one box at a time"
      - title: "Run it from cold"
        body: "Delete the outputs and start over"
    notes: >-
      Connect in order. Write the contracts down, meaning what each step leaves
      behind. Chain two, then three, adding one box at a time. Then run it from
      cold, deleting the outputs and starting over.

  - component: table-slide
    title: "Write Down the Seams"
    headers: ["Step", "Leaves behind"]
    rows:
      - ["Ingest", "out/raw.json"]
      - ["Extract", "out/fields.json"]
      - ["Reason", "out/answer.md"]
      - ["Render", "out/index.html"]
    notes: >-
      Write the seams down with real filenames. Ingest leaves raw JSON, extract
      leaves fields, reason leaves an answer, render leaves the page.

  - component: code
    title: "The whole path, one command"
    code: |
      $ rm -rf out/ && mkdir out
      $ python run.py fixtures/report.pdf
      ... 4 steps ok
      $ open out/index.html
    notes: >-
      The whole path in one command. Clear the output directory, run it against
      the frozen input, four steps report ok, and open the result. That first
      line is what proves it runs from cold rather than from leftovers.

  - component: bullet-list
    title: "The Seam Is Where It Breaks"
    items:
      - "One step writes, the next cannot read"
      - "A field is named two ways"
      - "One step assumes a list"
      - "A path is right on one machine"
    notes: >-
      Seams are where it breaks, and they are mismatches rather than bugs. One
      step writes something the next cannot read, a field is named two ways, a
      step assumes a list, or a path is only right on one machine.

  - component: numbered-steps
    title: "Debugging a Seam"
    steps:
      - title: "Open both files"
        body: "What was written, what was expected"
      - title: "Fix the later step"
        body: "Adapt downstream, not upstream"
      - title: "Rerun from cold"
        body: "Never trust a partial run"
    notes: >-
      Debugging a seam is three steps. Open both files — what was written and
      what was expected. Fix the later step, adapting downstream rather than
      upstream. Then rerun from cold, because a partial run proves nothing.

  - component: comparison-matrix
    title: "Connect Early or Late"
    options: ["Connect early", "Connect late"]
    criteria: ["Surprises", "Rework", "Demo risk"]
    cells:
      - ["Now, small", "Late, large"]
      - ["Cheap", "Expensive"]
      - ["Low", "High"]
    highlights: [[0, 0], [2, 0]]
    notes: >-
      Connecting early means surprises now and small, cheap rework, and low demo
      risk. Connecting late means surprises late and large, expensive rework,
      and high demo risk.

  - component: card-grid
    title: "Four Smells"
    cards:
      - title: "Only Ana"
        body: "One person can run it"
      - title: "Warm only"
        body: "Fails from a clean start"
      - title: "In order"
        body: "You must know the sequence"
      - title: "One box"
        body: "A step still done by hand"
    notes: >-
      Four smells that look connected and are not. Only one person can run it.
      It fails from a clean start. You have to know the sequence. Or one box is
      still done by hand.

  - component: numbered-steps
    title: "If You Are Behind"
    steps:
      - title: "Cut a box, not a corner"
        body: "Stub a whole step, keep the path whole"
      - title: "Shrink the input"
        body: "One page instead of the whole report"
      - title: "Never drop the commit"
        body: "A short path committed beats a long one lost"
    notes: >-
      If you are behind: cut a box rather than a corner, stubbing a whole step
      so the path stays whole. Shrink the input, one page instead of the whole
      report. And never drop the commit — a short path committed beats a long
      one lost.

  - component: bullet-list
    title: "Done Means All Four"
    items:
      - "One command, start to finish"
      - "Runs from an empty output dir"
      - "Someone else ran it"
      - "The output is the real thing"
    notes: >-
      Done means all four: one command start to finish, it runs from an empty
      output directory, someone else has run it, and the output is the real
      thing.

  - component: pull-quote
    quote: "If hands touch it, it is not connected."
    attribution: "Objective two, restated"
    notes: >-
      If hands touch it, it is not connected. That one small copy-paste does
      count.

  # ── 03 · Commit the Moment It Works ────────────────────────────────────────
  - component: section-divider
    number: "03"
    title: "Commit It Immediately"
    notes: >-
      Third objective, and it is a short one with an absolute rule: commit the
      moment it works.

  - component: definition
    term: "Works"
    definition: "It ran end to end, cold, in front of you"
    notes: >-
      Works means it ran end to end, from cold, in front of you. Not “should
      work”, not “worked earlier”.

  - component: bullet-list
    title: "Why Right Now"
    items:
      - "This is the version that works"
      - "The next change may break it"
      - "You will not remember what changed"
      - "A demo needs a known-good commit"
    notes: >-
      Why right now: this is the version that works, the next change may break
      it, you will not remember what you changed, and a demo needs a known-good
      commit.

  - component: numbered-steps
    title: "The Commit Ritual"
    steps:
      - title: "Stop typing"
        body: "Hands off the keyboard, it works"
      - title: "Commit and push"
        body: "Message says what now works"
      - title: "Then keep going"
        body: "Anything new lands on top of it"
    notes: >-
      Three steps, deliberately ceremonial. Stop typing — hands off the
      keyboard, it works. Commit and push, with a message saying what now works.
      Then keep going, and anything new lands on top of it.

  - component: code
    title: "Sixty seconds of insurance"
    code: |
      $ git add run.py steps/ fixtures/
      $ git commit -m "happy path runs cold"
      $ git push -u origin main
      $ git tag happy-path && git push --tags
    notes: >-
      Sixty seconds of insurance. Add the pipeline by explicit path, commit,
      push, and tag it — because the tag gives your demo a name to fall back to.

  - component: file-tree
    title: "What the repo looks like now"
    root: "happy-path/"
    entries:
      - name: "fixtures/"
        depth: 0
      - name: "report.pdf"
        depth: 1
      - name: "steps/"
        depth: 0
      - name: "extract.py"
        depth: 1
      - name: "render.py"
        depth: 1
      - name: "run.py"
        depth: 0
      - name: "README.md"
        depth: 0
    notes: >-
      The whole prototype, seven entries. If your repo is much bigger than this
      by 10:50, you built something other than the happy path.

  - component: bullet-list
    title: "What the Message Should Say"
    items:
      - "What input it accepts"
      - "What output it produces"
      - "What is still stubbed"
      - "Not how clever it is"
    notes: >-
      The message should say what input it accepts, what output it produces, and
      what is still stubbed. Not how clever it is.

  - component: two-panel-list
    title: "Before and After the Commit"
    left:
      title: "Before committing"
      items:
        - "Nothing else at all"
        - "No tidying, no renaming"
        - "No one more small fix"
    right:
      title: "After committing"
      items:
        - "Everything you want"
        - "Break it freely"
        - "You can always get back"
    accent_side: "right"
    notes: >-
      Before committing: nothing else at all, no tidying, no renaming, not one
      more small fix. After committing: everything you want, break it freely,
      you can always get back.

  - component: icon-text-rows
    title: "What the Commit Buys You"
    rows:
      - icon: "anchor"
        heading: "A place to stand"
        body: "Every later change can be undone to here"
      - icon: "users"
        heading: "A shared build"
        body: "Teammates start from what already works"
      - icon: "play"
        heading: "A safe demo"
        body: "A known-good tag if tomorrow goes wrong"
    notes: >-
      The commit buys you three things. A place to stand, since every later
      change can be undone to here. A shared build, so teammates start from what
      already works. And a safe demo — a known-good tag if tomorrow goes wrong.

  - component: bullet-list
    title: "Then, and Only Then"
    items:
      - "Add a second input"
      - "Handle the obvious failure"
      - "Make the output look right"
      - "Start on the demo wrapper"
    notes: >-
      Then, and only then: add a second input, handle the obvious failure, make
      the output look right, and start on the demo wrapper.

  - component: table-slide
    title: "Write This Down Now"
    headers: ["Question", "Your answer"]
    rows:
      - ["The frozen input", "…"]
      - ["The one command", "…"]
      - ["The known-good tag", "…"]
      - ["Still done by hand", "…"]
    notes: >-
      Four answers into the repo now: the frozen input, the one command, the
      known-good tag, and what is still done by hand.

  - component: bullet-list
    title: "Leaving This Session"
    items:
      - "One input, frozen in the repo"
      - "One command runs it all"
      - "It works from a cold start"
      - "It is committed and pushed"
    notes: >-
      You are leaving with one input frozen in the repo, one command that runs
      it all, a cold start that works, and all of it committed and pushed.

  - component: question
    question: "Could a stranger run it?"
    notes: >-
      One question to carry into the break: could a stranger run it? Right now
      the honest answer is usually no.

  - component: bullet-list
    title: "Next: Making It Demoable"
    items:
      - "A front end a stranger can drive"
      - "A public URL, not your laptop"
      - "A three-minute demo script"
      - "An honest list of what is faked"
    notes: >-
      Next session we put a front end on it that a stranger can drive, ship it
      to a public URL rather than your laptop, write a three-minute demo script,
      and list honestly what is faked.
