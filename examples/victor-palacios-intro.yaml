  - component: stat-callout
    title: "The Numbers From That Post"
    stats:
      - value: "838"
        label: "Score"
        subtext: "700 is a pass"
      - value: "32"
        label: "Hours"
        subtext: "Across one month"
      - value: "$0"
        label: "Spent"
        subtext: "Free materials only"
    notes: >-
      The numbers were a score of eight hundred and thirty-eight against a pass
