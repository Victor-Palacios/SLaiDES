  # ── 05 · Ninth Circuit ─────────────────────────────────────────────────────
  - component: section-divider
    number: "05"
    title: "Ninth Circuit"
    notes: >-
      Last, a project of my own that pulls all of this together: language,
      large-scale data, free tools, and something genuinely useful.

  - component: bullet-list
    title: "The Problem"
    items:
      - "Thousands of opinions a year"
      - "Only a fraction are asylum cases"
      - "Reading them all is impossible"
      - "So the research does not happen"
    notes: >-
      The Ninth Circuit publishes thousands of opinions a year, only a fraction
      of which concern asylum. Reading and coding them by hand is not something a
      person can do, so that research simply does not get done.

  - component: process-steps
    title: "How the Pipeline Works"
    steps:
      - label: "Fetch"
        body: "Scrape opinions"
      - label: "Classify"
        body: "Asylum or not?"
      - label: "Extract"
        body: "Pull the features"
    notes: >-
      The pipeline has three stages. It fetches opinions from the court, asks a
      model whether each one is an asylum case, and then extracts structured
      legal features from the ones that are.

  - component: stat-callout
    title: "What It Has Built"
    stats:
      - value: "5,779"
        label: "Opinions"
        subtext: "Growing daily"
      - value: "70+"
        label: "Features each"
        subtext: "With a source quote"
      - value: "26%"
        label: "Are asylum"
        subtext: "The rest filtered"
    notes: >-
      So far it holds five thousand seven hundred and seventy-nine opinions,
      extracts more than seventy structured features from each asylum case with a
      supporting quote for every one, and finds that about twenty-six percent of
      opinions qualify.

  - component: bullet-list
    title: "The Trick That Makes It Free"
    items:
      - "Classify cheaply before extracting"
      - "Throw away three quarters first"
      - "Roughly four times cheaper"
      - "Free-tier models throughout"
    notes: >-
      The trick is the order. A cheap classification pass throws away about three
      quarters of the opinions before the expensive extraction ever runs, which
      makes the whole thing roughly four times cheaper — and it runs on free-tier
      models throughout.

  - component: bullet-list
    title: "What It Runs On"
    items:
      - "Llama 3.3 on a free API tier"
      - "Postgres, and a vector index"
      - "A daily scheduled job"
      - "Total ongoing cost: nothing"
    notes: >-
      It runs on Llama three point three through a free API tier, a Postgres
      database with a vector index for search, and a scheduled job that runs
      daily. The ongoing cost is nothing.

  - component: bullet-list
    title: "Why It Matters"
    items:
      - "This work was always hand-coded"
      - "Now it is searchable"
      - "Every claim has its quote"
      - "Anyone can read the code"
    notes: >-
      It matters because this kind of asylum research has always been hand-coded
      by people with time and funding. This makes it searchable, keeps a quote
      behind every extracted claim, and the code is public for anyone to check.

  # ── Close ──────────────────────────────────────────────────────────────────
  - component: two-panel-list
    title: "What I Actually Believe"
    left:
      title: "Paths are not straight"
      items:
        - "I studied literature first"
        - "Nothing was wasted"
        - "The detour is the edge"
    right:
      title: "The tools are free"
      items:
        - "A certificate, for nothing"
        - "A legal database, free"
        - "The barrier is starting"
    accent_side: "right"
    notes: >-
      First, paths are not straight — I studied literature, none of it was
      wasted, and the detour turned into the thing that makes me useful. Second,
      the tools are genuinely free now, and the barrier is starting rather than
      paying.

  - component: bullet-list
    title: "If You Take One Action"
    items:
      - "Build one small thing publicly"
      - "Write down how you did it"
      - "Use the free tier for all of it"
      - "Then show someone"
    notes: >-
      If you do one thing after today, build something small in public, write
      down how you did it, do the whole thing on free tiers, and then show it to
      somebody.

  - component: question
    question: "What will you build?"
    notes: >-
      So that is my question back to you, and I would genuinely like to hear the
      answer. What will you build?
