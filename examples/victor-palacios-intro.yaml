slides:
  # ── Open ───────────────────────────────────────────────────────────────────
  - component: title-slide
    title: "Victor Palacios"
    subtitle: "Director of Data Science and AI Partnerships · USF"
    notes: >-
      I am Victor Palacios, and I direct data science and AI partnerships at the
      University of San Francisco.

  - component: question
    question: "How do you end up here?"
    notes: >-
      That is the question I actually want to answer today, because the route I
      took looks nothing like a plan.

  - component: timeline
    title: "Still Collecting Degrees"
    events:
      - date: "2011"
        title: "Berkeley"
        description: "BA in Japanese language and literature"
      - date: "2015"
        title: "Nagoya"
        description: "MS in Information Science, in Japan"
      - date: "2021"
        title: "USF"
        description: "MS in Data Science"
      - date: "2026"
        title: "Quantic"
        description: "MS in Software Eng, under way"
    notes: >-
      Four degrees in four fields: Japanese literature at Berkeley, information
      science at Nagoya, data science here at USF, and a software engineering
      master's I am part-way through right now.

  - component: agenda
    title: "What I Will Cover"
    items:
      - "Research, from brains to health"
      - "The path, and its detours"
      - "Writing things down in public"
      - "Partnerships, and one big repo"
    notes: >-
      Four things: the research I have worked on, the path that connects it, the
      writing I publish along the way, and the partnerships and projects I run
      now.

  # ── 01 · Research ──────────────────────────────────────────────────────────
  - component: section-divider
    number: "01"
    title: "Research"
    notes: >-
      I will start with research, because it is the oldest thread and it runs
      from cognitive neuroscience through healthcare to legal and clinical text.

  - component: definition
    term: "Deception detection"
    definition: "Finding what the brain does when someone lies"
    notes: >-
      My first research area was deception detection: measuring what the brain
      does differently when a person is lying.

  - component: bullet-list
    title: "Nagoya, 2014"
    items:
      - "Are action lies unlike speech lies?"
      - "Measured with near-infrared light"
      - "Forty sentences, three sessions"
      - "Published at JCSS in Japan"
    notes: >-
      At Nagoya in 2014 I asked whether lying about something you did is
      different, in the brain, from lying about something you said. We measured
      it with near-infrared spectroscopy across three sessions.

  - component: numbered-steps
    title: "How the Study Ran"
    steps:
      - title: "Learning"
        body: "You gesture or speak twenty sentences"
      - title: "Recognition"
        body: "You recall which ones you did which way"
      - title: "Lying"
        body: "You lie about twenty, tell the truth about twenty"
    notes: >-
      Participants first gestured or spoke twenty sentences each, then recalled
      which they had done which way, then lied about half of them and told the
      truth about the other half.

  - component: pull-quote
    quote: "Different lies, different regions."
    attribution: "Palacios, Saito et al., JCSS 2014"
    notes: >-
      The result was that the right superior frontal gyrus lit up uniquely for
      action lies, which says that different kinds of lie recruit different parts
      of the brain rather than one shared lying circuit.

  - component: bullet-list
    title: "Then Healthcare, 2021"
    items:
      - "A sensor reads blood sugar all day"
      - "Can it tell when you ate?"
      - "Healthy participants, not patients"
      - "First author, with Woodbridge and Fry"
    notes: >-
      In 2021 I moved to healthcare, asking whether a continuous glucose monitor
      could tell when someone had eaten. It became my first first-author paper,
      with Diane Woodbridge and Jean Fry.

  - component: this-vs-that
    title: "What It Was Really For"
    left:
      value: "Asked"
      label: "Did you eat when told?"
    right:
      value: "Measured"
      label: "The sensor knew"
    notes: >-
      The clever part is what it was for. Instead of asking participants whether
      they had followed the study protocol, the sensor data could tell us — an
      objective measure of compliance.

  - component: stat-callout
    title: "The Number That Mattered"
    stats:
      - value: "60%"
        label: "Baseline"
        subtext: "Where we started"
      - value: "89%"
        label: "After the work"
        subtext: "Same data, better target"
    notes: >-
      I defined meal consumption as the target variable, and that one decision
      took the model from sixty percent to eighty-nine percent on the same
      underlying data.

  - component: bullet-list
    title: "ICD-10 Coding, 2024"
    items:
      - "Clinical notes into diagnosis codes"
      - "Small open models, not large ones"
      - "Over 100,000 notes from MIMIC-IV"
      - "Swiss and USF collaboration"
    notes: >-
      The most recent work benchmarks pretrained language models for turning
      clinical notes into ICD-10 diagnosis codes, using over a hundred thousand
      notes from MIMIC-IV, with collaborators in Switzerland.

  - component: table-slide
    title: "What We Benchmarked"
    headers: ["Model", "Size"]
    rows:
      - ["Falcon", "1B parameters"]
      - ["Phi-3.5", "3.5B parameters"]
      - ["Meditron", "7B parameters"]
    notes: >-
      We tested three models between one and seven billion parameters: Falcon,
      Phi three point five, and Meditron, which is the one actually trained on
      medical text.

  - component: bullet-list
    title: "What Surprised Us"
    items:
      - "The 1B model held its own"
      - "It was not a medical model"
      - "LoRA kept quality, cut compute"
      - "Small can be good enough"
    notes: >-
      The surprise was that Falcon at one billion parameters, which is not a
      medical model at all, achieved results we did not expect — and
      parameter-efficient fine-tuning kept that quality while cutting the compute
      right down.

  - component: table-slide
    title: "Three Papers, One Habit"
    headers: ["Year", "Question"]
    rows:
      - ["2014", "What does a lie look like?"]
      - ["2021", "Did you really eat?"]
      - ["2024", "Can a small model code?"]
    notes: >-
      Lying, eating, and medical coding look unrelated, and in a sense they are.
      What connects them is that each one takes a messy human signal and asks
      what a machine can honestly read out of it.

  # ── 02 · The Path ──────────────────────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "The Path"
    notes: >-
      Now the part I think is more useful to you than any of the research: how
      someone gets from a literature degree to this job.

  - component: this-vs-that
    title: "Where I Started"
    left:
      value: "Japanese"
      label: "Language, literature"
    right:
      value: "Now"
      label: "Data science and AI"
    notes: >-
      I started in Japanese language and literature, and I now work in data
      science and artificial intelligence. Nothing about the first was wasted on
      the way to the second.

  - component: bullet-list
    title: "What Japan Taught Me"
    items:
      - "Language is structured data"
      - "Research is mostly patience"
      - "Being the outsider is normal"
      - "Fluency takes years, not weeks"
    notes: >-
      Four things I took from Japan. Language turns out to be structured data.
      Research is mostly patience. Being the person who does not yet understand
      is a normal working state. And real fluency in anything takes years.

  - component: bullet-list
    title: "Industry, in Between"
    items:
      - "Halo Solutions, working with the CEO"
      - "Found overdue patients in 10,000 PDFs"
      - "KNIME, teaching six courses"
      - "Fraud detection, to a big audience"
    notes: >-
      Between degrees I worked at Halo Solutions directly with the CEO, building
      a pipeline that pulled overdue patients out of more than ten thousand PDFs,
      and at KNIME, where I led six data science courses and presented on fraud
      detection.

  - component: stat-callout
    title: "Two Numbers From Industry"
    stats:
      - value: "$13M"
        label: "Revenue identified"
        subtext: "Overdue patients found"
      - value: "90k"
        label: "Subscriber audience"
        subtext: "For the fraud talk"
    notes: >-
      Two numbers from that period: the overdue-patient work represented up to
      thirteen million dollars in recoverable revenue, and the fraud detection
      session went out to an audience of ninety thousand subscribers.

  - component: bullet-list
    title: "What I Do Now"
    items:
      - "Match students to practicum teams"
      - "Mentor those teams for nine months"
      - "Teach the SQL certificate course"
      - "Career advising, all year"
    notes: >-
      Today I match students with practicum teams, mentor those teams for nine
      months, teach the professional certificate course in SQL, and do career
      advising all year round.

  - component: bullet-list
    title: "Still a Student Myself"
    items:
      - "A software engineering master's"
      - "Started October 2025"
      - "While doing this job"
      - "The learning does not stop"
    notes: >-
      I should say that I am still a student myself. I started a software
      engineering master's in October last year and I am doing it alongside this
      job, because the learning genuinely does not stop.

  # ── 03 · In Public ─────────────────────────────────────────────────────────
  - component: section-divider
