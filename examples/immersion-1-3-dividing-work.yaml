# Immersion Week SF · Day 1 · Session 1.3
# "Dividing the Work Across the Team" (11:00–11:50, 50 min)
# Source: https://github.com/UChiCareersinAI/ImmersionWeekSF
#
# Objectives (verbatim from the syllabus):
#   1. Inventory the team's actual skills and assign every workflow step a
#      single owner
#   2. Use Claude Cowork to run several workstreams in parallel without the team
#      stepping on each other
#   3. Put the task board in GitHub — a repo, issues with owners, and a
#      definition of done for every Day 2 task
#
# No palette block: this deck rides the slidekit default colour scheme.
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  # ── Open ───────────────────────────────────────────────────────────────────
  - component: title-slide
    title: "Dividing the Work"
    subtitle: "Immersion Week SF · Day 1 · Session 1.3"
    notes: >-
      This is session 1.3, Dividing the Work. You have a problem and a map; this
      hour turns that map into assignments so four people can start building at
      once tomorrow.

  - component: big-number
    value: "50"
    label: "Minutes"
    context: "You leave with a board and owners"
    notes: >-
      Fifty minutes, and you leave with a board in GitHub where every Day 2 task
      has an owner and a definition of done.

  - component: agenda
    title: "What This Session Covers"
    items:
      - "Inventory the team's real skills"
      - "Give every step a single owner"
      - "Run workstreams with Cowork"
      - "Put the board in GitHub"
    notes: >-
      Four things this hour. We inventory the team's real skills, give every
      step a single owner, run workstreams in parallel with Cowork, and put the
      board in GitHub.

  - component: question
    question: "Who owns which box?"
    notes: >-
      Looking at your diagram from last hour: who owns which box? Most teams
      have never assigned one.

  - component: this-vs-that
    title: "From 1.2 to Now"
    left:
      value: "A map"
      label: "The path, drawn"
    right:
      value: "A board"
      label: "The path, assigned"
    notes: >-
      Last hour you drew the path. This hour you assign it. A map tells you what
      must happen; a board tells you who is doing it.

  - component: process-steps
    title: "How We Get There"
    steps:
      - label: "Skills"
        body: "What can we each do"
      - label: "Own"
        body: "One name per step"
      - label: "Split"
        body: "Run them in parallel"
      - label: "Board"
        body: "Issues in GitHub"
    notes: >-
      Four moves: inventory your skills, give every step one owner, split the
      work so streams run in parallel, and put it all on a board as GitHub
      issues.

  # ── 01 · Skills and ownership ──────────────────────────────────────────────
  - component: section-divider
    number: "01"
    title: "Owners, Not Volunteers"
    notes: >-
      First objective: owners rather than volunteers, and exactly one owner per
      step.

  - component: definition
    term: "Skills inventory"
    definition: "An honest list of what each person can do unaided."
    notes: >-
      A skills inventory is an honest list of what each person on the team can
      do unaided.

  - component: bullet-list
    title: "What Counts as a Skill"
    items:
      - "Something you have shipped before"
      - "A tool you already have access to"
      - "A domain you actually know"
    notes: >-
      Three things count as a skill: something you have shipped before, a tool
      you already have access to, and a domain you actually know.

  - component: bullet-list
    title: "Say the Quiet Part"
    items:
      - "What you have never done"
      - "What you would need help with"
      - "What you would rather not own"
    notes: >-
      Say the quiet part too — what you have never done, what you would need
      help with, and what you would rather not own.

  - component: table-slide
    title: "Skill to Step"
    headers: ["Skill", "Steps it fits"]
    rows:
      - ["Data wrangling", "Intake, parse"]
      - ["Prompt design", "Score, summarise"]
      - ["Front end", "Report, demo"]
      - ["Domain expert", "Judging quality"]
    notes: >-
      Here is skill mapped to step. Data wrangling fits intake and parse. Prompt
      design fits score and summarise. Front end fits report and demo. And a
      domain expert judges quality.

  - component: definition
    term: "Single owner"
    definition: "One named person accountable for a step being done."
    notes: >-
      A single owner is one named person accountable for a step being done.

  - component: two-panel-list
    title: "Why Exactly One"
    accent_side: right
    left:
      title: "Shared"
      items:
        - "Everyone assumes cover"
        - "Nobody watches the clock"
        - "Slips found late"
    right:
      title: "Single"
      items:
        - "One person tracking"
        - "One person to ask"
        - "Slips found early"
    notes: >-
      Shared ownership means everyone assumes someone else has cover, nobody
      watches the clock, and slips get found late. A single owner means one
      person tracking it, one person to ask, and slips found early.

  - component: numbered-steps
    title: "Assign Every Step"
    steps:
      - title: "Riskiest first"
        body: "It gets the best fit"
      - title: "Then the rest"
        body: "Match skill to step"
      - title: "Name the gaps"
        body: "Steps nobody can own"
    notes: >-
      Assign in three passes. Riskiest step first, and it gets the best fit.
      Then the rest, matching skill to step. Then name the gaps — the steps
      nobody can own.

  - component: comparison-columns
    title: "Volunteer or Best Fit"
    left_title: "Volunteer"
    right_title: "Best fit"
    left_items:
      - text: "Picks what excites them"
      - text: "Learns on your deadline"
      - text: "Risky step goes last"
    right_items:
      - text: "Picks what they can ship"
      - text: "Learns on the safe step"
      - text: "Risky step goes first"
    notes: >-
      Volunteers pick what excites them, learn on your deadline, and leave the
      risky step until last. Best fit picks what they can ship, learns on the
      safe step, and takes the risky step first.

  - component: bullet-list
    title: "When Nobody Can Own a Step"
    items:
      - "Stub it and move on"
      - "Buy it with an existing tool"
      - "Cut it from the happy path"
    notes: >-
      When nobody can own a step, you have three options: stub it and move on,
      buy it with an existing tool, or cut it from the happy path.

  - component: pull-quote
    quote: "One name per box, or no name at all."
    attribution: "The rule that survives Day 2"
    notes: >-
      One name per box, or no name at all. That is the rule that survives Day 2.

  - component: card-grid
    title: "Roles Beyond Writing Code"
    cards:
      - icon: "users"
        title: "Owner"
        body: "Holds the problem"
      - icon: "check"
        title: "Tester"
        body: "Breaks it on purpose"
      - icon: "doc"
        title: "Scribe"
        body: "Keeps the Project current"
      - icon: "star"
        title: "Demo"
        body: "Tells the story Friday"
    notes: >-
      Four roles beyond writing code. The owner holds the problem. The tester
      breaks it on purpose. The scribe keeps the Project current. And the demo
      person tells the story on Friday.

  # ── 02 · Parallel work with Cowork ─────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "Work in Parallel"
    notes: >-
      Second objective: running several workstreams at once without stepping on
      each other.

  - component: definition
    term: "Claude Cowork"
    definition: "Claude running multi-step work on files you choose."
    notes: >-
      Claude Cowork is Claude running multi-step work on files you choose.

  - component: two-panel-list
    title: "Queue or Parallel"
    accent_side: right
    left:
      title: "Queue"
      items:
        - "One step at a time"
        - "Everyone waits on one"
        - "Day 2 runs out"
    right:
      title: "Parallel"
      items:
        - "Streams run at once"
        - "Waiting is designed out"
        - "Day 2 finishes"
    notes: >-
      Queued work means one step at a time, everyone waiting on one person, and
      Day 2 running out. Parallel means streams run at once, waiting is designed
      out, and Day 2 finishes.

  - component: icon-text-rows
    title: "What Cowork Runs"
    rows:
      - icon: "file"
        heading: "On your files"
        body: "Reads and edits what you pick"
      - icon: "loop"
        heading: "Multi-step"
        body: "Finishes a task, not a reply"
      - icon: "users"
        heading: "Alongside you"
        body: "You work while it works"
    notes: >-
      Cowork runs on your files, reading and editing what you pick. It is multi-
      step, so it finishes a task rather than a reply. And it runs alongside you
      — you work while it works.

  - component: numbered-steps
    title: "Set Up a Workstream"
    steps:
      - title: "One step only"
        body: "Scope it to a single box"
      - title: "Give the contract"
        body: "Its input and output"
      - title: "Say done"
        body: "How it proves it worked"
    notes: >-
      Three things in every workstream. Scope it to one step only, a single box.
      Give it the contract, its input and its output. And say what done means,
      so it can prove it worked.

  - component: code
    title: "A Workstream Brief"
    chrome: true
    code: |
      Step: Parse resumes to text

      Input:  PDF files in /intake
      Output: one JSON per file
              {name, skills[], years}

      Done when: 10 sample files
      parse with no manual fixes.
    notes: >-
      Here is a brief written out. The step is parsing resumes to text. Input is
      PDF files in intake, output is one JSON per file with name, skills and
      years. Done when ten sample files parse with no manual fixes.

  - component: definition
    term: "The contract"
    definition: "The agreed shape passed between two steps."
    notes: >-
      A contract is the agreed shape passed between two steps.

  - component: bullet-list
    title: "Agree Contracts First"
    items:
      - "Name every field you pass"
      - "Decide it before building"
      - "Write it on the diagram"
    notes: >-
      Agree contracts first: name every field you pass, decide it before
      building, and write it on the diagram.

  - component: table-slide
    title: "Step to Contract"
    headers: ["Handoff", "What passes"]
    rows:
      - ["Intake to parse", "File path plus id"]
      - ["Parse to score", "JSON with skills"]
      - ["Score to report", "Id plus a number"]
    notes: >-
      Here are the contracts for the worked example. Intake to parse passes a
      file path plus an id. Parse to score passes JSON with skills. Score to
      report passes an id plus a number.

  - component: bullet-list
    title: "How Streams Collide"
    items:
      - "Two people edit one file"
      - "A contract changed silently"
      - "One stream waits on another"
    notes: >-
      Streams collide in three ways: two people editing one file, a contract
      changed silently, or one stream simply waiting on another.

  - component: bullet-list
    title: "Keeping Streams Apart"
    items:
      - "One owner per file or folder"
      - "Change contracts by announcement"
      - "Stub what you are waiting on"
    notes: >-
      Keep them apart with one owner per file or folder, contract changes made
      by announcement, and a stub for whatever you are waiting on.

  # ── 03 · The GitHub board ──────────────────────────────────────────────────
  - component: section-divider
    number: "03"
    title: "Put It in GitHub"
    notes: >-
      Third objective: getting the board out of your heads and into GitHub.

  - component: icon-text-rows
    title: "Three Things You Need"
    rows:
      - icon: "doc"
        heading: "A repo"
        body: "One place the code lives"
      - icon: "check"
        heading: "Issues"
        body: "One per task, with an owner"
      - icon: "target"
        heading: "Done"
        body: "How each task proves itself"
    notes: >-
      Three things you need. A repo, one place the code lives. Issues, one per
      task with an owner. And done, meaning how each task proves itself.

  - component: numbered-steps
    title: "Stand It Up Now"
    steps:
      - title: "Create the repo"
        body: "Name it for the problem"
      - title: "Add everyone"
        body: "Write access, today"
      - title: "One issue per step"
        body: "Straight from the map"
    notes: >-
      Three steps, now. Create the repo and name it for the problem. Add
      everyone with write access today. Then one issue per step, straight off
      the map.

  - component: code
    title: "An Issue, Filled In"
    chrome: false
    code: |
      Title: Parse resumes to text

      Owner:  @teammate
      Input:  PDF files in /intake
      Output: one JSON per file

      Done when: 10 samples parse
      with no manual fixes.
    notes: >-
      Here is an issue filled in. Title, owner, input, output, and done when ten
      samples parse with no manual fixes. It is the workstream brief, in GitHub.

  - component: definition
    term: "Definition of done"
    definition: "A check someone else can run to confirm it works."
    notes: >-
      A definition of done is a check someone else can run to confirm it works.

  - component: bullet-list
    title: "A Good Definition of Done"
    items:
      - "Observable, not felt"
      - "Checkable in a minute"
      - "Written before the work"
    notes: >-
      A good one is observable rather than felt, checkable in about a minute,
      and written before the work starts.

  - component: table-slide
    title: "Task to Done"
    headers: ["Task", "Done when"]
    rows:
      - ["Parse files", "10 samples, no fixes"]
      - ["Score match", "Ranks a known set right"]
      - ["Build report", "One click, no errors"]
    notes: >-
      Task on the left, done on the right. Parse files: ten samples, no fixes.
      Score match: ranks a known set correctly. Build report: one click, no
      errors.

  - component: bullet-list
    title: "Issue Hygiene"
    items:
      - "One task, one issue"
      - "Close it the moment it is done"
      - "Comment when you are blocked"
    notes: >-
      Three habits: one task per issue, close it the moment it is done, and
      comment when you are blocked.

  - component: comparison-matrix
    title: "Is This Task Ready?"
    options: ["Parse", "Score", "Deploy"]
    criteria: ["Has owner", "Has contract", "Has done"]
    cells:
      - ["Yes", "Yes", "Yes"]
      - ["Yes", "Yes", "No"]
      - ["No", "No", "No"]
    highlights:
      - [0, 0]
    notes: >-
      Three tasks against three criteria. Parse has an owner, a contract and a
      definition of done, so it is ready. Score has no done. Deploy has none of
      the three.

  - component: bullet-list
    title: "Ready for Tomorrow When"
    items:
      - "Every step is an issue"
      - "Every issue has one owner"
      - "Every issue says done"
      - "Contracts are written down"
    notes: >-
      You are ready for tomorrow when every step is an issue, every issue has
      one owner, every issue says what done means, and the contracts are written
      down.

  # ── Close ──────────────────────────────────────────────────────────────────
  - component: stat-callout
    title: "What You Leave With"
    stats:
      - value: "1"
        label: "Repo and board"
      - value: "1"
        label: "Owner per step"
      - value: "0"
        label: "Unowned tasks"
    notes: >-
      You leave with one repo and board, one owner per step, and zero unowned
      tasks.

  - component: bullet-list
    title: "Day 1, Behind You"
    items:
      - "A precise problem statement"
      - "A workflow map, shared"
      - "A board with owners"
    notes: >-
      That is Day 1 behind you: a precise problem statement, a workflow map that
      is shared, and a board with owners.

  - component: bullet-list
    title: "Next: Choosing the Stack"
    items:
      - "Match each step to a tool"
      - "Decide what to stub"
      - "Pick retrieval only if needed"
    notes: >-
      Tomorrow we match each step to a tool, decide what to stub, and pick
      retrieval only if you actually need it.

  - component: question
    question: "Can you start unaided?"
    notes: >-
      One question before you go: can you start unaided tomorrow morning? If
      not, find the box that is stopping you.
