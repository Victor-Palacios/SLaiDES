# Immersion Week SF · Day 2 · Session 2.1
# "Choosing Your Low-Code Stack" (9:20–9:55, 35 min)
# Source: https://github.com/UChiCareersinAI/ImmersionWeekSF
#
# Objectives (verbatim from the syllabus):
#   1. Match each step of yesterday's workflow map to a specific tool, and decide
#      deliberately what to stub and what to build
#   2. Tell the difference between needing RAG and just needing context in the
#      window — then pick the cheaper one that works
#   3. Stand up the smallest retrieval layer that answers your prototype's
#      questions, with a Claude Project as the baseline to beat
#
# No palette block: this deck rides the slidekit default colour scheme.
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  # ── Open ───────────────────────────────────────────────────────────────────
  - component: title-slide
    title: "Choosing the Stack"
    subtitle: "Immersion Week SF · Day 2 · Session 2.1"
    notes: >-
      This is session 2.1, Choosing the Stack. Day 2 opens, and this is the
      first session where we name real tools.

  - component: big-number
    value: "35"
    label: "Minutes"
    context: "You leave with a tool per step"
    notes: >-
      Thirty-five minutes, and you leave with a named tool beside every box on
      your map.

  - component: agenda
    title: "What This Session Covers"
    items:
      - "Give every step a named tool"
      - "Decide what to stub, not build"
      - "RAG or just more context"
      - "Stand up the smallest layer"
    notes: >-
      Four things this session. We give every step a named tool, decide what to
      stub rather than build, work out whether you need RAG or just more
      context, and stand up the smallest retrieval layer.

  - component: question
    question: "What will you not build?"
    notes: >-
      Before we name a single tool: what will you not build? You arrive knowing
      what you want to build, and almost nobody has decided what to refuse.

  - component: this-vs-that
    title: "From 1.3 to Now"
    left:
      value: "A board"
      label: "Who does each step"
    right:
      value: "A stack"
      label: "What each step runs on"
    notes: >-
      Yesterday ended with a board saying who does each step. A board is not
      enough — an owner still cannot start without knowing what their step runs
      on.

  - component: process-steps
    title: "How We Get There"
    steps:
      - label: "Map"
        body: "Reopen yesterday's diagram"
      - label: "Tool"
        body: "Name one per step"
      - label: "Stub"
        body: "Mark what stays fake"
      - label: "Retrieve"
        body: "Only if you must"
    notes: >-
      Four moves: reopen yesterday's diagram, name one tool per step, mark what
      stays fake, and reach for retrieval only if you must.

  - component: pull-quote
    quote: "Boring tools, interesting problem."
    attribution: "The Day 2 rule"
    notes: >-
      Boring tools, interesting problem. Your novelty budget was spent on the
      problem you chose yesterday.

  # ── 01 · A Tool for Every Step ─────────────────────────────────────────────
  - component: section-divider
    number: "01"
    title: "A Tool for Every Step"
    notes: >-
      First objective: a named tool for every step on the map.

  - component: definition
    term: "Low-code"
    definition: "Assembling built pieces instead of writing them"
    notes: >-
      Low-code means assembling pieces that are already built instead of writing
      them yourself.

  - component: bullet-list
    title: "The Rule for This Hour"
    items:
      - "Every box gets one tool name"
      - "No box may stay undecided"
      - "\"We fake it\" counts as decided"
      - "Write it on the board now"
    notes: >-
      The rule for this hour: every box gets one tool name, no box may stay
      undecided, “we fake it” counts as decided, and you write it on the board
      now.

  - component: bullet-list
    title: "Where the Tool Names Come From"
    items:
      - "What your team already uses"
      - "What the workshop hands you"
      - "What has a free tier today"
      - "Not what you meant to learn"
    notes: >-
      Tool names come from what your team already uses, what the workshop hands
      you, and what has a free tier today. Not from what you meant to learn this
      week.

  - component: card-grid
    title: "The Four Jobs"
    cards:
      - title: "Intake"
        body: "Getting the input in"
      - title: "Think"
        body: "The model doing the work"
      - title: "Store"
        body: "Anything you look up later"
      - title: "Show"
        body: "What the user actually sees"
    notes: >-
      Almost every prototype reduces to four jobs. Intake, getting the input in.
      Think, the model doing the work. Store, anything you look up later. And
      show, what the user actually sees.

  - component: table-slide
    title: "A Worked Mapping"
    headers: ["Step", "Tool"]
    rows:
      - ["Collect the input", "A form or a paste box"]
      - ["Understand it", "Claude, one prompt"]
      - ["Look something up", "Claude Project files"]
      - ["Produce the output", "Claude Artifact"]
      - ["Show a stranger", "A hosted page"]
    notes: >-
      Here is a worked mapping. Collect the input with a form or a paste box.
      Understand it with one Claude prompt. Look things up in Claude Project
      files. Produce the output as an Artifact. And show a stranger with a
      hosted page.

  - component: bullet-list
    title: "Signs You Picked Wrong"
    items:
      - "Nobody on the team has used it"
      - "Setup is measured in hours"
      - "It needs a key you don't have"
      - "The docs assume production"
    notes: >-
      Four signs you picked wrong: nobody on the team has used it, setup is
      measured in hours, it needs a key you do not have, or the docs assume you
      are running in production.

  - component: two-panel-list
    title: "Build or Stub"
    left:
      title: "Build it"
      items:
        - "It is the thing you claim"
        - "The demo touches it live"
        - "Nobody believes it faked"
    right:
      title: "Stub it"
      items:
        - "It is plumbing, not proof"
        - "The demo never opens it"
        - "It works but is boring"
    accent_side: "left"
    notes: >-
      Build it when it is the thing you claim, when the demo touches it live,
      and when nobody would believe it faked. Stub it when it is plumbing rather
      than proof, when the demo never opens it, and when it works but is boring.

  - component: definition
    term: "Stub"
    definition: "A fake that is honest about being fake"
    notes: >-
      A stub is a fake that is honest about being fake.

  - component: numbered-steps
    title: "How to Decide, Per Box"
    steps:
      - title: "Ask what it proves"
        body: "If nothing, it is plumbing"
      - title: "Ask who sees it"
        body: "If nobody, stub it"
      - title: "Ask what it costs"
        body: "Over an hour needs a reason"
    notes: >-
      Three questions per box. What does it prove — if nothing, it is plumbing.
      Who sees it — if nobody, stub it. What does it cost — anything over an
      hour needs a reason.

  - component: bullet-list
    title: "Always Safe to Stub"
    items:
      - "Login and user accounts"
      - "Payments of any kind"
      - "Email and notifications"
      - "Anything with a real database"
    notes: >-
      Four things always safe to stub: login and user accounts, payments of any
      kind, email and notifications, and anything needing a real database.

  - component: bullet-list
    title: "Never Safe to Stub"
    items:
      - "The step your idea rests on"
      - "Whatever you claim is novel"
      - "The output a stranger reads"
      - "The path the demo walks"
    notes: >-
      Four things never safe to stub: the step your idea rests on, whatever you
      claim is novel, the output a stranger reads, and the path the demo walks.

  - component: icon-text-rows
    title: "Three Tests Before You Commit"
    rows:
      - icon: "clock"
        heading: "Under an hour"
        body: "You can have it running before lunch"
      - icon: "check"
        heading: "Someone knows it"
        body: "One person on the team has shipped with it"
      - icon: "shield"
        heading: "Fails quietly"
        body: "When it breaks, the demo still walks"
    notes: >-
      Three tests before you commit to a tool. Under an hour, so you can have it
      running before lunch. Someone knows it, meaning one person has shipped
      with it. And it fails quietly, so when it breaks the demo still walks.

  - component: comparison-matrix
    title: "Picking Between Two Options"
    options: ["Familiar tool", "Better tool"]
    criteria: ["Setup", "Ceiling", "Demo risk"]
    cells:
      - ["Minutes", "Half a day"]
      - ["Low", "High"]
      - ["Low", "Unknown"]
    highlights: [[0, 0], [2, 0]]
    notes: >-
      The familiar tool sets up in minutes with low demo risk; the better tool
      takes half a day and carries unknown risk. The better tool only wins on
      ceiling, and ceiling does not pay out in two days.

  - component: stat-callout
    title: "Where the Time Actually Goes"
    stats:
      - value: "80%"
        label: "Wiring things together"
        subtext: "Not the clever part"
      - value: "20%"
        label: "The idea itself"
        subtext: "What you are judged on"
    notes: >-
      Roughly eighty percent of your time goes on wiring things together and
      twenty percent on the idea itself — and the idea is what you are judged
      on. Those figures are illustrative rather than measured.

  # ── 02 · RAG or Just Context ───────────────────────────────────────────────
  - component: section-divider
    number: "02"
    title: "RAG or Just Context"
    notes: >-
      Second objective: telling the difference between needing RAG and just
      needing more context in the window.

  - component: definition
    term: "RAG"
    definition: "Fetch the few relevant bits, then ask"
    notes: >-
      RAG means fetching the few relevant bits first, then asking. It is a
      search step bolted in front of a prompt.

  - component: question
    question: "Does it all fit already?"
    notes: >-
      Before any architecture discussion: does it all fit already? For most of
      you in this room the honest answer is yes.

  - component: this-vs-that
    title: "Two Ways to Give Context"
    left:
      value: "Paste it"
      label: "Everything, every time"
    right:
      value: "Fetch it"
      label: "Only what is relevant"
    notes: >-
      Two ways to give context. Paste it, meaning everything every time. Or
      fetch it, meaning only what is relevant.

  - component: bullet-list
    title: "What a Context Window Holds"
    items:
      - "A long policy document"
      - "A few hundred support tickets"
      - "A codebase of modest size"
      - "More than you probably have"
    notes: >-
      A context window today holds a long policy document, a few hundred support
      tickets, or a codebase of modest size. That is almost certainly more than
      you have.

  - component: numbered-steps
    title: "The Decision, in Order"
    steps:
      - title: "Measure the corpus"
        body: "Actual size, not your guess"
      - title: "Try pasting it"
        body: "If it fits, you are done"
      - title: "Only then, retrieve"
        body: "And keep it as small as you can"
    notes: >-
      The decision has an order. Measure the corpus — its actual size, not your
      guess. Try pasting it, and if it fits you are done. Only then retrieve,
      and keep it as small as you can.

  - component: two-panel-list
    title: "Which One Do You Need"
    left:
      title: "Just context"
      items:
        - "It fits in one window"
        - "The corpus barely changes"
        - "Every question sees it all"
    right:
      title: "Real retrieval"
      items:
        - "Far more than fits"
        - "It changes constantly"
        - "Questions need a slice"
    accent_side: "right"
    notes: >-
      You need just context when it fits in one window, the corpus barely
      changes, and every question sees all of it. You need real retrieval when
      there is far more than fits, it changes constantly, and questions need a
      slice.

  - component: table-slide
    title: "What Each One Costs You"
    headers: ["", "Paste it", "Retrieve it"]
    rows:
      - ["Build time", "Zero", "Hours"]
      - ["Per question", "More tokens", "Fewer tokens"]
      - ["Breaks when", "Corpus grows", "Search misses"]
      - ["Debuggable", "Easily", "Less easily"]
    notes: >-
      Here is what each costs. Pasting is zero build time but more tokens per
      question, and it breaks when the corpus grows. Retrieval costs hours to
      build, uses fewer tokens, breaks when search misses, and is harder to
      debug.

  - component: bullet-list
    title: "The Costs Nobody Budgets"
    items:
      - "Chunking the documents well"
      - "Deciding how many to fetch"
      - "Debugging what it missed"
      - "Explaining it in the demo"
    notes: >-
      Four costs nobody budgets for: chunking the documents well, deciding how
      many to fetch, debugging what it missed, and explaining it in the demo.

  - component: code
    title: "Measure before you architect"
    code: |
      $ wc -w docs/*.md
        41,204 total

      # ~55k tokens. It fits.
      # No retrieval needed today.
    notes: >-
      Measure before you architect. One word count says forty-one thousand
      words, roughly fifty-five thousand tokens — it fits, so no retrieval is
      needed today.

  - component: bullet-list
    title: "You Are Over-Building If"
    items:
      - "You picked a vector database first"
      - "Your corpus is under 20 files"
      - "You cannot name a missed query"
      - "It is not tomorrow's demo step"
    notes: >-
      You are over-building if you picked a vector database first, your corpus
      is under twenty files, you cannot name a query that pasting misses, or it
      is not even tomorrow's demo step.

  - component: pull-quote
    quote: "The cheapest thing that works."
    attribution: "Objective two, in five words"
    notes: >-
      The cheapest thing that works. Both halves of that bind — cheapest is no
      excuse for not answering the question.

  # ── 03 · The Smallest Retrieval Layer ──────────────────────────────────────
  - component: section-divider
    number: "03"
    title: "The Smallest Layer"
    notes: >-
      Third objective: standing up the smallest retrieval layer that answers
      your questions.

  - component: definition
    term: "Claude Project"
    definition: "A workspace with your files always in context"
    notes: >-
      A Claude Project is a workspace with your files always in context.

  - component: bullet-list
    title: "Why It Is the Baseline"
    items:
      - "Standing it up takes minutes"
      - "No keys, no store, no code"
      - "Your files are simply there"
      - "Anyone can drive it"
    notes: >-
      It is the baseline because standing it up takes minutes, there are no
      keys, no store and no code, your files are simply there, and anyone on the
      team can drive it.

  - component: numbered-steps
    title: "Stand One Up"
    steps:
      - title: "Create the Project"
        body: "Name it after the problem"
      - title: "Add your documents"
        body: "The real ones, not samples"
      - title: "Write the instructions"
        body: "Say how to answer, and how not to"
    notes: >-
      Three steps. Create the Project and name it after the problem. Add your
      documents — the real ones, not samples. Then write the instructions,
      saying how to answer and how not to.

  - component: code
    title: "Project instructions worth writing"
    code: |
      Answer only from the attached files.
      Quote the filename you used.
      If the files do not cover it,
      say so plainly. Do not guess.
    notes: >-
      Four lines worth writing: answer only from the attached files, quote the
      filename you used, and if the files do not cover it say so plainly rather
      than guessing.

  - component: bullet-list
    title: "What Goes in the Project"
    items:
      - "The documents you must cite"
      - "One example of a good answer"
      - "Your glossary and odd terms"
      - "Nothing you would not ship"
    notes: >-
      Put in the documents you must cite, one example of a good answer, your
      glossary and odd terms — and nothing you would not be willing to ship.

  - component: table-slide
    title: "The Baseline to Beat"
    headers: ["Measure", "Your target"]
    rows:
      - ["Questions answered", "More than the Project"]
      - ["Wrong answers", "Fewer than the Project"]
      - ["Time to build", "Under one afternoon"]
      - ["Teammate can run it", "Yes"]
    notes: >-
      This is what beating the baseline means, concretely. More questions
      answered than the Project, fewer wrong answers, under one afternoon to
      build, and a teammate can still run it.

  - component: numbered-steps
    title: "How to Know You Beat It"
    steps:
      - title: "Write ten questions"
        body: "Real ones, before you build"
      - title: "Run both, same questions"
        body: "Project first, then yours"
      - title: "Count, do not vibe"
        body: "Keep whichever wins"
    notes: >-
      Three steps to find out. Write ten real questions before you build
      anything. Run both on the same questions, Project first. Then count rather
      than vibe, and keep whichever wins.

  - component: icon-text-rows
    title: "Three Layers, Cheapest First"
    rows:
      - icon: "doc"
        heading: "Paste it in"
        body: "Zero build; use it while the corpus is small"
      - icon: "folder"
        heading: "Claude Project"
        body: "Minutes to stand up; the baseline to beat"
      - icon: "search"
        heading: "Real retrieval"
        body: "Only once you can name what the others missed"
    notes: >-
      Three layers, cheapest first. Paste it in — zero build, fine while the
      corpus is small. A Claude Project — minutes to stand up, and the baseline
      to beat. Real retrieval — only once you can name what the others missed.

  - component: bullet-list
    title: "When to Graduate"
    items:
      - "The Project cannot hold it all"
      - "You can name what it missed"
      - "The corpus changes daily"
      - "You have the afternoon spare"
    notes: >-
      Graduate when all four are true: the Project cannot hold it all, you can
      name what it missed, the corpus changes daily, and you have the afternoon
      spare.

  - component: comparison-columns
    title: "Two Teams, Same Corpus"
    left_title: "Built retrieval"
    right_title: "Used a Project"
    left_items:
      - text: "Afternoon on chunking"
      - text: "Demo has a search step"
      - text: "Nobody else can run it"
    right_items:
      - text: "Twenty minutes total"
      - text: "Demo has an answer"
      - text: "Whole team can run it"
    notes: >-
      Two teams with the same corpus. One spent an afternoon on chunking, has a
      search step in the demo, and nobody else can run it. The other spent
      twenty minutes, has an answer in the demo, and the whole team can run it.

  - component: bullet-list
    title: "Leaving This Session"
    items:
      - "Every box has a tool name"
      - "Every box is build or stub"
      - "Retrieval decided, not deferred"
      - "The baseline is standing up"
    notes: >-
      You are leaving with every box having a tool name, every box marked build
      or stub, retrieval decided rather than deferred, and the baseline standing
      up.

  - component: table-slide
    title: "Write This Down Now"
    headers: ["Question", "Your answer"]
    rows:
      - ["Riskiest tool choice", "…"]
      - ["Biggest stub", "…"]
      - ["Retrieval: yes or no", "…"]
      - ["What proves it works", "…"]
    notes: >-
      Four answers to write into the repo now: your riskiest tool choice, your
      biggest stub, retrieval yes or no, and what would prove it works.

  - component: question
    question: "Can you start building?"
    notes: >-
      Last question: can you start building? If not, it is almost always an
      undecided box rather than a hard technical problem.

  - component: bullet-list
    title: "Next: Building the Happy Path"
    items:
      - "One known-good input, end to end"
      - "No edge cases, no error handling"
      - "Claude Code drives each step"
      - "Commit the moment it works"
    notes: >-
      Next session we take one known-good input end to end, with no edge cases
      and no error handling, driving each step with Claude Code — and commit the
      moment it works.
