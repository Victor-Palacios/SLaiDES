version: 1
theme:
  palette:
    primary: "#4A148C"
    surface: "#FFFFFF"
    accent: "#FF6F00"
    text: "#1A1A2E"
    muted: "#8A8A9A"
  font: arial
page_numbers:
  enabled: true
slides:
  - component: title-slide
    title: "Platform Comparison"
    subtitle: "Legacy System vs. Modern Stack"

  - component: comparison-columns
    title: "Side-by-Side Evaluation"
    left_title: "Legacy Platform"
    right_title: "Modern Stack"
    left_items:
      - text: "Deploy time: 4 hours"
      - text: "Manual scaling"
      - text: "Single failure point"
      - text: "On-premise; high cost"
    right_items:
      - text: "Deploy time: 8 min"
      - text: "Auto-scales fast"
      - text: "Isolated fault zones"
      - text: "Cloud-native; low cost"
