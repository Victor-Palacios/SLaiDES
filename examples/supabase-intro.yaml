# What Is Supabase? — an entry-level tour, grounded in real screenshots.
#
# Screenshots captured 2026-10-21 with headless Chromium, cropped to the
# 1290x1000 image slot, from these public pages:
#   assets/supabase/home.png ....... https://supabase.com/
#   assets/supabase/database.png ... https://supabase.com/database
#   assets/supabase/auth.png ....... https://supabase.com/auth
#   assets/supabase/sql-tab.png .... https://supabase.com/docs/guides/database/tables
#                                    (SQL tab: ?queryGroups=database-method&database-method=sql)
#   assets/supabase/mcp-setup.png .. https://supabase.com/docs/guides/getting-started/mcp
#   assets/supabase/rls.png ........ https://supabase.com/docs/guides/database/postgres/row-level-security
#   assets/supabase/pricing.png .... https://supabase.com/pricing
# Setup claims follow those docs and https://supabase.com/docs/guides/deployment/database-migrations
# ("Database migrations are SQL statements that create, update, or delete your
# existing database schemas"). The CREATE TABLE example follows the Tables guide.
#
# Three-colour rule: the default palette is already white, blue and ink.
# Screenshots are shown as captured. The deck ends on its last real step, never
# on a question (operator rule 2026-10-21).
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  - component: title-slide
    title: "What Is Supabase?"
    subtitle: "An entry-level tour, with real screenshots"
    notes: >-
      This is an entry-level tour of Supabase: what it is, how we set up a
      database in it with Claude, and how to keep that database safe.

  - component: question
    question: "Where does your data live?"
    notes: >-
      Every app that remembers anything — a login, a saved list, an uploaded
      photo — has to keep that information somewhere. That somewhere is what
      this deck is about.

  - component: definition
    term: "Backend"
    definition: "The part of an app you never see"
    notes: >-
      A backend is the part of an app you never see: the place where data is
      stored and the rules about who may touch it are enforced.

  - component: image-half-bleed
    title: "How Supabase Describes Itself"
    image_side: right
    image:
      type: image
      path: "examples/assets/supabase/home.png"
      fit: contain
      alt: "Screenshot of supabase.com, captured 2026-10-21"
    content:
      - type: text
        content: "It starts as a database"
      - type: text
        content: "Then adds what apps need"
      - type: text
        content: "All in one project"
    source: "https://supabase.com/"
    notes: >-
      This is Supabase's own homepage. It starts from a Postgres database and
      adds the other things an app needs, all inside one project.

  - component: table-slide
    title: "The Four Main Pieces"
    headers: ["Piece", "What it does"]
    rows:
      - ["Database", "Tables of your data"]
      - ["Auth", "Who is signed in"]
      - ["Storage", "Files people upload"]
      - ["API", "How your page asks"]
    notes: >-
      Four pieces matter to start with: a database holding tables of your data,
      auth for who is signed in, storage for files people upload, and an API that
      your web page uses to ask for any of it.

  - component: definition
    term: "Database"
    definition: "Organised tables your app can read and write"
    notes: >-
      A database is a set of organised tables that your app can read from and
      write to.

  - component: image-half-bleed
    title: "A Table, Concretely"
    image_side: right
    image:
      type: image
      path: "examples/assets/supabase/database.png"
      fit: contain
      alt: "Screenshot of the table editor on supabase.com/database, captured 2026-10-21"
    content:
      - type: text
        content: "Each row is one record"
      - type: text
        content: "Each column is a field"
      - type: text
        content: "A spreadsheet with rules"
    source: "https://supabase.com/database"
    notes: >-
      Here is a table in Supabase's own editor. Each row is one record, each
      column is one field such as a name or an email, and you can think of it as
      a spreadsheet that enforces rules.

  - component: image-half-bleed
    title: "Sign-In, Built In"
    image_side: right
    image:
      type: image
      path: "examples/assets/supabase/auth.png"
      fit: contain
      alt: "Screenshot of supabase.com/auth, captured 2026-10-21"
    content:
      - type: text
        content: "Email and password"
      - type: text
        content: "Google, GitHub, others"
      - type: text
        content: "No login code to write"
    source: "https://supabase.com/auth"
    notes: >-
      Sign-in comes built in. Email and password, or signing in with Google,
      GitHub and others, without you writing any login code yourself.

  - component: definition
    term: "SQL"
    definition: "The language for building and asking a database"
    notes: >-
      SQL is the language a database speaks. You use it to build tables and to
      ask questions of the data inside them.

  - component: image-half-bleed
    title: "Two Ways to Make a Table"
    image_side: right
    image:
      type: image
      path: "examples/assets/supabase/sql-tab.png"
      fit: contain
      alt: "Screenshot of the Supabase docs Tables guide with the SQL tab open, captured 2026-10-21"
    content:
      - type: text
        content: "Click in the Table Editor"
      - type: text
        content: "Or write it in SQL"
      - type: text
        content: "We will write SQL"
    source: "https://supabase.com/docs/guides/database/tables"
    notes: >-
      Supabase's own guide offers two ways to make a table: click through the
      Table Editor, or write it in SQL, which is the tab open here. We will write
      SQL.

  - component: bullet-list
    title: "Why We Use SQL"
    items:
      - "It is written down, so it repeats"
      - "It can live in git as a migration"
      - "Claude writes it, you review it"
      - "It reaches every Postgres type"
    notes: >-
      Clicks leave no record, but SQL is written down, so you can run it again
      on a fresh project. It can be saved in git as a migration, Claude can write
      it for you to review, and it can use every Postgres type, not just the
      ones the Table Editor offers.

  - component: code
    title: "A first table, in SQL"
    code: |
      create table notes (
        id bigint generated by default
          as identity primary key,
        body text not null,
        created_at timestamptz default now()
      );
      alter table notes
        enable row level security;
    notes: >-
      Here is a first table in SQL: a numbered id, the note itself, and the time
      it was made. The last two lines switch on row level security, which we come
      to in a moment.

  - component: image-half-bleed
    title: "Claude Can Build It"
    image_side: right
    image:
      type: image
      path: "examples/assets/supabase/mcp-setup.png"
      fit: contain
      alt: "Screenshot of the Supabase MCP server docs with Claude Code selected, captured 2026-10-21"
    content:
      - type: text
        content: "Supabase's MCP server"
      - type: text
        content: "Claude runs the SQL"
      - type: text
        content: "Approve each step first"
    source: "https://supabase.com/docs/guides/getting-started/mcp"
    notes: >-
      Supabase publishes an MCP server that connects Claude Code to your project,
      so Claude can write and run that SQL for you. Supabase's own advice is to
      keep manual approval on and review each step before it runs.

  - component: image-half-bleed
    title: "The Rule That Protects It"
    image_side: right
    image:
      type: image
      path: "examples/assets/supabase/rls.png"
      fit: contain
      alt: "Screenshot of the Row Level Security guide in the Supabase docs, captured 2026-10-21"
    content:
      - type: text
        content: "Turn on row level security"
      - type: text
        content: "Without it, data is open"
      - type: text
        content: "Supabase warns you itself"
    source: "https://supabase.com/docs/guides/database/postgres/row-level-security"
    notes: >-
      This is Supabase's own documentation, and the red box is its warning: a
      table without row level security can be read and written by anyone who can
      reach it. That is why our first table switched it on.

  - component: table-slide
    title: "Row Level Security, by Example"
    headers: ["Setting", "What a visitor gets"]
    rows:
      - ["Security off", "Every row, read and write"]
      - ["On, with no policy", "Nothing at all"]
      - ["On, owner policy", "Only their own rows"]
    notes: >-
      Three settings make it concrete. With security off, a visitor gets every
      row. Switched on with no policy, they get nothing. Switched on with an
      owner policy, each person sees only their own rows.

  - component: image-half-bleed
    title: "What It Costs to Start"
    image_side: right
    image:
      type: image
      path: "examples/assets/supabase/pricing.png"
      fit: contain
      alt: "Screenshot of supabase.com/pricing, captured 2026-10-21"
    content:
      - type: text
        content: "Free to begin"
      - type: text
        content: "500 MB of database"
      - type: text
        content: "50,000 users a month"
    source: "https://supabase.com/pricing"
    notes: >-
      Starting costs nothing. The free plan includes a five hundred megabyte
      database and up to fifty thousand monthly active users, which is far more
      than a class project needs.

  - component: table-slide
    title: "A Real Project That Uses It"
    headers: ["What it stores", "Example"]
    rows:
      - ["Court opinions", "Thousands, fetched daily"]
      - ["Is it about asylum?", "A yes or a no each"]
      - ["Case details", "Country, outcome, more"]
    notes: >-
      A real example: the ninth_circuit project keeps its court opinions in
      Supabase — thousands of them, fetched daily — along with a yes-or-no for
      whether each concerns asylum and the case details pulled out of it.

  - component: table-slide
    title: "Screenshots, Captured 21 Oct 2026"
    headers: ["Screenshot", "Captured from"]
    rows:
      - ["Homepage, editor, sign-in", "supabase.com"]
      - ["Two ways to make a table", "supabase.com/docs"]
      - ["Claude and MCP setup", "supabase.com/docs"]
      - ["Security warning", "supabase.com/docs"]
      - ["Pricing", "supabase.com/pricing"]
    notes: >-
      Every screenshot was captured on the twenty-first of October 2026 from the
      pages listed here, and each slide's Source link opens the exact page.

  - component: numbered-steps
    title: "Your First Session With Claude"
    steps:
      - title: "Connect Claude to Supabase"
        body: "One claude mcp add command"
      - title: "Describe the table you need"
        body: "In plain words; Claude writes the SQL"
      - title: "Read it, then approve it"
        body: "Check that RLS is switched on"
    notes: >-
      Your first session takes three steps. Connect Claude Code to Supabase with
      a single claude mcp add command, describe the table you need in plain
      words so Claude writes the SQL, then read that SQL before you approve it —
      and check that row level security is switched on.
