version: 1
theme:
  palette:
    primary: "#1B4F8A"
    surface: "#FFFFFF"
    accent: "#E84545"
    text: "#1A1A2E"
    muted: "#8A8A9A"
  type_scale:
    title: 60
    header: 42
    body: 34
    caption: 25
  font: arial
  motif: minimal
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true
slides:
  - component: title-slide
    title: "Annual Strategy Review"
    subtitle: "Executive Leadership — January 2026"

  - component: stat-callout
    title: "2025 Results at a Glance"
    stats:
      - value: "127%"
        label: "Revenue Target"
        subtext: "$3.8B total"
      - value: "94%"
        label: "Retention Rate"
      - value: "48 NPS"
        label: "Net Promoter"
        subtext: "+12 pts YoY"

  - component: comparison-columns
    title: "What Drove Growth"
    left_title: "Enterprise & Products"
    right_title: "Core & Channel"
    left_items:
      - text: "Enterprise up 42%"
      - text: "APAC beat forecast 31%"
      - text: "New products: 18%"
    right_items:
      - text: "SMB churn down"
      - text: "Services attach: 34→51%"
      - text: "Partner channel: 28%"

  - component: timeline
    title: "Strategic Priorities 2026"
    events:
      - date: "Q1"
        title: "Foundation"
        description: "Merge legacy systems; unified data layer."
      - date: "Q2"
        title: "AI Assist"
        description: "AI workflows GA for all customers."
      - date: "Q3"
        title: "Expansion"
        description: "Fortune 500 sales motion launched."
      - date: "Q4"
        title: "Open Beta"
        description: "ISV program; target 50 partners."

  - component: card-grid
    title: "Investment Areas"
    cards:
      - icon: code
        title: "Build"
        body: "Reliability and dev tooling."
      - icon: users
        title: "Growth"
        body: "Enterprise sales and channels."
      - icon: globe
        title: "Global"
        body: "APAC and EMEA expansion."
      - icon: chart-up
        title: "Analytics"
        body: "Customer and usage insights."
