# What Is MCP? — an entry-level tour of the Model Context Protocol.
#
# Sources are Anthropic's and the protocol's own. Screenshots captured on
# 2026-10-21 with headless Chromium, cropped to the 1290x1000 image slot:
#   assets/mcp/intro.png ......... https://modelcontextprotocol.io/docs/getting-started/intro
#   assets/mcp/announce.png ...... https://www.anthropic.com/news/model-context-protocol
#   assets/mcp/server.png ........ https://modelcontextprotocol.io/docs/learn/server-concepts
#   assets/mcp/servers.png ....... https://github.com/modelcontextprotocol/servers
#   assets/mcp/cc.png ............ https://code.claude.com/docs/en/mcp
# One diagram is redrawn rather than captured:
#   assets/mcp/architecture.png .. simplified from the Mermaid diagram on
#                                  https://modelcontextprotocol.io/docs/learn/architecture
#                                  (source: assets/mcp/source/architecture.mmd)
# Protocol facts follow the spec version current on that date, 2026-07-28.
#
# Three-colour rule: `primary` is collapsed onto `accent`, and the redrawn
# diagram uses only white, blue and ink. Screenshots are shown as captured.
version: 1
theme:
  font: arial
  palette:
    primary: "#0072CE"
    accent: "#0072CE"
    muted: "#0A2240"   # grey would be a fourth colour; collapse onto ink
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  - component: title-slide
    title: "What Is MCP?"
    subtitle: "The Model Context Protocol, from the source"
    notes: >-
      This is an entry-level tour of MCP, the Model Context Protocol, using the
      protocol's own documentation and Anthropic's announcement as sources.

  - component: question
    question: "What can an AI app reach?"
    notes: >-
      On its own, an AI app only knows what you type into it. The question MCP
      answers is how it reaches everything else — your files, your tools, your
      data.

  - component: definition
    term: "MCP"
    definition: "An open standard for connecting AI apps to systems"
    notes: >-
      MCP is an open standard for connecting AI applications to the external
      systems where your information and tools actually live.

  - component: image-half-bleed
    title: "The Official Analogy"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/intro.png"
      fit: contain
      alt: "Screenshot of modelcontextprotocol.io, What is MCP?, captured 2026-10-21"
    content:
      - type: text
        content: "A USB-C port for AI"
      - type: text
        content: "One plug, many devices"
      - type: text
        content: "One protocol, many tools"
    source: "https://modelcontextprotocol.io/docs/getting-started/intro"
    notes: >-
      The protocol's own site puts it this way: MCP is like a USB-C port for AI
      applications. One standard plug connects many devices, and one protocol
      connects an AI app to many tools.

  - component: image-half-bleed
    title: "Where It Came From"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/announce.png"
      fit: contain
      alt: "Screenshot of Anthropic's announcement, Introducing the Model Context Protocol, captured 2026-10-21"
    content:
      - type: text
        content: "Anthropic, November 2024"
      - type: text
        content: "Open source from day one"
      - type: text
        content: "Replaced one-off links"
    source: "https://www.anthropic.com/news/model-context-protocol"
    notes: >-
      Anthropic open-sourced MCP in November 2024. Before it, every data source
      needed its own custom connection, and the announcement describes MCP as
      replacing those fragmented links with a single protocol.

  - component: icon-text-rows
    title: "Three Participants"
    rows:
      - icon: "users"
        heading: "Host"
        body: "The AI app, such as Claude Code"
      - icon: "loop"
        heading: "Client"
        body: "One connection to one server"
      - icon: "file"
        heading: "Server"
        body: "A program that offers context"
    notes: >-
      There are three participants. The host is the AI application, such as
      Claude Code. A client is one connection to one server. And a server is a
      program that offers context to the app.

  - component: image-half-bleed
    title: "How They Connect"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/architecture.png"
      fit: contain
      alt: "Diagram of an MCP host with two clients connected to a local and a remote server, redrawn from modelcontextprotocol.io"
    content:
      - type: text
        content: "One client per server"
      - type: text
        content: "Local servers use stdio"
      - type: text
        content: "Remote servers use HTTP"
    source: "https://modelcontextprotocol.io/docs/learn/architecture"
    notes: >-
      The host creates one client for each server it connects to. A server on
      your own machine talks over standard input and output, called stdio, and a
      remote server talks over HTTP.

  - component: image-half-bleed
    title: "What a Server Offers"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/server.png"
      fit: contain
      alt: "Screenshot of modelcontextprotocol.io, Understanding MCP servers, captured 2026-10-21"
    content:
      - type: text
        content: "Tools: actions to take"
      - type: text
        content: "Resources: data to read"
      - type: text
        content: "Prompts: ready templates"
    source: "https://modelcontextprotocol.io/docs/learn/server-concepts"
    notes: >-
      A server offers three kinds of thing: tools, which are actions the AI can
      take; resources, which are data it can read; and prompts, which are
      ready-made templates for common tasks.

  - component: table-slide
    title: "Who Controls Each One"
    headers: ["Feature", "Controlled by", "Example"]
    rows:
      - ["Tools", "The model", "Search flights"]
      - ["Resources", "The application", "Read a calendar"]
      - ["Prompts", "The user", "Plan a vacation"]
    notes: >-
      Each one has a different owner. The model decides when to call a tool, the
      application decides which resources to include, and the user chooses a
      prompt — those are the documentation's own examples.

  - component: numbered-steps
    title: "One Tool Call, Step by Step"
    steps:
      - title: "Discover"
        body: "The app asks the server for its tools"
      - title: "Decide"
        body: "The model picks one for the task"
      - title: "Call"
        body: "The server runs it and sends back a result"
    notes: >-
      A tool call happens in three steps. The app asks the server which tools it
      has, the model picks one that fits the task, and the server runs it and
      sends the result back into the conversation.

  - component: bullet-list
    title: "What Travels Between Them"
    items:
      - "JSON-RPC 2.0 messages"
      - "Each request carries the version"
      - "Servers say what they support"
      - "Same format, local or remote"
    notes: >-
      Under the hood the messages are JSON-RPC 2.0. Every request carries the
      protocol version, servers announce what they support, and the format is
      identical whether the server is local or remote.

  - component: image-half-bleed
    title: "Ready-Made Servers"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/servers.png"
      fit: contain
      alt: "Screenshot of github.com/modelcontextprotocol/servers, captured 2026-10-21"
    content:
      - type: text
        content: "Open-source examples"
      - type: text
        content: "91.4k stars on GitHub"
      - type: text
        content: "Start from one of these"
    source: "https://github.com/modelcontextprotocol/servers"
    notes: >-
      You rarely start from nothing. The protocol's reference servers are open
      source on GitHub, with ninety-one thousand stars on the day these
      screenshots were taken.

  - component: image-half-bleed
    title: "Using It From Claude Code"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/cc.png"
      fit: contain
      alt: "Screenshot of the Claude Code documentation page on MCP, captured 2026-10-21"
    content:
      - type: text
        content: "Hundreds of tools"
      - type: text
        content: "Connect, then just ask"
      - type: text
        content: "Documented by Anthropic"
    source: "https://code.claude.com/docs/en/mcp"
    notes: >-
      Claude Code is one host you can try today. Its documentation says it can
      connect to hundreds of external tools this way, and once a server is
      connected you simply ask Claude to use it.

  - component: table-slide
    title: "Adding a Server"
    headers: ["To do this", "Use"]
    rows:
      - ["Add a server", "claude mcp add"]
      - ["See your servers", "claude mcp list"]
      - ["Remote, e.g. Notion", "--transport http"]
      - ["Local, e.g. Airtable", "--transport stdio"]
    notes: >-
      Two commands do most of the work: claude mcp add to connect a server and
      claude mcp list to see what you have. A remote server such as Notion uses
      the HTTP transport, and a local one such as Airtable uses stdio.

  - component: bullet-list
    title: "Use It Safely"
    items:
      - "Only connect servers you trust"
      - "Fetched content can carry instructions"
      - "Approve tool calls you did not expect"
      - "A local server runs with your access"
    notes: >-
      Anthropic's own advice is to verify you trust each server before you
      connect it, because content a server fetches can carry hidden instructions.
      Approve only the tool calls you expect, and remember a local server runs
      with your access.

  - component: two-panel-list
    title: "What MCP Is, and Is Not"
    left:
      title: "It is"
      items:
        - "A protocol for context"
        - "Open source"
        - "The same for every app"
    right:
      title: "It is not"
      items:
        - "An AI model"
        - "An app you install"
        - "A rule for using models"
    accent_side: "left"
    notes: >-
      MCP is a protocol for sharing context, it is open source, and it works the
      same for every app. It is not a model, not an app you install, and it says
      nothing about how an app should use its model.

  - component: numbered-steps
    title: "Your First Ten Minutes"
    steps:
      - title: "Pick a server you trust"
        body: "Start from the reference list"
      - title: "Add it to your host"
        body: "In Claude Code, claude mcp add"
      - title: "Ask for something it does"
        body: "And approve the tool call"
    notes: >-
      To try it: pick a server you trust from the reference list, add it to your
      host — in Claude Code that is claude mcp add — then ask for something only
      that server can do, and approve the call.

  - component: table-slide
    title: "Sources, Captured 21 Oct 2026"
    headers: ["Slide", "Taken from"]
    rows:
      - ["Analogy, architecture", "modelcontextprotocol.io"]
      - ["Server features", "modelcontextprotocol.io"]
      - ["Announcement", "anthropic.com/news"]
      - ["Reference servers", "github.com"]
      - ["Claude Code", "code.claude.com/docs"]
    notes: >-
      Every screenshot was captured on the twenty-first of October 2026 from the
      pages listed here, the architecture diagram is redrawn from the protocol's
      own, and each slide's Source link opens the exact page.

  - component: question
    question: "What would you connect?"
    notes: >-
      So, the question for your own work: what would you connect first?
