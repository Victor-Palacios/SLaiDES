# MCP, Told With Alpaca — an entry-level deck for people new to AI.
#
# One story (Sam, a fictional example student) around one real MCP server:
# Alpaca's official trading server. It answers three questions in order —
# what an MCP server is, how you use one, and when not to trust it.
#
# Sources:
#   How MCP works (slides 4-6) ... "MCP Servers Explained & Built", Tech With Tim
#                                  https://www.youtube.com/watch?v=He8tUwLzLnU
#   Alpaca's server .............. https://github.com/alpacahq/alpaca-mcp-server
#                                  (README: setup, toolsets, paper default, tool list,
#                                  "do not expose it directly to the public internet",
#                                  disclosure; src/alpaca_mcp_server/security.py:
#                                  the untrusted-output warning). Read 2026-10-21.
#   Claude Code commands ......... https://code.claude.com/docs/en/mcp
#                                  (`--env` needs another option before the name;
#                                  `/mcp` shows connected servers)
#   Approval prompts ............. https://code.claude.com/docs/en/permissions
#   The fake server .............. https://snyk.io/blog/malicious-mcp-server-on-npm-postmark-mcp-harvests-emails/
#
# Assets:
#   assets/mcp/alpaca-readme.png .. github.com/alpacahq/alpaca-mcp-server README
#                                   (screenshot, captured 2026-10-21)
#   assets/mcp/alpaca-warning.png . .../blob/main/src/alpaca_mcp_server/security.py#L22-L40
#                                   (screenshot, captured 2026-10-21)
#   assets/mcp/postmark-case.png .. the Snyk report above (screenshot, captured 2026-10-21)
#   assets/mcp/video.png .......... the tutorial's public thumbnail
#                                   (https://i.ytimg.com/vi/He8tUwLzLnU/sddefault.jpg,
#                                   letterbox cropped, fetched 2026-10-21)
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  - component: title-slide
    title: "MCP, Told With Alpaca"
    subtitle: "Claude, a trading app, and trust"
    notes: >-
      Today we learn MCP through one story: Claude, a real trading app called
      Alpaca, and the question of when to trust them.

  - component: agenda
    title: "What We Will Cover"
    items:
      - "What an MCP server is"
      - "Sam connects Alpaca"
      - "Sam's first trade"
      - "When not to trust it"
    notes: >-
      Four parts. We see what an MCP server is, watch Sam connect Alpaca to
      Claude, follow Sam's first trade, and finish with when not to trust it.

  - component: icon-text-rows
    title: "Meet Sam, Our Example"
    rows:
      - icon: "user"
        heading: "Who"
        body: "A student learning to invest"
      - icon: "target"
        heading: "The goal"
        body: "Practise without losing money"
      - icon: "zap"
        heading: "The tool"
        body: "Claude Code"
    notes: >-
      Meet Sam, an example student we made up. Sam is learning to invest, wants
      to practise without losing any money, and already uses Claude Code.

  - component: this-vs-that
    title: "What MCP Changes"
    left:
      value: "Alone"
      label: "Claude only writes text"
    right:
      value: "With MCP"
      label: "Claude can use apps"
    notes: >-
      On its own, Claude only takes in text and writes text back: it can't look
      up a price or place an order. With MCP, Claude can use real apps on your
      behalf.

  - component: definition
    term: "MCP Server"
    definition: "A program that lists actions Claude can ask it to do."
    notes: >-
      An MCP server is a program that gives Claude a list of actions, and does
      any of them when Claude asks. Each app that wants to work with Claude can
      offer one.

  - component: numbered-steps
    title: "One Question, Three Steps"
    steps:
      - title: "Sam asks Claude"
        body: "What is Apple trading at?"
      - title: "Claude asks the server"
        body: "It picks the price action"
      - title: "Claude answers"
        body: "In plain words"
    notes: >-
      Here is one question in three steps. Sam asks Claude what Apple is trading
      at. Claude asks the server to run its price action — Claude never touches
      Alpaca itself. Then Claude answers in plain words.

  - component: image-half-bleed
    title: "Alpaca's Own Server"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/alpaca-readme.png"
      fit: contain
      alt: "Screenshot of the README of github.com/alpacahq/alpaca-mcp-server, captured 2026-10-21"
    content:
      - type: text
        content: "Made by Alpaca itself"
      - type: text
        content: "Free to install"
      - type: text
        content: "Works with Claude"
    source: "https://github.com/alpacahq/alpaca-mcp-server"
    notes: >-
      Alpaca is a stock-trading app, and it publishes its own MCP server on
      GitHub. It is free to install, and it works with Claude.

  - component: table-slide
    title: "What It Lets Claude Do"
    headers: ["Kind", "Sam could ask"]
    rows:
      - ["Look", "What is Apple at?"]
      - ["Check", "What do I own?"]
      - ["Act", "Cancel my open orders"]
    notes: >-
      Its actions come in three kinds. Claude can look things up, like Apple's
      price; check Sam's account, like what Sam owns; and act, like cancelling
      open orders. The last kind changes things, and we come back to it.

  - component: definition
    term: "Paper Trading"
    definition: "Trading with pretend money, so mistakes cost nothing."
    notes: >-
      Sam starts with paper trading: trading with pretend money, so every
      mistake is free. Alpaca gives anyone a free paper account.

  - component: numbered-steps
    title: "Sam Sets It Up"
    steps:
      - title: "Open a paper account"
        body: "Free, on alpaca.markets"
      - title: "Make two keys"
        body: "On the Alpaca dashboard"
      - title: "Add the server"
        body: "One command in Claude Code"
    notes: >-
      Setting it up takes three steps. Sam opens a free paper account on Alpaca,
      makes two keys on the dashboard, and adds the server to Claude Code with
      one command.

  - component: code
    title: "Adding the server"
    code: |
      $ claude mcp add \
          --env ALPACA_API_KEY=… \
          --env ALPACA_SECRET_KEY=… \
          --transport stdio alpaca \
          -- uvx alpaca-mcp-server

      > /mcp
    notes: >-
      Here is that command. The two keys go in as settings, the last line names
      the program to run, and then typing slash mcp inside Claude Code shows the
      server is connected.

  - component: numbered-steps
    title: "Sam's First Trade"
    steps:
      - title: "Sam asks"
        body: "Buy 5 shares of Apple"
      - title: "Claude Code checks first"
        body: "Sam reads it and says yes"
      - title: "Alpaca fills the order"
        body: "With pretend money"
    notes: >-
      Now Sam's first trade. Sam asks Claude to buy five shares of Apple. Before
      anything happens, Claude Code shows the request and Sam reads it and says
      yes. Then Alpaca fills the order, with pretend money.

  - component: definition
    term: "close_all_positions"
    definition: "Alpaca's own description: liquidate entire portfolio."
    notes: >-
      Now, when not to trust it. One of Alpaca's actions is called close all
      positions, and Alpaca describes it as liquidating your entire portfolio.
      That is why you read every request before you say yes.

  - component: definition
    term: "Prompt Injection"
    definition: "Orders hidden in text that Claude reads, like news."
    notes: >-
      The next risk is prompt injection: orders hidden inside text that Claude
      reads, such as a news story, written to make Claude do something you never
      asked for.

  - component: this-vs-that
    title: "An Imagined Example"
    left:
      value: "Asked"
      label: "Summarise Apple news"
    right:
      value: "Hidden"
      label: "Also sell everything"
    notes: >-
      Here is an imagined example. Sam asks for a summary of Apple news, and one
      article has a hidden line telling the AI to also sell everything.

  - component: image-half-bleed
    title: "Alpaca Warns Claude Too"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/alpaca-warning.png"
      fit: contain
      alt: "Screenshot of security.py in alpacahq/alpaca-mcp-server, lines 22 to 40, captured 2026-10-21"
    content:
      - type: text
        content: "News is marked untrusted"
      - type: text
        content: "Read it, never obey it"
      - type: text
        content: "A warning, not a lock"
    source: "https://github.com/alpacahq/alpaca-mcp-server/blob/main/src/alpaca_mcp_server/security.py"
    notes: >-
      Alpaca knows this. Its server marks news as untrusted and tells Claude to
      read it but never obey it. That is a warning, not a lock, so it can still
      fail.

  - component: code
    title: "Prices only, no trading"
    code: |
      "env": {
        "ALPACA_TOOLSETS":
          "stock-data"
      }
    notes: >-
      A lock you control is turning actions off. With this one setting, Sam's
      server offers only price data, so even a tricked Claude has no way to
      trade.

  - component: image-half-bleed
    title: "Fake Servers Exist"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/postmark-case.png"
      fit: contain
      alt: "Screenshot of Snyk's report, Malicious MCP Server on npm postmark-mcp Harvests Emails, captured 2026-10-21"
    content:
      - type: text
        content: "A copy of a real server"
      - type: text
        content: "Honest for 15 versions"
      - type: text
        content: "Then copied every email"
    source: "https://snyk.io/blog/malicious-mcp-server-on-npm-postmark-mcp-harvests-emails/"
    notes: >-
      The server itself can be the danger. In September 2025, a copy of a real
      email server called postmark-mcp worked honestly for fifteen versions,
      then quietly sent a copy of every email to a stranger.

  - component: bullet-list
    title: "Get the Real One"
    items:
      - "Publisher: alpacahq on GitHub"
      - "Package: alpaca-mcp-server"
      - "Pin the version you checked"
    notes: >-
      So Sam gets the real one: published by alpacahq on GitHub, with the
      package name alpaca-mcp-server spelled exactly, and pinned to the version
      Sam checked so an update can't change it silently.

  - component: this-vs-that
    title: "Pretend Money, Real Money"
    left:
      value: "Paper"
      label: "The default setting"
    right:
      value: "Live"
      label: "One setting away"
    notes: >-
      Pretend money is the default setting on Alpaca's server, but real money is
      only one setting away. Sam stays on paper until every habit in this deck
      is second nature.

  - component: bullet-list
    title: "Keys Work Like Passwords"
    items:
      - "Never commit them to GitHub"
      - "Never put the server online"
      - "Make new keys if they leak"
    notes: >-
      Sam's two keys work like passwords. Never commit them to GitHub, and never
      put the server on the internet — Alpaca's own instructions say not to,
      because it has no login of its own. If a key leaks, make new ones.

  - component: pull-quote
    quote: "…not be taken as investment advice."
    attribution: "Alpaca's MCP server README"
    notes: >-
      And Alpaca says it plainly: what its server and the AI tell you should not
      be taken as investment advice. Claude can place the trade; the decision is
      still yours.

  - component: image-half-bleed
    title: "Want to Build One?"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/video.png"
      fit: contain
      alt: "Thumbnail of the YouTube video MCP Servers Explained and Built by Tech With Tim"
    content:
      - type: text
        content: "Tech With Tim's tutorial"
      - type: text
        content: "Builds a small server"
      - type: text
        content: "Then adds a real login"
    source: "https://www.youtube.com/watch?v=He8tUwLzLnU"
    notes: >-
      If you want to build a server yourself, Tech With Tim's thirty-minute
      tutorial builds a small one in Python and then adds a real login. It is
      also where our explanation of how MCP works comes from.

  - component: table-slide
    title: "Sources"
    headers: ["Part", "Taken from"]
    rows:
      - ["How MCP works", "Tech With Tim, YouTube"]
      - ["Alpaca's server", "github.com/alpacahq"]
      - ["Claude commands", "code.claude.com/docs"]
      - ["The fake server", "snyk.io/blog"]
    notes: >-
      How MCP works comes from Tech With Tim's tutorial, everything about
      Alpaca's server from Alpaca's own GitHub page, the commands from the
      Claude Code docs, and the fake server from Snyk's report.

  - component: bullet-list
    title: "Before You Trust a Server"
    items:
      - "Check who published it"
      - "Check what its actions can do"
      - "Turn off what you don't need"
      - "Start with pretend money"
    notes: >-
      So before you trust any MCP server: check who published it, check what
      its actions can do, turn off the ones you don't need, and start with
      pretend money.
