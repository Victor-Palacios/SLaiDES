# MCP, as One Story — an entry-level deck with no protocol jargon.
#
# Built as a single use-case story (Maya, a fictional example student) plus one
# real incident. Sources:
#   assets/mcp/intro.png .......... https://modelcontextprotocol.io/docs/getting-started/intro
#                                   (screenshot, captured 2026-10-21)
#   assets/mcp/cc.png ............. https://code.claude.com/docs/en/mcp
#                                   (screenshot, captured 2026-10-21)
#   assets/mcp/postmark-case.png .. https://snyk.io/blog/malicious-mcp-server-on-npm-postmark-mcp-harvests-emails/
#                                   (screenshot, captured 2026-10-21; the facts used
#                                   are the ones Snyk, The Hacker News and Dark Reading
#                                   agree on — contested download counts are left out)
#   assets/mcp/story.png .......... drawn for this deck with Mermaid
#                                   (source: assets/mcp/source/story.mmd), after
#                                   https://modelcontextprotocol.io/docs/learn/architecture
#
# Operator rules applied: 15 slides; a story, not protocol vocabulary; no history
# slide; the deck ends on its last real content, not a question; three colours.
version: 1
theme:
  font: arial
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: true

slides:
  - component: title-slide
    title: "MCP, as One Story"
    subtitle: "How Claude reaches your tools, and the risks"
    notes: >-
      This is MCP told as one story: how Claude reaches the tools you already
      use, and what happens when one of those tools is not what it claims.

  - component: icon-text-rows
    title: "Meet Maya, Our Example"
    rows:
      - icon: "users"
        heading: "Who she is"
        body: "A student building a class app"
      - icon: "file"
        heading: "Her data"
        body: "Kept in Supabase"
      - icon: "check"
        heading: "Her code"
        body: "Kept on GitHub"
    notes: >-
      Meet Maya, an example student. She is building an app for a class, her data
      lives in Supabase, and her code lives on GitHub.

  - component: numbered-steps
    title: "Her Afternoon, Without MCP"
    steps:
      - title: "Copy the numbers"
        body: "Open Supabase, copy this week's sign-ups"
      - title: "Paste them into Claude"
        body: "Ask what changed since last week"
      - title: "Copy the answer to GitHub"
        body: "Paste it into a new issue by hand"
    notes: >-
      Without MCP, Maya's afternoon is copying and pasting. She copies this
      week's sign-ups out of Supabase, pastes them into Claude to ask what
      changed, then copies the answer into a GitHub issue by hand.

  - component: image-half-bleed
    title: "The Idea: One Plug"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/intro.png"
      fit: contain
      alt: "Screenshot of modelcontextprotocol.io, What is MCP?, captured 2026-10-21"
    content:
      - type: text
        content: "A USB-C port for AI"
      - type: text
        content: "One plug, many tools"
      - type: text
        content: "From the official site"
    source: "https://modelcontextprotocol.io/docs/getting-started/intro"
    notes: >-
      MCP's own site explains it as a USB-C port for AI: one standard plug, so
      an AI app can connect to many different tools the same way.

  - component: numbered-steps
    title: "Her Afternoon, With MCP"
    steps:
      - title: "Ask one question"
        body: "Did sign-ups drop this week?"
      - title: "Claude checks Supabase"
        body: "It reads the table itself"
      - title: "Claude files the issue"
        body: "On GitHub, once she approves it"
    notes: >-
      With MCP, Maya asks one question: did sign-ups drop this week? Claude reads
      the table in Supabase itself, and files the GitHub issue once she approves
      it.

  - component: image-half-bleed
    title: "What Is Actually Connected"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/story.png"
      fit: contain
      alt: "Diagram: Claude Code on Maya's laptop with one MCP connection to Supabase and one to GitHub"
    content:
      - type: text
        content: "One connection per tool"
      - type: text
        content: "Each is a small program"
      - type: text
        content: "Someone wrote each one"
    source: "https://modelcontextprotocol.io/docs/learn/architecture"
    notes: >-
      Behind the scenes, Claude Code has one connection per tool. Each connection
      is a small program that someone wrote — and that detail matters later in
      the story.

  - component: table-slide
    title: "What a Connection Can Offer"
    headers: ["It can offer", "For Maya"]
    rows:
      - ["Actions to take", "Open a GitHub issue"]
      - ["Things to read", "This week's sign-ups"]
      - ["Ready-made requests", "Summarise the week"]
    notes: >-
      A connection can offer three kinds of thing: actions Claude can take, like
      opening an issue; things it can read, like this week's sign-ups; and
      ready-made requests, like summarising the week.

  - component: image-half-bleed
    title: "Setting It Up"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/cc.png"
      fit: contain
      alt: "Screenshot of the Claude Code documentation page on MCP, captured 2026-10-21"
    content:
      - type: text
        content: "One command per tool"
      - type: text
        content: "Documented by Anthropic"
      - type: text
        content: "Then Maya just asks"
    source: "https://code.claude.com/docs/en/mcp"
    notes: >-
      Setting it up is one command per tool, documented by Anthropic. After that,
      Maya simply asks for what she wants.

  - component: question
    question: "What if the program lies?"
    notes: >-
      Every connection is a program someone else wrote. So here is the question
      the rest of this deck answers: what if that program lies?

  - component: image-half-bleed
    title: "This Really Happened"
    image_side: right
    image:
      type: image
      path: "examples/assets/mcp/postmark-case.png"
      fit: contain
      alt: "Screenshot of Snyk's report, Malicious MCP Server on npm postmark-mcp Harvests Emails, captured 2026-10-21"
    content:
      - type: text
        content: "A fake email tool"
      - type: text
        content: "It worked as promised"
      - type: text
        content: "Then one line changed"
    source: "https://snyk.io/blog/malicious-mcp-server-on-npm-postmark-mcp-harvests-emails/"
    notes: >-
      This really happened in September 2025. A connection for sending email,
      called postmark-mcp, worked exactly as promised — until one line of it
      changed.

  - component: numbered-steps
    title: "How the Trap Worked"
    steps:
      - title: "Copy a real tool"
        body: "The genuine one, from the email company"
      - title: "Earn trust"
        body: "Fifteen honest versions in a row"
      - title: "Add one hidden line"
        body: "In version 1.0.16"
    notes: >-
      The trap took three moves. Copy the genuine tool from the email company.
      Publish fifteen honest versions so people trust it. Then add one hidden
      line in version 1.0.16.

  - component: this-vs-that
    title: "What the Hidden Line Did"
    left:
      value: "Sent"
      label: "What the user saw"
    right:
      value: "Copied"
      label: "A copy to a stranger"
    notes: >-
      The user saw an email sent, exactly as asked. What actually happened is
      that a secret copy of every email went to a stranger.

  - component: bullet-list
    title: "What a Copy Could Hold"
    items:
      - "Password reset links"
      - "Invoices"
      - "Internal company mail"
      - "Anything Claude wrote for you"
    notes: >-
      Those copies could hold password reset links, invoices, internal company
      mail — anything the AI had been asked to send.

  - component: table-slide
    title: "Sources"
    headers: ["Slide", "Taken from"]
    rows:
      - ["The one-plug idea", "modelcontextprotocol.io"]
      - ["Setting it up", "code.claude.com/docs"]
      - ["The real case", "snyk.io/blog"]
      - ["Maya's diagram", "Drawn for this deck"]
    notes: >-
      The screenshots were captured on the twenty-first of October 2026, the
      real case comes from Snyk's report, and Maya is an example we made up to
      tell the story.

  - component: bullet-list
    title: "How Maya Stays Safe"
    items:
      - "Use the official publisher's tool"
      - "Pin the version she checked"
      - "Approve each action Claude takes"
      - "Give each tool only what it needs"
    notes: >-
      So Maya uses the official publisher's tool, pins the version she checked
      so a silent update cannot change it, approves each action Claude takes, and
      gives each tool only the access it needs.
