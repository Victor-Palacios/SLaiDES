version: 1
theme:
  palette:
    primary: "#263238"
    surface: "#ECEFF1"
    accent: "#FF5722"
    text: "#212121"
    muted: "#78909C"
  type_scale:
    title: 54
    header: 40
    body: 32
    caption: 24
  font: courier new
  spacing_unit: 10
  motif: technical
page_numbers:
  enabled: true
  start_at: 1
  skip_title_slide: false
slides:
  - component: title-slide
    title: "Component Gallery"
    subtitle: "All eight components in one deck"

  - component: icon-text-rows
    title: "Icon Text Rows"
    rows:
      - icon: rocket
        heading: "Speed"
        body: "Deploy in minutes."
      - icon: lock
        heading: "Security"
        body: "Safe by default."
      - icon: chart-up
        heading: "Scale"
        body: "Grows with you."

  - component: stat-callout
    title: "Stat Callout"
    stats:
      - value: "99.9%"
        label: "Uptime"
      - value: "< 50ms"
        label: "Latency"
        subtext: "p99 globally"
      - value: "500+"
        label: "Integrations"

  - component: comparison-columns
    title: "Comparison Columns"
    left_title: "Before"
    right_title: "After"
    left_items:
      - text: "Manual; error-prone"
      - text: "Weekly reports"
    right_items:
      - text: "Automated; reliable"
      - text: "Real-time data"

  - component: timeline
    title: "Timeline"
    events:
      - date: "Month 1"
        title: "Kickoff"
        description: "Setup and team training."
      - date: "Month 3"
        title: "Go Live"
        description: "Full production rollout."
      - date: "Month 6"
        title: "Growth"
        description: "Tuning and expansion."

  - component: image-half-bleed
    title: "Image Half Bleed"
    image_side: right
    image:
      type: image
      path: "assets/placeholder.jpg"
      fit: cover
      alt: "Placeholder image"
    content:
      - type: text
        content: "Full-bleed image with text side."

  - component: card-grid
    title: "Card Grid"
    cards:
      - icon: star
        title: "Feature A"
        body: "Fast and reliable."
      - icon: bolt
        title: "Feature B"
        body: "Secure by design."
      - icon: shield
        title: "Feature C"
        body: "Scales with you."
      - icon: globe
        title: "Feature D"
        body: "Pay as you go."
