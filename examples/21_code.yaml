version: 1
theme:
  palette:
    primary: "#0B3D2E"
    surface: "#FFFFFF"
    accent: "#1FA463"
    text: "#1A1A2E"
    muted: "#8A8A9A"
  font: calibri
page_numbers:
  enabled: false
slides:
  - component: code
    title: "hello.py"
    chrome: true
    code: |
      # The classic, end to end
      def main():
          print("Hello, world!")

      main()

      $ python hello.py
      Hello, world!
