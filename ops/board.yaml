# Agile task board — source of truth. Render to BOARD.md with:
#   python scripts/render_board.py
#
# This board is the retrospective record of how slidekit was built: three closed
# sprints, the user stories from docs/USER_STORIES.md scheduled into them, and the
# cards that delivered each story. PROGRESS.md remains the phase/acceptance ledger.
#
# Only work that actually shipped is recorded. Cards for the seven layouts we later
# retired are folded into a single retirement card rather than listed individually,
# and the one never-completed item (aesthetic weight calibration against a human-
# labelled set — it needed a dataset we never had) is dropped rather than parked.
#
# Schema: sprints -> stories -> tasks. A story's `status` is cross-checked against
# its own cards by scripts/render_board.py, so the board cannot claim a story is
# delivered while work under it is open.
version: 1

columns: [backlog, todo, in_progress, blocked, done]

sprints:
  - id: S1
    title: "Provable layout core"
    goal: >-
      Build a deck from declarative YAML to PowerPoint with every rect proven from
      real font metrics, and prove defects are caught by a linter rather than by
      looking at screenshots.
    starts: 2026-06-01
    ends: 2026-06-13
    status: complete
  - id: S2
    title: "Design library and measured quality"
    goal: >-
      Grow eight components into a thirty-component library an agent can choose from
      without vision, add a PDF path, and put numbers on visual quality with a
      research-grounded aesthetics score.
    starts: 2026-06-14
    ends: 2026-07-02
    status: complete
  - id: S3
    title: "Review loop and shareable output"
    goal: >-
      Close the loop with the operator: a private per-slide review site whose
      feedback becomes work automatically, and decks that survive import into
      Google Slides as editable, correctly numbered slides.
    starts: 2026-07-03
    ends: 2026-08-24
    status: complete

epics:
  - {id: authoring, title: "Epic A — Authoring decks", tag: A}
  - {id: output,    title: "Epic B — Output & sharing", tag: B}
  - {id: quality,   title: "Epic C — Quality & correctness", tag: C}
  - {id: review,    title: "Epic D — Review & feedback loop", tag: D}
  - {id: project,   title: "Epic E — Project management & development", tag: E}

