  - {id: T-051, title: "verify color_harmony 30° tolerance against Cohen-Or (#19) exact sector widths", epic: research, column: done, priority: low, created: 2026-06-26, updated: 2026-06-26, notes: "done — extracted Cohen-Or 2006 Appendix from the primary PDF: sector widths 18° (small i/L/I/Y), 79.2° (L large), 93.6° (V/Y/X large), 180° (T); centre separations 90° (L) / 180° (I/X/Y). slidekit's 30° falloff lies WITHIN the 18°–93.6° range and 180° reward matches I/X/Y centre sep → consistent-with, but 30° is not stated by the paper (and 120°/150° reward angles are artist-wheel/Itten, not Cohen-Or centres) → tolerance stays HEURISTIC. No metric change (grounding not recalibration; big-number held 89.5). Updated REFERENCES.md (#19 + log), RESEARCH_TRACE.md (row+scoreboard), AESTHETICS.md, score.py comment, NOTES.md."}
  - {id: T-053, title: "assess info_density words-per-slide / coverage bands against a primary source", epic: research, column: done, priority: low, created: 2026-06-28, updated: 2026-06-28, notes: "done — added ref #23 (Wecker, 'Slide presentations as speech suppressors', Computers & Education 59(2):260-273, 2012, DOI 10.1016/j.compedu.2012.01.013), verified from ERIC EJ966972 + DOI metadata: a controlled experiment (n=209; no-slides/regular/concise) finding text-dense slides suppress retention of oral info via attention misallocation, avoided by concise slides. Strengthens info_density DIRECTION (experiment vs #20 design criteria). Bands stay HEURISTIC: literature gives a minimization principle, not a numeric words-per-slide maximum → 45/130 word + 0.45/0.85 coverage cut-offs are our choice (consistent-with, not stated-by; parallel to #19/#22). No metric change (grounding; big-number held 89.5). Updated REFERENCES.md (#23 + header 23 + log), RESEARCH_TRACE.md (row/scoreboard), AESTHETICS.md, score.py comment, NOTES.md. Refs now 23/23 verified."}
  - {id: T-052, title: "verify hierarchy 1.5× perfect-fifth modular-scale step from a primary typographic source", epic: research, column: done, priority: low, created: 2026-06-27, updated: 2026-06-27, notes: "done — added ref #22 (Brown, 'More Meaningful Typography', A List Apart 2011), verified by fetching the primary article: defines the modular-scale convention, quotes Bringhurst ('Shaping the Page'), builds a scale from a chosen harmonious ratio whose menu includes the perfect fifth (3:2 = 1.5) and golden ratio (1.618). Bounds slidekit's 1.5× step as the perfect-fifth member of that family (not arbitrary); selection of 1.5 stays HEURISTIC (source gives a menu, not a single value) → consistent-with, not stated-by, parallel to #19. No metric change (grounding; big-number held 89.5). Updated REFERENCES.md (#22 + header 22 + log), RESEARCH_TRACE.md (row/scoreboard/gap #2), AESTHETICS.md, score.py comment, NOTES.md. Refs now 22/22 verified."}
  - {id: T-050, title: "ground hierarchy sub-score direction (RESEARCH_TRACE open gap #2); add ref #21 signaling principle", epic: research, column: done, priority: low, created: 2026-06-25, updated: 2026-06-25, notes: "done — hierarchy was the last sub-score tracing to NO primary source. Added ref #21 van Gog signaling/cueing principle (Cambridge Handbook of Multimedia Learning 2021, verified from Cambridge Core) → grounds the metric's DIRECTION (a clear title→body step is a structural cue that highlights organization). Exact 1.5× threshold stays HEURISTIC (perfect-fifth convention; Bringhurst noted as candidate but modular-scale passage only secondhand → not added as verified). No metric behaviour change — grounding not recalibration. Updated REFERENCES.md (21/21), RESEARCH_TRACE.md (gap #2 narrowed), AESTHETICS.md (hierarchy design note), score.py comment. Suite green."}

