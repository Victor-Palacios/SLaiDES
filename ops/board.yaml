# Agile task board — source of truth. Render to BOARD.md with:
#   python scripts/render_board.py
# This is the active/sprint kanban VIEW of the work. PROGRESS.md remains the
# canonical phase/acceptance ledger; this board carries active + recently-done
# cards, not the full history. The nightly maintains both (see NIGHTLY_PROMPT.md
# "TASK BOARD" addendum): move a card to in_progress when picked up, to done (with
# a commit ref in notes) when its acceptance test passes, or to blocked with a
# reason; add newly-discovered tasks; then re-render and commit board.yaml + BOARD.md.
#
# Task fields: id, title, column (must be one of `columns`), epic (optional, must
# be a defined epic id), priority (high|med|low), sprint (optional), created,
# updated (YYYY-MM-DD), notes (short free text — commit ref / blocker reason).
